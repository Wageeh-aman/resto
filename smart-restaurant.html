?<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#FFFCF7" />
<meta name="description" content="نظام مطعم ذكي — طلب من الطاولة عبر QR، سلة، تتبع الطلب، نقاط ولاء، ولوحة كاشير وإدارة." />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2352734D'/%3E%3Ctext x='32' y='45' font-size='34' text-anchor='middle'%3E%F0%9F%8D%BD%EF%B8%8F%3C/text%3E%3C/svg%3E" />
<title>دار الذهب — نظام المطعم الذكي</title>

<style>
/* ============================================================================
   1) متغيرات التصميم (Design Tokens)
   الهوية البصرية كاملة من هنا: Premium Light UI — خلفية عاجية فاتحة + أخضر زيتوني + بيج دافئ.
   يمكن تغييرها بالكامل من لوحة الإدارة > الإعدادات > الهوية (بدون تعديل الكود).
   ========================================================================== */
:root{
  --bg:            #FAF7F0;
  --bg-soft:       #F5F1E6;
  --surface:       #FFFFFF;
  --surface-2:     #FBF8F1;
  --surface-3:     #F1EBDF;
  --line:          #E9E2D7;
  --line-soft:     #F0EAE0;

  --cream:         #302B26;   /* عناوين ونصوص قوية (فاتح: بني فحمي دافئ) */
  --gold:          #52734D;   /* الأخضر الزيتوني الأساسي */
  --gold-2:        #5C8055;   /* زيتوني فاتح (نص مميّز + قمة التدرّج) */
  --gold-deep:     #3F5A3B;   /* زيتوني غامق (التحويم) */

  --caramel:       #D9A15B;   /* كراميل دافئ — لمسات ثانوية فقط */
  --caramel-deep:  #A9762F;   /* كراميل غامق قابل للقراءة على الفاتح */
  --caramel-soft:  #F8EEDC;

  --text:          #302B26;
  --text-2:        #5A544C;
  --muted:         #79736A;

  --ok:            #3E7D57;
  --ok-soft:       #E9F3EC;
  --warn:          #B7791F;
  --warn-soft:     #FBF1DF;
  --danger:        #C0504A;
  --danger-soft:   #FBE9E7;
  --info:          #3B6E9C;
  --info-soft:     #E8F0F8;

  --st-pending:    #B7791F;
  --st-accepted:   #3B6E9C;
  --st-preparing:  #7A5AA6;
  --st-ready:      #3E7D57;
  --st-delivered:  #8A9188;
  --st-cancelled:  #C0504A;

  /* قنوات ألوان قابلة للتركيب داخل rgba() — تُحدَّث تلقائيًا مع تغيير الهوية */
  --olive-rgb:     82,115,77;
  --ink-rgb:       48,43,38;
  --bg-rgb:        250,247,240;

  --r-xs: 8px;
  --r-sm: 12px;
  --r-md: 16px;
  --r-lg: 22px;
  --r-xl: 30px;
  --r-pill: 999px;

  --shadow-1: 0 1px 2px rgba(var(--ink-rgb),.05);
  --shadow-2: 0 8px 24px rgba(var(--ink-rgb),.07);
  --shadow-3: 0 18px 44px rgba(var(--ink-rgb),.11);
  --glow-gold: 0 0 0 1px rgba(var(--olive-rgb),.18), 0 10px 26px rgba(var(--olive-rgb),.12);

  --ring: 0 0 0 3px rgba(var(--olive-rgb),.32);
  --dur: 180ms;
  --ease: cubic-bezier(.22,.61,.36,1);

  --font: system-ui, -apple-system, "Segoe UI", Tahoma, "Noto Sans Arabic", Arial, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --topbar-h: 62px;
  --bottomnav-h: 66px;
  --wrap: 1180px;
}

/* ---------------------------------------------------------------------------
   2) أساسيات
   ------------------------------------------------------------------------ */
*,*::before,*::after{ box-sizing:border-box; }
html,body{ height:100%; }
html{ -webkit-text-size-adjust:100%; }
body{
  margin:0;
  font-family:var(--font);
  background:
    radial-gradient(1200px 620px at 85% -10%, rgba(var(--olive-rgb),.06), transparent 60%),
    radial-gradient(900px 500px at 5% 8%, rgba(217,161,91,.07), transparent 55%),
    var(--bg);
  color:var(--text);
  line-height:1.65;
  font-size:15.5px;
  overflow-x:hidden;
}
h1,h2,h3,h4{ margin:0 0 .4em; line-height:1.3; font-weight:800; letter-spacing:-.2px; }
h1{ font-size:clamp(1.6rem,4.6vw,2.5rem); }
h2{ font-size:clamp(1.2rem,3.2vw,1.6rem); }
h3{ font-size:1.06rem; }
h4{ font-size:.95rem; }
p{ margin:0 0 .7em; color:var(--text-2); }
small{ font-size:.8rem; }
img{ max-width:100%; display:block; }
button,input,select,textarea{ font:inherit; color:inherit; }
ul,ol{ margin:0; padding-inline-start:1.1em; }
a{ color:var(--gold); text-decoration:none; }
a:hover{ text-decoration:underline; }
hr{ border:0; border-top:1px solid var(--line); margin:14px 0; }
[hidden]{ display:none !important; }

/* الأرقام والأسعار والمصطلحات الإنجليزية تُعرض LTR داخل نص عربي (RTL) */
.num,[data-ltr]{ direction:ltr; unicode-bidi:isolate; display:inline-block; font-variant-numeric:tabular-nums; }
.mono{ font-family:var(--font-mono); }
::selection{ background:rgba(var(--olive-rgb),.18); }
:focus-visible{ outline:none; box-shadow:var(--ring); border-radius:var(--r-xs); }

.skip-link{
  position:absolute; inset-inline-start:12px; top:-62px; z-index:999;
  background:var(--gold); color:#FFFFFF; padding:10px 16px; border-radius:var(--r-sm);
  font-weight:800; transition:top var(--dur) var(--ease);
}
.skip-link:focus{ top:12px; }

*::-webkit-scrollbar{ width:10px; height:10px; }
*::-webkit-scrollbar-track{ background:transparent; }
*::-webkit-scrollbar-thumb{ background:var(--surface-3); border-radius:99px; border:2px solid transparent; background-clip:content-box; }
*::-webkit-scrollbar-thumb:hover{ background:var(--gold-deep); background-clip:content-box; }

/* ---------------------------------------------------------------------------
   3) مكوّنات: أزرار / شرائح / بطاقات / شارات / حقول
   ------------------------------------------------------------------------ */
.btn{
  --btn-bg: var(--surface-2);
  --btn-fg: var(--text);
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  min-height:46px; padding:11px 18px;
  background:var(--btn-bg); color:var(--btn-fg);
  border:1px solid var(--line); border-radius:var(--r-pill);
  font-weight:700; cursor:pointer; white-space:nowrap;
  transition:transform var(--dur) var(--ease), filter var(--dur) var(--ease), background var(--dur) var(--ease), border-color var(--dur) var(--ease);
  text-decoration:none;
}
.btn:hover{ filter:brightness(1.12); text-decoration:none; }
.btn:active{ transform:translateY(1px) scale(.99); }
.btn[disabled],.btn.is-disabled{ opacity:.45; cursor:not-allowed; filter:none; }
.btn-primary{ --btn-bg:linear-gradient(180deg,var(--gold-2),var(--gold)); --btn-fg:#FFFFFF; border-color:transparent; box-shadow:0 8px 20px rgba(var(--olive-rgb),.20); }
.btn-primary:hover{ filter:brightness(1.06); box-shadow:0 10px 26px rgba(var(--olive-rgb),.26); }
.btn-ghost{ --btn-bg:var(--surface); border-color:var(--line); color:var(--text-2); }
.btn-danger{ --btn-bg:var(--danger-soft); --btn-fg:#9E3F3A; border-color:#E8C9C6; }
.btn-ok{ --btn-bg:var(--ok-soft); --btn-fg:#2F6446; border-color:#C9E2D2; }
.btn-info{ --btn-bg:var(--info-soft); --btn-fg:#2C5878; border-color:#C9DCEC; }
.btn-warn{ --btn-bg:var(--warn-soft); --btn-fg:#8A5A12; border-color:#EAD9B8; }
.btn-sm{ min-height:38px; padding:7px 13px; font-size:.86rem; }
.btn-lg{ min-height:56px; padding:15px 26px; font-size:1.05rem; }
.btn-block{ width:100%; }

.chip{
  display:inline-flex; align-items:center; gap:7px;
  padding:6px 13px; border-radius:var(--r-pill);
  background:var(--surface-2); border:1px solid var(--line);
  color:var(--text-2); font-size:.85rem; font-weight:700; cursor:pointer;
  transition:all var(--dur) var(--ease);
}
.chip:hover{ border-color:var(--gold-deep); color:var(--gold-deep); }
.chip[aria-pressed="true"],.chip.is-active{
  background:linear-gradient(180deg,var(--gold-2),var(--gold));
  border-color:transparent; color:#FFFFFF;
  box-shadow:0 6px 16px rgba(var(--olive-rgb),.22);
}
.chip[aria-pressed="true"]:hover,.chip.is-active:hover{ color:#FFFFFF; }
.chip-static{ cursor:default; }

.card{ background:var(--surface); border:1px solid var(--line-soft); border-radius:var(--r-lg); box-shadow:var(--shadow-1); }
.card-pad{ padding:18px; }
.card-head{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:16px 18px; border-bottom:1px solid var(--line-soft); flex-wrap:wrap; }
.card-head h3{ margin:0; }
.card-body{ padding:18px; }

.badge{
  display:inline-flex; align-items:center; gap:6px;
  padding:4px 11px; border-radius:var(--r-pill);
  font-size:.76rem; font-weight:800; letter-spacing:.2px;
  background:var(--surface-3); color:var(--text-2); border:1px solid var(--line);
}
.badge-gold{ background:rgba(var(--olive-rgb),.10); color:var(--gold-deep); border-color:rgba(var(--olive-rgb),.30); }
.badge-caramel{ background:var(--caramel-soft); color:var(--caramel-deep); border-color:#EFDCBB; }
.badge-ok{ background:var(--ok-soft); color:#2F6446; border-color:#C9E2D2; }
.badge-warn{ background:var(--warn-soft); color:#8A5A12; border-color:#EAD9B8; }
.badge-danger{ background:var(--danger-soft); color:#9E3F3A; border-color:#E8C9C6; }
.badge-info{ background:var(--info-soft); color:#2C5878; border-color:#C9DCEC; }
.badge-soft{ background:var(--surface-2); color:var(--muted); }
.dot{ width:8px; height:8px; border-radius:50%; background:currentColor; }

.field{ display:block; margin-bottom:14px; }
.field > label,.label{ display:block; margin-bottom:7px; font-size:.86rem; font-weight:700; color:var(--text-2); }
.input,.select,.textarea{
  width:100%; min-height:48px; padding:12px 14px;
  background:var(--surface); border:1px solid var(--line);
  border-radius:var(--r-sm); color:var(--text);
  transition:border-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease), background var(--dur) var(--ease);
}
.textarea{ min-height:92px; resize:vertical; }
.input::placeholder,.textarea::placeholder{ color:var(--muted); }
.input:focus,.select:focus,.textarea:focus{ outline:none; border-color:var(--gold); box-shadow:var(--ring); background:var(--surface-2); }
.input[aria-invalid="true"]{ border-color:var(--danger); box-shadow:0 0 0 3px rgba(192,80,74,.15); }
.hint{ font-size:.79rem; color:var(--muted); margin-top:6px; }
.err{ display:none; font-size:.79rem; color:#C0504A; margin-top:6px; font-weight:700; }
.err.show{ display:block; }
.checkline{ display:flex; align-items:flex-start; gap:10px; font-size:.9rem; color:var(--text-2); cursor:pointer; }
.checkline input{ width:20px; height:20px; margin:2px 0 0; accent-color:var(--gold); flex:none; }

.switch{ position:relative; display:inline-flex; align-items:center; gap:10px; cursor:pointer; user-select:none; }
.switch input{ position:absolute; opacity:0; width:0; height:0; }
.switch .track{ width:50px; height:28px; border-radius:99px; background:var(--surface-3); border:1px solid var(--line); position:relative; transition:all var(--dur) var(--ease); flex:none; }
.switch .track::after{ content:""; position:absolute; top:3px; inset-inline-start:3px; width:20px; height:20px; border-radius:50%; background:var(--muted); transition:all var(--dur) var(--ease); }
.switch input:checked + .track{ background:rgba(var(--olive-rgb),.22); border-color:var(--gold); }
.switch input:checked + .track::after{ inset-inline-start:calc(100% - 23px); background:var(--gold); }
.switch input:focus-visible + .track{ box-shadow:var(--ring); }

.row{ display:flex; gap:12px; align-items:center; }
.row-between{ display:flex; gap:12px; align-items:center; justify-content:space-between; }
.wrap{ flex-wrap:wrap; }
.grid{ display:grid; gap:14px; }
.g-2{ grid-template-columns:repeat(2,minmax(0,1fr)); }
.g-3{ grid-template-columns:repeat(3,minmax(0,1fr)); }
.g-4{ grid-template-columns:repeat(4,minmax(0,1fr)); }
.mt-0{margin-top:0}.mt-1{margin-top:8px}.mt-2{margin-top:16px}.mt-3{margin-top:24px}.mt-4{margin-top:32px}
.mb-0{margin-bottom:0}.mb-1{margin-bottom:8px}.mb-2{margin-bottom:16px}.mb-3{margin-bottom:24px}
.muted{ color:var(--muted); } .text-2{ color:var(--text-2); } .gold-c{ color:var(--gold-2); }
.ok-c{ color:#2F6446; } .danger-c{ color:#9E3F3A; } .warn-c{ color:#8A5A12; } .info-c{ color:#2C5878; }
.center{ text-align:center; }
.fs-sm{ font-size:.85rem; } .fs-lg{ font-size:1.12rem; }
.bold{ font-weight:800; }
.nowrap{ white-space:nowrap; }
.grow{ flex:1; min-width:0; }
.pre-wrap{ white-space:pre-wrap; }
.sr-only{ position:absolute; width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0; }

/* ---------------------------------------------------------------------------
   4) الهيكل العام
   ------------------------------------------------------------------------ */
.wrap-max{ width:min(100%,var(--wrap)); margin-inline:auto; padding-inline:16px; }

.topbar{
  position:sticky; top:0; z-index:60; min-height:var(--topbar-h);
  background:rgba(var(--bg-rgb),.88);
  backdrop-filter:blur(14px) saturate(1.2);
  border-bottom:1px solid var(--line-soft);
}
.topbar-inner{ display:flex; align-items:center; gap:12px; min-height:var(--topbar-h); flex-wrap:wrap; row-gap:8px; padding-block:8px; }
.brand{ display:flex; align-items:center; gap:11px; font-weight:900; letter-spacing:-.3px; color:var(--cream); min-width:0; }
.brand > span{ min-width:0; }
.brand .logo{
  width:44px; height:44px; flex:none; display:grid; place-items:center;
  border-radius:14px; font-size:1.35rem;
  background:linear-gradient(135deg,var(--gold-2),var(--gold-deep));
  color:#FFFFFF; box-shadow:var(--glow-gold);
}
.brand small{ display:block; font-size:.68rem; color:var(--muted); font-weight:600; letter-spacing:.3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.top-actions{ display:flex; align-items:center; gap:8px; margin-inline-start:auto; }
.top-nav{ display:flex; align-items:center; gap:4px; margin-inline-start:8px; }
.top-nav:empty{ display:none; }
.top-nav button{
  display:inline-flex; align-items:center; gap:7px; padding:9px 14px; border-radius:var(--r-pill);
  background:transparent; border:1px solid transparent; color:var(--text-2);
  font-weight:700; font-size:.88rem; cursor:pointer; white-space:nowrap;
  transition:all var(--dur) var(--ease);
}
.top-nav button .ic{ font-size:1.05rem; }
.top-nav button:hover{ background:var(--surface); border-color:var(--line); color:var(--cream); }
.top-nav button.is-active{ background:rgba(var(--olive-rgb),.10); border-color:rgba(var(--olive-rgb),.24); color:var(--gold-deep); }

.icon-btn{
  position:relative; width:46px; height:46px; display:grid; place-items:center;
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r-sm);
  cursor:pointer; font-size:1.15rem; transition:all var(--dur) var(--ease);
}
.icon-btn:hover{ background:var(--surface-2); border-color:var(--gold-deep); }
.icon-btn.is-cart{ background:linear-gradient(180deg,var(--gold-2),var(--gold)); border-color:transparent; color:#FFFFFF; box-shadow:0 6px 16px rgba(var(--olive-rgb),.22); }
.icon-btn.is-cart:hover{ filter:brightness(1.07); background:linear-gradient(180deg,var(--gold-2),var(--gold)); }
.icon-btn .count{
  position:absolute; top:-6px; inset-inline-start:-6px; min-width:22px; height:22px; padding:0 5px;
  display:grid; place-items:center; border-radius:99px; font-size:.72rem; font-weight:900;
  background:var(--caramel); color:#4A3413;
  box-shadow:0 0 0 2px var(--bg);
}
.app-main{ flex:1; padding-block:22px 34px; }
body.has-bottomnav .app-main{ padding-bottom:calc(var(--bottomnav-h) + 28px); }

.bottom-nav{
  position:fixed; inset-inline:0; bottom:0; z-index:70;
  height:var(--bottomnav-h); padding-bottom:env(safe-area-inset-bottom);
  display:grid; grid-auto-flow:column; grid-auto-columns:1fr;
  background:rgba(255,255,255,.94); backdrop-filter:blur(16px);
  border-top:1px solid var(--line);
}
.bottom-nav button{
  background:none; border:0; cursor:pointer; color:var(--muted);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
  font-size:.7rem; font-weight:700; position:relative; padding:6px 2px;
  transition:color var(--dur) var(--ease);
}
.bottom-nav button .ic{ font-size:1.28rem; line-height:1; }
.bottom-nav button.is-active{ color:var(--gold); }
.bottom-nav button.is-active::before{ content:""; position:absolute; top:0; inset-inline:22%; height:3px; border-radius:0 0 4px 4px; background:var(--gold); }
.bottom-nav .count{ position:absolute; top:4px; inset-inline-start:50%; margin-inline-start:6px; min-width:19px; height:19px; padding:0 4px; display:grid; place-items:center; border-radius:99px; font-size:.68rem; font-weight:900; background:var(--caramel); color:#4A3413; }
@media (min-width:860px){ body.has-bottomnav .app-main{ padding-bottom:34px; } .bottom-nav{ display:none; } }

.app-footer{ border-top:1px solid var(--line-soft); padding:22px 0 30px; color:var(--muted); font-size:.83rem; }
.app-footer .maplink{ display:inline-block; padding:4px 2px; }
body.admin-mode .app-footer,body.admin-mode .topbar,body.admin-mode .bottom-nav{ display:none !important; }

/* ---------------------------------------------------------------------------
   5) التنبيهات والشعارات
   ------------------------------------------------------------------------ */
.toast-region{ position:fixed; z-index:300; inset-inline:12px; bottom:calc(var(--bottomnav-h) + 14px); display:flex; flex-direction:column; gap:10px; pointer-events:none; }
@media (min-width:860px){ .toast-region{ inset-inline:auto 16px; bottom:18px; width:390px; } }
.toast{
  pointer-events:auto; display:flex; gap:11px; align-items:flex-start;
  background:var(--surface); border:1px solid var(--line); border-inline-start:4px solid var(--gold);
  border-radius:var(--r-md); padding:13px 15px; box-shadow:var(--shadow-3);
  animation:toastIn .26s var(--ease);
}
.toast.t-ok{ border-inline-start-color:var(--ok); }
.toast.t-err{ border-inline-start-color:var(--danger); }
.toast.t-warn{ border-inline-start-color:var(--warn); }
.toast.t-info{ border-inline-start-color:var(--info); }
.toast .t-ic{ font-size:1.15rem; line-height:1.4; }
.toast .t-body{ flex:1; min-width:0; }
.toast .t-title{ font-weight:800; font-size:.93rem; }
.toast .t-msg{ font-size:.84rem; color:var(--text-2); }
.toast .t-close{ background:none; border:0; color:var(--muted); cursor:pointer; font-size:1.1rem; padding:6px 8px; border-radius:8px; }
.toast .t-close:hover{ color:var(--cream); background:var(--surface-2); }
.toast.out{ animation:toastOut .2s var(--ease) forwards; }
@keyframes toastIn{ from{ opacity:0; transform:translateY(14px) scale(.98); } to{ opacity:1; transform:none; } }
@keyframes toastOut{ to{ opacity:0; transform:translateX(-20px); } }

.banner{
  display:flex; gap:12px; align-items:center; flex-wrap:wrap;
  background:linear-gradient(180deg,rgba(var(--olive-rgb),.08),rgba(var(--olive-rgb),.03));
  border:1px solid rgba(var(--olive-rgb),.22); border-radius:var(--r-md);
  padding:12px 15px; margin-bottom:16px; font-size:.88rem;
}
.banner .ic{ font-size:1.2rem; }
.alert{ border-radius:var(--r-md); padding:13px 15px; font-size:.88rem; border:1px solid var(--line); background:var(--surface-2); }
.alert-warn{ background:var(--warn-soft); border-color:#EAD9B8; color:#8A5A12; }
.alert-danger{ background:var(--danger-soft); border-color:#E8C9C6; color:#9E3F3A; }
.alert-info{ background:var(--info-soft); border-color:#C9DCEC; color:#2C5878; }
.alert-ok{ background:var(--ok-soft); border-color:#C9E2D2; color:#2F6446; }

/* ---------------------------------------------------------------------------
   6) صفحة الدخول (Landing) — خلفية شرائح طعام + خياران فقط
   ------------------------------------------------------------------------ */
body.landing-mode .topbar,body.landing-mode .app-footer{ display:none !important; }
body.landing-mode .app-main{ padding-block:0; }

.landing{
  position:relative; overflow:hidden;
  min-height:100vh;
  min-height:100dvh;
  display:grid; place-items:center;
  padding:clamp(26px,6vw,64px) clamp(18px,5vw,48px);
  background:linear-gradient(160deg,#EFE7D8,#E4DCCB 60%,#DFD3BE);
}
.landing-bg{ position:absolute; inset:0; overflow:hidden; }
.landing-bg .ls{
  position:absolute; inset:0; opacity:0;
  background-size:cover; background-position:center;
  animation:lsFade 30s linear infinite;
  animation-delay:calc(var(--i) * 6s);
  will-change:opacity;
}
.landing-bg .ls img{ width:100%; height:100%; object-fit:cover; display:block; }
.landing-bg .ls .ls-art{
  position:absolute; inset:0; display:grid; place-items:center;
  font-size:min(46vw,340px); line-height:1;
  background:linear-gradient(150deg,hsl(var(--h) 42% 88%),hsl(var(--h) 36% 70%));
}
.landing-bg .ls .ls-art span{ filter:drop-shadow(0 26px 46px rgba(var(--ink-rgb),.30)); opacity:.5; }
@keyframes lsFade{
  0%{ opacity:0; }
  3.2%{ opacity:1; }
  20%{ opacity:1; }
  24%{ opacity:0; }
  100%{ opacity:0; }
}
.landing-veil{
  position:absolute; inset:0; pointer-events:none;
  background:
    radial-gradient(120% 95% at 50% 44%, rgba(var(--ink-rgb),.16), rgba(var(--ink-rgb),.56) 80%),
    linear-gradient(180deg, rgba(var(--ink-rgb),.30), rgba(var(--ink-rgb),.52));
}
.landing-inner{ position:relative; z-index:2; width:min(100%,620px); text-align:center; color:#FFFFFF; }
.landing-brand{ padding:0; background:none; border:0; box-shadow:none; }
.landing-logo{
  width:88px; height:88px; margin:0 auto 16px; display:grid; place-items:center;
  border-radius:26px; font-size:2.6rem;
  background:linear-gradient(135deg,#FFFFFF,#F4EEE2); color:var(--gold-deep);
  border:1px solid rgba(255,255,255,.6);
  box-shadow:0 16px 34px rgba(var(--ink-rgb),.30);
}
.landing h1{
  color:#FFFFFF; margin:0 0 12px;
  font-size:clamp(1.9rem,6vw,3rem); letter-spacing:-.5px; font-weight:900;
  text-shadow:0 2px 22px rgba(var(--ink-rgb),.45);
}
.landing-tag{
  margin:0 auto 8px; max-width:30ch; color:#FFF7E9;
  font-size:clamp(1rem,2.6vw,1.18rem); font-weight:700; line-height:1.7;
  text-shadow:0 2px 16px rgba(var(--ink-rgb),.45);
}
.landing-sub{ margin:0 auto; max-width:42ch; color:rgba(255,255,255,.84); font-size:.9rem; line-height:1.75; }
.landing-actions{ display:grid; gap:12px; margin-top:clamp(18px,3.4vw,26px); }
@media (min-width:560px){ .landing-actions{ grid-template-columns:1fr 1fr; } }
.lbtn{
  display:flex; align-items:center; gap:13px; text-align:start;
  padding:14px 20px; min-height:70px; cursor:pointer;
  border-radius:var(--r-lg); border:1px solid transparent;
  font-family:inherit; text-decoration:none;
  transition:transform var(--dur) var(--ease), box-shadow var(--dur) var(--ease), background var(--dur) var(--ease);
}
.lbtn .ic{
  width:44px; height:44px; flex:none; display:grid; place-items:center;
  border-radius:13px; font-size:1.35rem;
  background:rgba(255,255,255,.16); border:1px solid rgba(255,255,255,.28);
}
.lbtn b{ display:block; font-size:1.03rem; font-weight:900; letter-spacing:-.2px; }
.lbtn small{ display:block; font-size:.75rem; font-weight:600; opacity:.85; margin-top:2px; }
.lbtn-primary{ background:linear-gradient(180deg,var(--gold-2),var(--gold-deep)); color:#FFFFFF; box-shadow:0 14px 30px rgba(var(--olive-rgb),.42); }
.lbtn-primary:hover{ transform:translateY(-2px); box-shadow:0 18px 38px rgba(var(--olive-rgb),.5); }
.lbtn-ghost{
  background:rgba(var(--ink-rgb),.32); color:#FFFFFF;
  border-color:rgba(255,255,255,.34); backdrop-filter:blur(8px);
}
.lbtn-ghost:hover{ transform:translateY(-2px); background:rgba(var(--ink-rgb),.42); }
.lbtn:active{ transform:translateY(0) scale(.99); }
@media (prefers-reduced-motion: reduce){
  .landing-bg .ls{ animation:none; opacity:0; }
  .landing-bg .ls:first-child{ opacity:1; }
}

/* ---------------------------------------------------------------------------
   7) المنيو
   ------------------------------------------------------------------------ */
.toolbar{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:16px; }
.search-box{ position:relative; flex:1; min-width:210px; }
.search-box .ic{ position:absolute; inset-inline-start:15px; top:50%; transform:translateY(-50%); color:var(--muted); pointer-events:none; }
.search-box .input{ padding-inline-start:44px; border-radius:var(--r-pill); }
.menu-head{ margin-bottom:16px; }
.menu-head h1{ margin:0; }
.menu-head .menu-tagline{ margin:7px 0 0; color:var(--muted); font-size:.92rem; max-width:62ch; }
.cats{ display:flex; gap:9px; overflow-x:auto; padding:4px 2px 12px; scrollbar-width:none; margin-bottom:6px; }
.cats::-webkit-scrollbar{ display:none; }
.cats .chip{ flex:none; }

.menu-grid{ display:grid; gap:18px; grid-template-columns:repeat(auto-fill,minmax(258px,1fr)); }
.dish{
  display:flex; flex-direction:column; overflow:hidden; position:relative;
  background:var(--surface);
  border:1px solid var(--line); border-radius:var(--r-lg);
  box-shadow:var(--shadow-1);
  transition:transform var(--dur) var(--ease), border-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
}
@media (hover:hover) and (min-width:760px){
  .dish:hover{ transform:translateY(-4px); border-color:rgba(var(--olive-rgb),.30); box-shadow:var(--shadow-2); }
}
.dish.is-out{ opacity:.66; }
.dish .thumb{ position:relative; aspect-ratio:4/3; display:grid; place-items:center; font-size:3.2rem; overflow:hidden; background:var(--surface-2); }
.dish .thumb::after{ content:""; position:absolute; inset:0; pointer-events:none; box-shadow:inset 0 -40px 56px -38px rgba(var(--ink-rgb),.26); }
.dish .thumb img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
.dish .thumb .ribbon{ position:absolute; top:10px; inset-inline-start:10px; z-index:2; }
.dish .body{ padding:14px 16px 16px; display:flex; flex-direction:column; gap:7px; flex:1; }
.dish .name{ font-weight:800; color:var(--cream); font-size:1.04rem; line-height:1.4; }
.dish .desc{ font-size:.84rem; color:var(--muted); line-height:1.6; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; min-height:2.6em; }
.dish .dish-meta{ font-size:.78rem; color:var(--muted); }
.dish .foot{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:auto; padding-top:11px; border-top:1px solid var(--line-soft); }
.price{ font-weight:900; color:var(--gold-deep); font-size:1.2rem; letter-spacing:-.3px; }
.price small{ color:var(--muted); font-weight:700; font-size:.72rem; margin-inline-start:3px; }
.stars{ color:var(--caramel-deep); font-size:.78rem; letter-spacing:1px; }

/* ---------------------------------------------------------------------------
   8) السلة والملخصات
   ------------------------------------------------------------------------ */
.cart-line{ display:flex; gap:13px; padding:15px 0; border-bottom:1px solid var(--line-soft); }
.cart-line:last-child{ border-bottom:0; padding-bottom:0; }
.cart-line .thumb{ width:70px; height:70px; border-radius:var(--r-md); flex:none; display:grid; place-items:center; font-size:1.85rem; background:var(--surface-2); overflow:hidden; position:relative; border:1px solid var(--line-soft); }
.cart-line .thumb img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
.qty{ display:inline-flex; align-items:center; gap:2px; background:var(--surface-2); border:1px solid var(--line); border-radius:var(--r-pill); padding:3px; }
.qty button{ width:34px; height:34px; border:0; border-radius:50%; background:transparent; color:var(--text); font-size:1.15rem; font-weight:900; cursor:pointer; transition:background var(--dur) var(--ease), color var(--dur) var(--ease); }
.qty button:hover{ background:var(--surface); color:var(--gold-deep); box-shadow:var(--shadow-1); }
.qty span{ min-width:32px; text-align:center; font-weight:800; }
.sum-line{ display:flex; justify-content:space-between; gap:12px; padding:8px 0; font-size:.93rem; color:var(--text-2); }
.sum-line span:last-child{ font-weight:700; color:var(--cream); }
.sum-total{ display:flex; justify-content:space-between; gap:12px; align-items:baseline; padding:15px 0 6px; margin-top:10px; border-top:2px solid var(--line); font-weight:900; font-size:1.3rem; color:var(--cream); }
.sum-total span:last-child{ color:var(--gold-deep); }

.kv{ display:grid; grid-template-columns:auto 1fr; gap:8px 14px; font-size:.9rem; }
.kv dt{ color:var(--muted); font-weight:600; }
.kv dd{ margin:0; font-weight:700; }
.stat-mini{ display:grid; gap:10px; grid-template-columns:repeat(auto-fit,minmax(118px,1fr)); }
.stat-mini .sm-card{ padding:12px; border-radius:var(--r-md); background:var(--surface-2); border:1px solid var(--line); text-align:center; }
.stat-mini .sm-card b{ display:block; font-size:1.25rem; color:var(--gold-2); }
.stat-mini .sm-card span{ font-size:.76rem; color:var(--muted); }

.loyalty-hero{
  display:flex; align-items:center; gap:16px; padding:18px; border-radius:var(--r-lg); flex-wrap:wrap;
  background:linear-gradient(135deg,rgba(var(--olive-rgb),.12),var(--surface));
  border:1px solid rgba(var(--olive-rgb),.25);
}
.loyalty-hero .lpts{ font-size:2.1rem; font-weight:900; color:var(--gold-2); line-height:1; }
.progress{ height:10px; border-radius:99px; background:var(--surface-3); overflow:hidden; border:1px solid var(--line); }
.progress > i{ display:block; height:100%; background:linear-gradient(90deg,var(--gold-deep),var(--gold-2)); transition:width .5s var(--ease); }
.reward{ display:flex; gap:12px; align-items:center; padding:13px; border-radius:var(--r-md); background:var(--surface-2); border:1px solid var(--line); }
.reward .ricon{ font-size:1.7rem; flex:none; }
.reward.locked{ opacity:.62; }

.tickets{ display:flex; flex-direction:column; gap:12px; }
.ticket{ display:flex; gap:12px; align-items:center; padding:14px; border-radius:var(--r-md); background:var(--surface); border:1px solid var(--line); box-shadow:var(--shadow-1); transition:border-color var(--dur) var(--ease), transform var(--dur) var(--ease); }
.ticket:hover{ border-color:rgba(var(--olive-rgb),.35); transform:translateY(-2px); }
.ticket .tnum{ font-family:var(--font-mono); font-weight:800; font-size:.9rem; color:var(--gold-2); }

/* ---------------------------------------------------------------------------
   9) الحالات: فارغ / تحميل / خطأ / نجاح
   ------------------------------------------------------------------------ */
.empty{ text-align:center; padding:46px 18px; border:1px dashed var(--line); border-radius:var(--r-lg); background:rgba(var(--ink-rgb),.015); }
.empty .ic{ font-size:3rem; margin-bottom:10px; opacity:.85; }
.empty h3{ color:var(--cream); }
.empty p{ max-width:430px; margin-inline:auto; }

.skeleton{ border-radius:var(--r-md); background:linear-gradient(90deg,var(--surface) 25%,var(--surface-2) 37%,var(--surface) 63%); background-size:400% 100%; animation:sk 1.3s ease-in-out infinite; }
@keyframes sk{ from{ background-position:100% 0; } to{ background-position:0 0; } }
.sk-card{ height:255px; }
.sk-line{ height:13px; margin-bottom:9px; }

.spinner{ width:19px; height:19px; border-radius:50%; border:2.5px solid rgba(var(--ink-rgb),.18); border-top-color:var(--gold); animation:spin .7s linear infinite; display:inline-block; }
@keyframes spin{ to{ transform:rotate(360deg); } }
.loading-block{ display:flex; align-items:center; justify-content:center; gap:11px; padding:36px; color:var(--muted); }

.success-art{ width:104px; height:104px; border-radius:50%; display:grid; place-items:center; font-size:3rem; margin:0 auto 14px; background:var(--ok-soft); border:2px solid var(--ok); animation:pop .5s cubic-bezier(.2,1.4,.4,1); }
@keyframes pop{ from{ transform:scale(.5); opacity:0 } to{ transform:scale(1); opacity:1 } }
.ordnum{ font-family:var(--font-mono); font-size:1.25rem; font-weight:900; letter-spacing:.06em; color:var(--gold-2); direction:ltr; display:inline-block; }

/* ---------------------------------------------------------------------------
   10) النوافذ المنبثقة
   ------------------------------------------------------------------------ */
.overlay{ position:fixed; inset:0; z-index:200; background:rgba(var(--ink-rgb),.42); backdrop-filter:blur(3px); display:flex; align-items:flex-end; justify-content:center; animation:fade .2s var(--ease); }
@media (min-width:760px){ .overlay{ align-items:center; } }
@keyframes fade{ from{ opacity:0 } to{ opacity:1 } }
.sheet{
  width:100%; max-width:620px; max-height:92vh; overflow:auto;
  background:var(--surface);
  border:1px solid var(--line); border-bottom:0;
  border-radius:var(--r-xl) var(--r-xl) 0 0;
  box-shadow:var(--shadow-3); animation:sheetIn .26s var(--ease);
}
@media (min-width:760px){ .sheet{ border-radius:var(--r-xl); border-bottom:1px solid var(--line); max-height:88vh; } }
@keyframes sheetIn{ from{ transform:translateY(28px); opacity:.5 } to{ transform:none; opacity:1 } }
.sheet-head{ position:sticky; top:0; z-index:3; display:flex; align-items:center; gap:12px; padding:15px 18px; background:rgba(255,255,255,.95); backdrop-filter:blur(10px); border-bottom:1px solid var(--line-soft); }
.sheet-head h3{ font-size:1.12rem; }
.sheet-body{ padding:18px; }
.sheet-foot{ position:sticky; bottom:0; z-index:3; padding:14px 18px calc(14px + env(safe-area-inset-bottom)); background:rgba(255,255,255,.97); backdrop-filter:blur(10px); border-top:1px solid var(--line); box-shadow:0 -10px 24px rgba(var(--ink-rgb),.06); }
.sheet-img{ aspect-ratio:16/10; display:grid; place-items:center; font-size:5rem; background:var(--surface-2); position:relative; overflow:hidden; }
.sheet-img::after{ content:""; position:absolute; inset:0; pointer-events:none; box-shadow:inset 0 -50px 66px -46px rgba(var(--ink-rgb),.28); }
.sheet-img img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
.addon{ display:flex; align-items:center; gap:11px; padding:12px 14px; border:1px solid var(--line); border-radius:var(--r-md); background:var(--surface); cursor:pointer; margin-bottom:9px; transition:border-color var(--dur) var(--ease), background var(--dur) var(--ease); }
.addon:hover{ border-color:var(--gold-deep); }
.addon input{ width:20px; height:20px; accent-color:var(--gold); flex:none; }
.addon.is-on{ border-color:var(--gold); background:rgba(var(--olive-rgb),.07); box-shadow:0 0 0 1px var(--gold) inset; }

/* ---------------------------------------------------------------------------
   11) متابعة الطلب
   ------------------------------------------------------------------------ */
.timeline{ list-style:none; padding:0; margin:0; }
.timeline li{ position:relative; padding-inline-start:36px; padding-bottom:20px; }
.timeline li::before{ content:""; position:absolute; inset-inline-start:11px; top:24px; bottom:-4px; width:2px; background:var(--line); }
.timeline li:last-child::before{ display:none; }
.timeline li .tl-dot{ position:absolute; inset-inline-start:3px; top:2px; width:20px; height:20px; border-radius:50%; background:var(--surface-3); border:2px solid var(--line); display:grid; place-items:center; font-size:.6rem; }
.timeline li.done .tl-dot{ background:var(--gold); border-color:var(--gold-deep); color:#FFFFFF; }
.timeline li.done::before{ background:linear-gradient(180deg,var(--gold),var(--line)); }
.timeline li.current .tl-dot{ background:var(--ok); border-color:#A9D6BA; box-shadow:0 0 0 5px rgba(62,125,87,.16); }
.timeline .tl-title{ font-weight:800; color:var(--cream); }
.timeline .tl-time{ font-size:.78rem; color:var(--muted); }
.status-meta{ display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:12px; }
.status-meta .m{ background:var(--surface); border:1px solid var(--line-soft); border-radius:var(--r-md); padding:12px 14px; }
.status-meta .m span{ display:block; font-size:.76rem; color:var(--muted); }
.status-meta .m b{ font-size:1.02rem; color:var(--cream); }

/* ---------------------------------------------------------------------------
   12) لوحة الكاشير والإدارة (Desktop First)
   ------------------------------------------------------------------------ */
.admin{ display:grid; grid-template-columns:minmax(0,1fr); min-height:100vh; }
@media (min-width:1000px){ .admin{ grid-template-columns:248px minmax(0,1fr); } }
.admin-side{ background:linear-gradient(180deg,#FFFFFF,#F4F6F1); border-inline-end:1px solid var(--line-soft); padding:16px 12px; display:flex; flex-direction:column; gap:6px; min-width:0; }
@media (max-width:999px){ .admin-side{ border-inline-end:0; border-bottom:1px solid var(--line-soft); } }
.admin-side .brand{ padding:6px 8px 14px; }
.admin-nav{ display:flex; flex-direction:column; gap:4px; }
@media (max-width:999px){ .admin-nav{ flex-direction:row; overflow-x:auto; padding-bottom:6px; } .admin-nav::-webkit-scrollbar{ display:none; } }
.admin-nav button{
  display:flex; align-items:center; gap:10px; padding:11px 13px; border-radius:var(--r-sm);
  background:transparent; border:1px solid transparent; color:var(--text-2);
  cursor:pointer; font-weight:700; font-size:.9rem; text-align:start; white-space:nowrap;
  transition:all var(--dur) var(--ease);
}
.admin-nav button:hover{ background:var(--surface); color:var(--cream); }
.admin-nav button.is-active{ background:linear-gradient(90deg,rgba(var(--olive-rgb),.12),transparent); border-color:rgba(var(--olive-rgb),.22); color:var(--gold-deep); }
.admin-nav .ic{ font-size:1.1rem; }
.admin-main{ padding:clamp(14px,2.4vw,26px); min-width:0; }
.admin-top{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:18px; }

.kpi{ display:grid; gap:13px; grid-template-columns:repeat(auto-fit,minmax(178px,1fr)); }
.kpi .k{ background:linear-gradient(180deg,var(--surface),var(--bg-soft)); border:1px solid var(--line-soft); border-radius:var(--r-lg); padding:15px 17px; position:relative; overflow:hidden; }
.kpi .k::after{ content:""; position:absolute; inset-inline-end:-30px; top:-30px; width:92px; height:92px; border-radius:50%; background:radial-gradient(circle,rgba(var(--olive-rgb),.10),transparent 70%); }
.kpi .k .ic{ font-size:1.4rem; }
.kpi .k span{ display:block; font-size:.79rem; color:var(--muted); margin-top:4px; }
.kpi .k b{ font-size:1.5rem; color:var(--cream); display:block; }

.orders-grid{ display:grid; gap:14px; grid-template-columns:repeat(auto-fill,minmax(335px,1fr)); }
.order-card{ background:linear-gradient(180deg,var(--surface),var(--bg-soft)); border:1px solid var(--line-soft); border-radius:var(--r-lg); overflow:hidden; display:flex; flex-direction:column; position:relative; box-shadow:var(--shadow-1); }
.order-card::before{ content:""; position:absolute; inset-inline-start:0; top:0; bottom:0; width:4px; background:var(--st-pending); }
.order-card.s-accepted::before{ background:var(--st-accepted); }
.order-card.s-preparing::before{ background:var(--st-preparing); }
.order-card.s-ready::before{ background:var(--st-ready); }
.order-card.s-delivered::before{ background:var(--st-delivered); }
.order-card.s-cancelled::before{ background:var(--st-cancelled); opacity:.55; }
.order-card.is-new{ animation:pulseNew 1.6s var(--ease) 3; }
@keyframes pulseNew{ 0%,100%{ box-shadow:var(--shadow-1) } 50%{ box-shadow:0 0 0 3px rgba(183,121,31,.35), var(--shadow-2) } }
.order-card .oc-head{ display:flex; justify-content:space-between; gap:10px; padding:14px 16px; border-bottom:1px solid var(--line-soft); align-items:flex-start; }
.order-card .oc-body{ padding:12px 16px; flex:1; display:flex; flex-direction:column; gap:9px; }
.order-card .oc-foot{ padding:13px 16px; border-top:1px solid var(--line-soft); display:flex; gap:8px; flex-wrap:wrap; background:rgba(var(--ink-rgb),.03); }
.oi{ display:flex; justify-content:space-between; gap:10px; font-size:.9rem; padding:5px 0; border-bottom:1px dashed var(--line-soft); }
.oi:last-child{ border-bottom:0; }
.oi .oi-add{ display:block; font-size:.76rem; color:var(--muted); }
.oi .oi-note{ display:block; font-size:.76rem; color:#8A5A12; }
.meta-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(118px,1fr)); gap:8px; font-size:.82rem; color:var(--text-2); }
.meta-grid .lab{ color:var(--muted); font-size:.74rem; display:block; }

table.tbl{ width:100%; border-collapse:collapse; font-size:.9rem; }
table.tbl th,table.tbl td{ padding:11px 12px; text-align:start; border-bottom:1px solid var(--line-soft); vertical-align:middle; }
table.tbl th{ color:var(--muted); font-size:.79rem; font-weight:800; background:rgba(var(--ink-rgb),.035); position:sticky; top:0; }
table.tbl tr:hover td{ background:rgba(var(--olive-rgb),.045); }
.table-wrap{ overflow:auto; max-height:64vh; border:1px solid var(--line-soft); border-radius:var(--r-md); }

.bars{ display:flex; align-items:flex-end; gap:10px; height:170px; padding-top:10px; }
.bars .b{ flex:1; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; gap:6px; height:100%; }
.bars .b .bar{ width:100%; max-width:52px; border-radius:9px 9px 3px 3px; background:linear-gradient(180deg,var(--gold-2),var(--gold-deep)); min-height:4px; transition:height .5s var(--ease); }
.bars .b .lab{ font-size:.72rem; color:var(--muted); }

.tabs{ display:flex; gap:6px; border-bottom:1px solid var(--line-soft); margin-bottom:16px; overflow-x:auto; }

function normalizePhone(raw){
  const d = String(raw || '').replace(/[^\d+]/g, '');
  if (!d) return '';
  if (d.startsWith('00')) return '+' + d.slice(2).replace(/\+/g,'');
  if (d.startsWith('+')) return '+' + d.replace(/\+/g,'');
  if (d.startsWith('0')) return '+966' + d.slice(1);
  if (d.length <= 9) return '+966' + d;
  return '+' + d;
}

  const v = String(p || '');

/** قاعدة البيانات في الذاكرة */
let DB = null;

function loadDB(){
  try {
    const raw = localStorage.getItem(LS_DB_KEY);
    if (raw){
      const parsed = JSON.parse(raw);
      if (parsed && parsed.version === DB_VERSION) return parsed;
    }
  } catch (e){ /* بيانات تالفة → نبدأ من البذرة */ }
  const seed = buildSeed();
  try { localStorage.setItem(LS_DB_KEY, JSON.stringify(seed)); } catch (e){}
  return seed;
}
function saveDB(){
  try { localStorage.setItem(LS_DB_KEY, JSON.stringify(DB)); return true; }
  catch (e){ pushLog('error', 'storage', 'فشل الحفظ المحلي (المساحة ممتلئة؟)', e && e.message); return false; }
}
function resetDB(){ DB = buildSeed(); saveDB(); }
function pushLog(level, area, message, meta){
  DB.logs.unshift({ id: uid('lg'), at: Date.now(), level, area, message, meta: meta || null });
  DB.logs = DB.logs.slice(0, 400);
}
function logError(area, message, meta){ pushLog('error', area, message, meta); saveDB(); }
/* ==========================================================================
   3) طبقة الوصول للبيانات (Data Access Layer)

   الواجهة تتحدث مع كائن Api فقط. اليوم = LocalAdapter (ديمو/محلي).
   غدًا: عيّن CONFIG.apiBase ليعمل RestAdapter على Backend حقيقي بنفس التوقيعات
   (نفس عقد الـ API) دون تعديل أي شاشة. التفاصيل في README.md.
   ========================================================================== */
const CONFIG = {
  apiBase: (localStorage.getItem('srs.apiBase') || '').trim(), // مثال: https://api.restaurant.com
  latency: 170,        // محاكاة زمن الشبكة في وضع الديمو
  pollMs: 4000,        // فترة التحديث اللحظي في لوحة الكاشير
  orderPrefix: 'ORD-'
};

/** خطأ موحّد (يشبه استجابة REST: { code, message }) */
class ApiError extends Error {
  constructor(code, message, meta){ super(message); this.code = code; this.meta = meta || null; }
}

/* --------------------------- Adapter محلي (Demo) -------------------------- */
const LocalAdapter = {
  async read(){ await sleep(CONFIG.latency); return DB; },
  async commit(){ saveDB(); return true; },
  async list(collection, predicate, sortFn){
    const db = await this.read();
    let rows = (db[collection] || []).slice();
    if (predicate) rows = rows.filter(predicate);
    if (sortFn) rows.sort(sortFn);
    return deepClone(rows);
  },
  async get(collection, id){
    const db = await this.read();
    const row = byId(db[collection] || [], id);
    if (!row) throw new ApiError('NOT_FOUND', 'العنصر غير موجود: ' + id);
    return deepClone(row);
  },
  async insert(collection, data){
    const db = await this.read();
    const row = Object.assign({ id: uid(collection.slice(0,3)), createdAt: Date.now() }, data);
    db[collection] = db[collection] || [];
    db[collection].unshift(row);
    await this.commit();
    return deepClone(row);
  },
  async update(collection, id, patch){
    const db = await this.read();
    const row = byId(db[collection] || [], id);
    if (!row) throw new ApiError('NOT_FOUND', 'العنصر غير موجود: ' + id);
    Object.assign(row, patch, { updatedAt: Date.now() });
    await this.commit();
    return deepClone(row);
  },
  async remove(collection, id){
    const db = await this.read();
    db[collection] = (db[collection] || []).filter(x => x.id !== id);
    await this.commit();
    return true;
  }
};

/* --------------- Adapter REST (جاهز للربط بـ Backend حقيقي) --------------- */
const RestAdapter = {
  async request(method, path, body){
    const res = await fetch(CONFIG.apiBase.replace(/\/$/, '') + path, {
      method,
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',   // الجلسة عبر كوكي HttpOnly من الخادم — لا توكنات في المتصفح
      body: body ? JSON.stringify(body) : undefined
    });
    let data = null;
    try { data = await res.json(); } catch (e){ data = null; }
    if (!res.ok) throw new ApiError((data && data.code) || ('HTTP_' + res.status), (data && data.message) || 'فشل الاتصال بالخادم', data);
    return data;
  },
  get(p){ return this.request('GET', p); },
  post(p, b){ return this.request('POST', p, b); },
  patch(p, b){ return this.request('PATCH', p, b); },
  del(p){ return this.request('DELETE', p); }
};

function useBackend(){ return !!CONFIG.apiBase; }
function adapterName(){ return useBackend() ? ('REST → ' + CONFIG.apiBase) : 'LocalAdapter (Demo — localStorage)'; }
function setApiBase(url){
  CONFIG.apiBase = String(url || '').trim().replace(/\/$/, '');
  if (CONFIG.apiBase) localStorage.setItem('srs.apiBase', CONFIG.apiBase);
  else localStorage.removeItem('srs.apiBase');
}
/** رابط مطلق لأصل ثابت (صورة صنف) — المسارات النسبية تُحلّ مقابل CONFIG.apiBase */
function assetUrl(u){
  const s = String(u || '').trim();
  if (!s) return '';
  if (/^(data:|blob:|https?:)/i.test(s)) return s;
  const base = (CONFIG.apiBase || '').replace(/\/$/, '');
  return base ? base + (s.charAt(0) === '/' ? s : '/' + s) : s;
}

/** مزامنة الذاكرة المحلية (DB) مع الباكند عند تفعيل CONFIG.apiBase.
 *  السبب: بعض أجزاء الواجهة تقرأ DB.settings/DB.adminUsers تزامنيًا (العملة، القوالب، قواعد الولاء، استرجاع الجلسة).
 *  قراءة فقط — لا تغيّر أي قاعدة عمل، وكل الأخطاء مُتجاهَلة (تظل الواجهة تعمل حتى لو تعذّر الاتصال). */
async function syncFromBackend(){
  if (!useBackend()) return false;
  const safe = (p, fb) => RestAdapter.get(p).catch(() => fb);
  try {
    const s = await RestAdapter.get('/api/settings');
    if (s && typeof s === 'object') DB.settings = s;
  } catch (e){ /* نتجاهل */ }
  const res = await Promise.all([
    safe('/api/categories', null), safe('/api/products', null), safe('/api/tables', null),
    safe('/api/rewards', null), safe('/api/admin/users', null), safe('/api/customers', null),
    safe('/api/orders?limit=200', null),
    safe('/api/loyalty/transactions', null), safe('/api/logs', null)
  ]);
  const [cats, prods, tbls, rws, admins, custs, ords, txs, lgs] = res;
  if (Array.isArray(cats)) DB.categories = cats;
  if (Array.isArray(prods)) DB.products = prods;
  if (Array.isArray(tbls)) DB.tables = tbls;
  if (Array.isArray(rws)) DB.rewards = rws;
  if (Array.isArray(admins)) DB.adminUsers = admins;
  if (Array.isArray(custs)) DB.customers = custs;
  if (Array.isArray(ords)) DB.orders = ords;
  if (Array.isArray(txs)) DB.loyaltyTransactions = txs;
  if (Array.isArray(lgs)) DB.logs = lgs;
  saveDB();
  return true;
}

/* ==========================================================================
   4) Api — واجهة موحّدة للبيانات (نفس التوقيعات للوضعين)
   ========================================================================== */
const Api = {

  /* ------------ المنيو: GET /api/categories · GET /api/products ----------- */
  categories: async () => useBackend() ? RestAdapter.get('/api/categories') : LocalAdapter.list('categories', null, (a,b) => (a.sort||0)-(b.sort||0)),
  products: async (opts) => {
    opts = opts || {};
    if (useBackend()){
      const q = new URLSearchParams();
      if (opts.catId) q.set('category', opts.catId);
      if (opts.q) q.set('q', opts.q);
      if (opts.onlyAvailable) q.set('available', '1');
      return RestAdapter.get('/api/products?' + q.toString());
    }
    const rows = await LocalAdapter.list('products');
    const cats = await LocalAdapter.list('categories');
    return rows.map(p => Object.assign({}, p, { categoryName:(byId(cats, p.catId) || {}).name || '—' }));
  },
  getProduct: async (id) => useBackend() ? RestAdapter.get('/api/products/' + id) : LocalAdapter.get('products', id),
  saveProduct: async (d) => useBackend()
    ? (d.id ? RestAdapter.patch('/api/products/' + d.id, d) : RestAdapter.post('/api/products', d))
    : (d.id ? LocalAdapter.update('products', d.id, d) : LocalAdapter.insert('products', d)),
  deleteProduct: async (id) => useBackend() ? RestAdapter.del('/api/products/' + id) : LocalAdapter.remove('products', id),
  saveCategory: async (d) => useBackend()
    ? (d.id ? RestAdapter.patch('/api/categories/' + d.id, d) : RestAdapter.post('/api/categories', d))
    : (d.id ? LocalAdapter.update('categories', d.id, d) : LocalAdapter.insert('categories', d)),
  deleteCategory: async (id) => useBackend() ? RestAdapter.del('/api/categories/' + id) : LocalAdapter.remove('categories', id),

  /* ------------- الطاولات: GET /api/tables (ومصدر رقم QR) ---------------- */
  tables: async () => useBackend() ? RestAdapter.get('/api/tables') : LocalAdapter.list('tables', null, (a,b) => a.number - b.number),
  /** التحقق من رقم الطاولة — يُستخدم عند تمرير الرقم تلقائيًا من QR */
  validateTable: async (tableNumber) => {
    const n = parseInt(tableNumber, 10);
    if (!n || n < 1) throw new ApiError('INVALID_TABLE', 'رقم الطاولة غير صالح. امسح رمز QR الموجود على الطاولة أو أدخل الرقم يدويًا.');
    const tables = await Api.tables();
    const t = tables.find(x => x.number === n);
    if (!t) throw new ApiError('TABLE_NOT_FOUND', 'الطاولة رقم ' + n + ' غير مسجّلة في النظام. راجع الكاشير.');
    return t;
  },
  saveTable: async (d) => useBackend()
    ? (d.id ? RestAdapter.patch('/api/tables/' + d.id, d) : RestAdapter.post('/api/tables', d))
    : (d.id ? LocalAdapter.update('tables', d.id, d) : LocalAdapter.insert('tables', d)),

  /* ---------------- العملاء: /api/customers ------------------------------ */
  customers: async () => useBackend() ? RestAdapter.get('/api/customers') : LocalAdapter.list('customers', null, (a,b) => (b.totalSpent||0)-(a.totalSpent||0)),
  getCustomer: async (id) => useBackend() ? RestAdapter.get('/api/customers/' + id) : LocalAdapter.get('customers', id),
  /** الهوية برقم الجوال (معرّف فريد) — لا بالاسم */
  findCustomerByPhone: async (phone) => {
    const p = normalizePhone(phone);
    if (useBackend()) return RestAdapter.get('/api/customers/by-phone?phone=' + encodeURIComponent(p));
    const rows = await LocalAdapter.list('customers');
    return rows.find(c => normalizePhone(c.phone) === p) || null;
  },
  saveCustomer: async (d) => useBackend()
    ? (d.id ? RestAdapter.patch('/api/customers/' + d.id, d) : RestAdapter.post('/api/customers', d))
    : (d.id ? LocalAdapter.update('customers', d.id, d) : LocalAdapter.insert('customers', d)),

  /* ================== الطلبات: POST /api/orders =========================
     إنشاء الطلب يحاكي تحقق الخادم:
       • الأسعار تُقرأ من الكتالوج لا من المتصفح (منع التلاعب)
       • التحقق من التوفر + صحة الإضافات
       • حساب المجموع والخصم والضريبة
       • التحقق من صلاحية كوبون المكافأة وملكيته
     ==================================================================== */
  createOrder: async (payload) => {
    if (useBackend()) return RestAdapter.post('/api/orders', payload);
    const db = await LocalAdapter.read();
    const s = db.settings;

    const customer = byId(db.customers, payload.customerId);
    if (!customer) throw new ApiError('CUSTOMER_REQUIRED', 'لا يمكن إنشاء طلب بدون عميل مسجّل بمعرّف فريد.');
    if (!payload.items || !payload.items.length) throw new ApiError('EMPTY_ORDER', 'لا يمكن إرسال طلب بدون أصناف.');

    const table = db.tables.find(t => t.number === Number(payload.tableNumber));
    if (!table) throw new ApiError('INVALID_TABLE', 'رقم الطاولة غير صحيح أو غير مسجّل.');

    const items = payload.items.map(line => {
      const p = byId(db.products, line.productId);
      if (!p) throw new ApiError('PRODUCT_NOT_FOUND', 'صنف غير موجود في المنيو.');
      if (!p.avail) throw new ApiError('PRODUCT_UNAVAILABLE', 'الصنف «' + p.name + '» غير متوفر حاليًا، حدّث السلة ثم أعد المحاولة.');
      const addons = (line.addons || []).map(a => {
        const found = (p.addons || []).find(x => x.id === a.id);
        if (!found) throw new ApiError('INVALID_ADDON', 'إضافة غير صالحة للصنف «' + p.name + '».');
        return { id:found.id, name:found.name, price:Number(found.price) || 0 };
      });
      const qty = clamp(parseInt(line.qty, 10) || 1, 1, 50);
      const unit = Number(p.price) + sum(addons, a => a.price);
      return { id: uid('oi'), productId:p.id, name:p.name, emoji:p.emoji, image:p.image || '', unitPrice:Number(p.price),
               addons, qty, notes:String(line.notes || '').slice(0,180), lineTotal:+(unit * qty).toFixed(2) };
    });

    const subtotal = +sum(items, i => i.lineTotal).toFixed(2);

    let discount = 0, couponCode = null;
    if (payload.couponCode){
      const cp = (customer.coupons || []).find(c => c.code === payload.couponCode);
      if (!cp) throw new ApiError('COUPON_INVALID', 'كوبون المكافأة غير موجود.');
      if (cp.used) throw new ApiError('COUPON_USED', 'تم استخدام كوبون المكافأة مسبقًا.');
      const rw = byId(db.rewards, cp.rewardId);
      if (!rw) throw new ApiError('REWARD_NOT_FOUND', 'المكافأة غير متاحة.');
      if (cp.type === 'percent') discount = +(subtotal * cp.value / 100).toFixed(2);
      else if (cp.type === 'product'){
        const match = items.filter(i => i.productId === cp.productId);
        if (!match.length) throw new ApiError('REWARD_NOT_APPLICABLE', 'المكافأة «' + rw.name + '» تتطلب وجود الصنف في الطلب.');
        discount = +Math.min(cp.value, sum(match, m => m.lineTotal)).toFixed(2);
      } else discount = +Math.min(cp.value, subtotal).toFixed(2);
      couponCode = cp.code;
    }

    const taxable = Math.max(0, subtotal - discount);
    const tax = +(taxable * (Number(s.taxRate) || 0) / 100).toFixed(2);
    const serviceFee = +(taxable * (Number(s.serviceFeeRate) || 0) / 100).toFixed(2);
    const total = +(taxable + tax + serviceFee).toFixed(2);

    db.counters.orderSeq = (db.counters.orderSeq || 1000) + 1;
    const number = CONFIG.orderPrefix + db.counters.orderSeq;
    const now = Date.now();
    const eta = clamp(parseInt(payload.estimatedMinutes, 10) || s.prepTimeDefault, 5, s.prepTimeMax);
    const id = uid('ord');

    const order = {
      id, number, customerId:customer.id, customerName:customer.name, customerPhone:normalizePhone(customer.phone),
      tableNumber:table.number, status:'pending', type:payload.type || 'dine-in',
      items, notes:String(payload.notes || '').slice(0,300),
      subtotal, discount, couponCode, tax, serviceFee, total,
      estimatedMinutes:eta, estimatedReadyAt: now + eta * 60000,
      pointsAwarded:false, cancelReason:'', source:payload.source || 'qr-table',
      createdAt:now, updatedAt:now, version:1,
      history:[{ id: uid('osh'), status:'pending', at:now, by:'customer', note:'أُرسل الطلب من الطاولة ' + table.number }],
      statusHistory:[]
    };
    order.statusHistory = order.history;
    db.orders.unshift(order);

    if (couponCode){
      const cp = (customer.coupons || []).find(c => c.code === couponCode);
      if (cp){ cp.used = true; cp.usedAt = now; cp.orderId = id; }
    }
    customer.totalOrders = (customer.totalOrders || 0) + 1;
    items.forEach(i => { const p = byId(db.products, i.productId); if (p) p.sold = (p.sold || 0) + i.qty; });
    table.status = 'busy'; table.currentOrderId = id;
    db.logs.unshift({ id: uid('lg'), at:now, level:'info', area:'orders', message:'طلب جديد ' + number + ' — طاولة ' + table.number + ' — ' + plainMoney(total) });
    await LocalAdapter.commit();

    return deepClone(order);
  },

  /* ------------- قراءة الطلبات: GET /api/orders?status=&customer= --------- */
  orders: async (query) => {
    query = query || {};
    if (useBackend()){
      const q = new URLSearchParams();
      if (query.status) q.set('status', query.status);
      if (query.customerId) q.set('customer', query.customerId);
      if (query.since) q.set('since', query.since);
      if (query.limit) q.set('limit', query.limit);
      const rows = await RestAdapter.get('/api/orders?' + q.toString());
      /* تحديث النسخة المحلية لقوائم الإدارة الكاملة (تُستخدم في قراءات متزامنة مثل أرقام الطلبات) */
      if (Array.isArray(rows) && !query.customerId && !query.since && !query.status){
        try { DB.orders = rows; saveDB(); } catch (e){ /* نتجاهل */ }
      }
      return rows;
    }
    let rows = await LocalAdapter.list('orders', null, (a,b) => b.createdAt - a.createdAt);
    if (query.status) rows = rows.filter(o => o.status === query.status);
    if (query.statuses) rows = rows.filter(o => query.statuses.includes(o.status));
    if (query.customerId) rows = rows.filter(o => o.customerId === query.customerId);
    if (query.since) rows = rows.filter(o => (o.updatedAt || o.createdAt) > query.since);
    if (query.limit) rows = rows.slice(0, query.limit);
    return rows;
  },
  getOrder: async (id) => useBackend() ? RestAdapter.get('/api/orders/' + id) : LocalAdapter.get('orders', id),
  getOrderByNumber: async (number) => {
    if (useBackend()) return RestAdapter.get('/api/orders/by-number/' + encodeURIComponent(number));
    const rows = await LocalAdapter.list('orders');
    const o = rows.find(x => String(x.number).toLowerCase() === String(number).trim().toLowerCase());
    if (!o) throw new ApiError('NOT_FOUND', 'لا يوجد طلب بهذا الرقم.');
    return o;
  },

  /* -------- PATCH /api/orders/:id/status — مع كشف تعارض التحديثات -------- */
  updateOrderStatus: async (orderId, nextStatus, opts) => {
    opts = opts || {};
    if (useBackend()) return RestAdapter.patch('/api/orders/' + orderId + '/status', { status: nextStatus, note: opts.note, version: opts.expectedVersion });
    const db = await LocalAdapter.read();
    const order = byId(db.orders, orderId);
    if (!order) throw new ApiError('NOT_FOUND', 'الطلب غير موجود.');
    if (opts.expectedVersion && (order.version || 1) !== opts.expectedVersion)
      throw new ApiError('CONFLICT', 'تم تعديل هذا الطلب من جهاز/مستخدم آخر. تم تحديث البيانات، أعد المحاولة.');
    const allowed = (ORDER_STATUS[order.status] || {}).next || [];
    if (!allowed.includes(nextStatus))
      throw new ApiError('INVALID_TRANSITION', 'لا يمكن الانتقال من «' + ORDER_STATUS[order.status].ar + '» إلى «' + (ORDER_STATUS[nextStatus] || {}).ar + '».');
    if (nextStatus === 'cancelled' && !opts.note)
      throw new ApiError('CANCEL_REASON_REQUIRED', 'سبب الإلغاء مطلوب.');

    const now = Date.now();
    order.status = nextStatus;
    order.updatedAt = now;
    order.version = (order.version || 1) + 1;
    if (nextStatus === 'accepted') order.acceptedAt = now;
    if (nextStatus === 'ready') order.readyAt = now;
    if (nextStatus === 'delivered') order.deliveredAt = now;
    if (nextStatus === 'cancelled'){ order.cancelReason = opts.note; order.cancelledAt = now; }
    order.history.push({ id: uid('osh'), status:nextStatus, at:now, by:opts.by || 'admin', note:opts.note || '' });
    order.statusHistory = order.history;

    const table = db.tables.find(t => t.number === order.tableNumber);
    if (table){
      if (['delivered','cancelled'].includes(nextStatus)){ table.status = 'open'; table.currentOrderId = null; }
      else { table.status = 'busy'; table.currentOrderId = order.id; }
    }

    db.logs.unshift({ id: uid('lg'), at:now, level:'info', area:'orders',
      message:'تحديث الطلب ' + order.number + ' → ' + ORDER_STATUS[nextStatus].ar + ' (بواسطة ' + (opts.by || 'admin') + ')' });
    await LocalAdapter.commit();

    const customer = byId(db.customers, order.customerId);

    if (nextStatus === 'delivered'){
      // النقاط بعد التسليم المؤكد فقط، مرة واحدة لكل طلب
      Loyalty.awardForOrder(order, opts.by || 'system');
      if (customer){
        customer.totalSpent = +((customer.totalSpent || 0) + order.total).toFixed(2);
        if (order.couponCode){
          const cp = (customer.coupons || []).find(c => c.code === order.couponCode);
          if (cp) cp.used = true;
        }
      }
    }
    if (nextStatus === 'cancelled' && order.couponCode && customer){
      const cp = (customer.coupons || []).find(c => c.code === order.couponCode);
      if (cp && cp.orderId === order.id){ cp.used = false; cp.usedAt = null; cp.orderId = null; }
    }
    await LocalAdapter.commit();
    return deepClone(order);
  },

  /** تعديل وقت التجهيز المتوقع: PATCH /api/orders/:id/eta */
  setOrderEta: async (orderId, minutes, by) => {
    if (useBackend()) return RestAdapter.patch('/api/orders/' + orderId + '/eta', { minutes });
    const db = await LocalAdapter.read();
    const order = byId(db.orders, orderId);
    if (!order) throw new ApiError('NOT_FOUND', 'الطلب غير موجود.');
    const m = clamp(parseInt(minutes, 10) || db.settings.prepTimeDefault, 5, db.settings.prepTimeMax);
    order.estimatedMinutes = m;
    order.estimatedReadyAt = (order.acceptedAt || order.createdAt) + m * 60000;
    order.updatedAt = Date.now();
    order.version = (order.version || 1) + 1;
    db.logs.unshift({ id: uid('lg'), at:Date.now(), level:'info', area:'orders', message:'تعديل وقت التجهيز للطلب ' + order.number + ' إلى ' + m + ' دقيقة (بواسطة ' + (by||'admin') + ')' });
    await LocalAdapter.commit();
    return deepClone(order);
  },

  /** الأكثر مبيعًا (للتقارير والاقتراحات) */
  bestSellers: async (limit) => {
    const rows = await Api.orders({});
    const map = {};
    rows.filter(o => o.status !== 'cancelled').forEach(o => (o.items || []).forEach(i => {
      map[i.productId] = map[i.productId] || { productId:i.productId, name:i.name, emoji:i.emoji, qty:0, revenue:0 };
      map[i.productId].qty += i.qty;
      map[i.productId].revenue += i.lineTotal;
    }));
    return Object.values(map).sort((a,b) => b.qty - a.qty).slice(0, limit || 5);

  /* ---------------------- الولاء والمكافآت ------------------------------- */
  loyaltyTransactions: async (customerId) => {
    if (useBackend()) return RestAdapter.get('/api/loyalty/transactions?customer=' + customerId);

  /** إضافة حركة نقاط (سجل تدقيق) مع تحديث الرصيد */
  addLoyaltyTransaction: async (tx) => {

    db.logs.unshift({ id: uid('lg'), at:row.at, level:'info', area:'loyalty',
      message:(tx.points >= 0 ? 'إضافة ' : 'خصم ') + Math.abs(tx.points) + ' نقطة للعميل ' + (c ? c.name : tx.customerId) + ' — ' + (tx.note || '') });
    await LocalAdapter.commit();

  /** استبدال كامل الرصيد: يسجّل حركة استبدال ثم يجعل الرصيد صفرًا. */
  redeemCustomerBalance: async (customerId, note) => {
    if (useBackend()) return RestAdapter.post('/api/loyalty/redeem-balance', { customerId, note });
    const db = await LocalAdapter.read();
    const customer = byId(db.customers, customerId);
    if (!customer) throw new ApiError('CUSTOMER_NOT_FOUND', 'العميل غير موجود.');
    const balance = Math.max(0, parseInt(customer.pointsBalance, 10) || 0);
    if (!balance) throw new ApiError('NO_POINTS', 'لا يوجد رصيد نقاط قابل للاستبدال لهذا العميل.');
    const transaction = await Api.addLoyaltyTransaction({
      customerId, orderId:null, type:'redeem', points:-balance,
      by:(App.admin.user || {}).name || 'admin',
      note:String(note || 'استبدال كامل الرصيد من لوحة الإدارة').slice(0, 200)
    });
    return { transaction, customer:deepClone(byId(db.customers, customerId)) };
  },
  rewards: async () => useBackend() ? RestAdapter.get('/api/rewards') : LocalAdapter.list('rewards', null, (a,b) => a.cost - b.cost),
  saveReward: async (d) => useBackend()
    ? (d.id ? RestAdapter.patch('/api/rewards/' + d.id, d) : RestAdapter.post('/api/rewards', d))
    : (d.id ? LocalAdapter.update('rewards', d.id, d) : LocalAdapter.insert('rewards', d)),
  deleteReward: async (id) => useBackend() ? RestAdapter.del('/api/rewards/' + id) : LocalAdapter.remove('rewards', id),

  /* -------------------- رفع صور الأصناف (Uploads) ------------------------ */
  /** رفع صورة صنف: POST /api/uploads (multipart/form-data)
   *  في وضع الديمو (بلا باكند) نُعيد Data URL محليًا حتى تعمل المعاينة بلا فقدان أي ميزة. */
  uploadImage: async (file) => {
    if (!file) throw new ApiError('NO_FILE', 'لم يتم اختيار صورة.');
    if (useBackend()){
      const fd = new FormData();
      fd.append('file', file, file.name || 'image');
      const res = await fetch(CONFIG.apiBase.replace(/\/$/, '') + '/api/uploads', { method:'POST', body:fd, credentials:'include' });
      let data = null; try { data = await res.json(); } catch (e){ data = null; }
      if (!res.ok) throw new ApiError((data && data.code) || ('HTTP_' + res.status), (data && data.message) || 'تعذّر رفع الصورة.');
      return data && data.url ? data.url : '';
    }
    return await new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(String(reader.result || ''));
      reader.onerror = () => reject(new ApiError('READ_FAILED', 'تعذّر قراءة ملف الصورة.'));
      reader.readAsDataURL(file);
    });
  },

  /* ---------------------------- الإعدادات -------------------------------- */
  settings: async () => {
    if (useBackend()) return RestAdapter.get('/api/settings');

  saveSettings: async (patch) => {

    const payload = Object.assign({}, d);

  deleteAdminUser: async (id) => useBackend()

  changeOwnPassword: async (currentPassword, newPassword) => {

  /** تسجيل الدخول — في الإنتاج POST /api/auth/login + جلسة HttpOnly */

    const user = db.adminUsers.find(u => u.username.toLowerCase() === String(username).trim().toLowerCase());

    if (user.passwordHash !== demoHash(password)) throw new ApiError('AUTH_FAILED', 'كلمة المرور غير صحيحة.');
    db.logs.unshift({ id: uid('lg'), at:Date.now(), level:'info', area:'auth', message:'دخول لوحة الإدارة: ' + user.name + ' (' + ROLE_AR[user.role] + ')' });
    await LocalAdapter.commit();
    return { user:{ id:user.id, name:user.name, username:user.username, role:user.role }, perms: PERMS[user.role] || [] };

  /* --------------------------- السجلات والتقارير ------------------------- */
  logs: async (filter) => {
    if (useBackend()) return RestAdapter.get('/api/logs');
    let rows = await LocalAdapter.list('logs', null, (a,b) => b.at - a.at);
    if (filter && filter.area) rows = rows.filter(l => l.area === filter.area);
    if (filter && filter.level) rows = rows.filter(l => l.level === filter.level);
    return rows.slice(0, 250);
  },
  /** ملخص المبيعات اليومي + آخر 7 أيام (يُحسب على الخادم في الإنتاج) */
  salesSummary: async () => {
    if (useBackend()) return RestAdapter.get('/api/reports/summary');
    const db = await LocalAdapter.read();
    const today = startOfDay(Date.now());
    const paid = db.orders.filter(o => o.status !== 'cancelled');
    const todayOrders = db.orders.filter(o => o.createdAt >= today);
    const todayPaid = todayOrders.filter(o => o.status !== 'cancelled');
    const days = [];
    for (let i = 6; i >= 0; i--){
      const d0 = startOfDay(Date.now() - i * 86400000), d1 = d0 + 86400000;
      const rows = db.orders.filter(o => o.createdAt >= d0 && o.createdAt < d1 && o.status !== 'cancelled');
      days.push({ key:dayKey(d0), label:AR_DAYS[new Date(d0).getDay()], revenue:+sum(rows, r => r.total).toFixed(2), count:rows.length });
    }
    const itemMap = {};
    paid.forEach(o => (o.items || []).forEach(i => {
      itemMap[i.productId] = itemMap[i.productId] || { name:i.name, emoji:i.emoji, qty:0, revenue:0 };
      itemMap[i.productId].qty += i.qty;
      itemMap[i.productId].revenue += i.lineTotal;
    }));
    const statusCount = {};
    Object.keys(ORDER_STATUS).forEach(k => statusCount[k] = db.orders.filter(o => o.status === k).length);
    return {
      today: { orders:todayOrders.length, revenue:+sum(todayPaid, o => o.total).toFixed(2),
               customers:new Set(todayOrders.map(o => o.customerId)).size,
               avg: todayPaid.length ? +(sum(todayPaid, o => o.total) / todayPaid.length).toFixed(2) : 0,
               cancelled: todayOrders.filter(o => o.status === 'cancelled').length },
      allTime: { orders:db.orders.filter(o => o.status !== 'cancelled').length, revenue:+sum(paid, o => o.total).toFixed(2) },
      days, topItems: Object.values(itemMap).sort((a,b) => b.qty - a.qty).slice(0, 8), statusCount,
      points: { issued: sum(db.loyaltyTransactions.filter(t => t.points > 0), t => t.points),
                redeemed: Math.abs(sum(db.loyaltyTransactions.filter(t => t.points < 0), t => t.points)) }
    };
  }
};
/* ==========================================================================
   5) حالة التطبيق (App State) + السلة
   ========================================================================== */
const LS_CART_KEY = 'srs.cart.v1';

const App = {
  route: { name:'welcome', params:{}, query:{} },
  customer: null,              // عميل الجلسة الحالية (يحمل معرّفًا فريدًا)
  table: null,                 // الطاولة القادمة من QR أو يدويًا
  cart: [],                    // OrderItems المؤقتة قبل التأكيد
  coupon: null,                // كوبون مكافأة مُختار
  checkedOut: false,
  catalog: { categories:[], products:[] },
  ui: { catalogLoading:true, catalogError:null, busy:false },
  admin: {
    user:null, perms:[], tab:'dashboard', orders:[],
    filter:'active', search:'', sound:true, notifyEnabled:false,
    seen:{}, simulate:false, lastPollAt:0, report:{}, logs:[]
  }
};

/* ------------------------------- السلة ----------------------------------- */
function cartSave(){ try { localStorage.setItem(LS_CART_KEY, JSON.stringify(App.cart)); } catch (e){} }
function cartLoad(){
  try {
    const raw = localStorage.getItem(LS_CART_KEY);
    App.cart = raw ? (JSON.parse(raw) || []) : [];
  } catch (e){ App.cart = []; }
}
function cartClear(){ App.cart = []; App.coupon = null; cartSave(); renderCartBadge(); }
function cartCount(){ return sum(App.cart, l => l.qty); }
function cartSubtotal(){ return +sum(App.cart, l => lineTotal(l)).toFixed(2); }
/** مجموع سطر = (سعر الصنف + الإضافات) × الكمية */
function lineTotal(line){
  const unit = Number(line.unitPrice || 0) + sum(line.addons || [], a => Number(a.price) || 0);
  return +(unit * (Number(line.qty) || 0)).toFixed(2);
}
function lineUnit(line){ return +(Number(line.unitPrice || 0) + sum(line.addons || [], a => Number(a.price) || 0)).toFixed(2); }
/** إضافة صنف للسلة (مع دمج الأسطر المتطابقة) */
function cartAdd(product, qty, addons, notes){
  const key = (p) => p.productId + '|' + (p.addons || []).map(a => a.id).sort().join(',') + '|' + (p.notes || '');
  const line = {
    productId: product.id, name: product.name, emoji: product.emoji, image: product.image || '',
    unitPrice: Number(product.price), addons: (addons || []).map(a => ({ id:a.id, name:a.name, price:Number(a.price) || 0 })),
    qty: clamp(parseInt(qty, 10) || 1, 1, 50), notes: notes || ''
  };
  const existing = App.cart.find(l => key(l) === key(line));
  if (existing) existing.qty = clamp(existing.qty + line.qty, 1, 50);
  else App.cart.push(line);          // لا نسمح بنفس الإضافة بنفس الملاحظة كسطرين
  cartSave(); renderCartBadge(); Notify.toast({ title:'أُضيف إلى السلة', msg: product.name + ' × ' + line.qty, type:'ok' });
}
function cartSetQty(index, qty){
  const l = App.cart[index]; if (!l) return;
  const q = parseInt(qty, 10);
  if (!q || q < 1) return cartRemove(index);
  l.qty = clamp(q, 1, 50); cartSave(); renderCartBadge();
}
function cartRemove(index){ App.cart.splice(index, 1); cartSave(); renderCartBadge(); }

/** ملخّص السلة (يُحسب محليًا للعرض، ويُعاد حسابه على الخادم عند الإنشاء) */
function cartTotals(){
  const subtotal = cartSubtotal();
  let discount = 0;
  if (App.coupon){
    if (App.coupon.type === 'percent') discount = +(subtotal * App.coupon.value / 100).toFixed(2);
    else if (App.coupon.type === 'product'){
      // مكافأة صنف: تُخصم قيمة الصنف إن كان موجودًا في السلة (وإلا لا خصم)
      const lines = App.cart.filter(l => l.productId === App.coupon.productId);
      discount = lines.length ? +Math.min(App.coupon.value, sum(lines, l => lineTotal(l))).toFixed(2) : 0;
    }
    else discount = +Math.min(App.coupon.value, subtotal).toFixed(2);
  }
  const taxable = Math.max(0, subtotal - discount);
  const taxRate = Number((DB.settings || {}).taxRate) || 0;
  const tax = +(taxable * taxRate / 100).toFixed(2);
  const serviceFee = +(taxable * (Number((DB.settings || {}).serviceFeeRate) || 0) / 100).toFixed(2);
  return { subtotal, discount, tax, serviceFee, total: +(taxable + tax + serviceFee).toFixed(2), taxRate };
}

/* ---------------------------- جلسة العميل -------------------------------- */
function saveCustomerSession(customerId){
  try { localStorage.setItem(LS_SESSION_KEY, JSON.stringify({ customerId, at: Date.now() })); } catch (e){}
}
function clearCustomerSession(){ try { localStorage.removeItem(LS_SESSION_KEY); } catch (e){} App.customer = null; }
async function restoreCustomerSession(){
  try {
    const raw = localStorage.getItem(LS_SESSION_KEY);
    if (!raw) return null;
    const s = JSON.parse(raw);
    if (!s || !s.customerId) return null;
    const c = await Api.getCustomer(s.customerId);
    App.customer = c;
    return c;
  } catch (e){ clearCustomerSession(); return null; }
}
