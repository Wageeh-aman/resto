/* ==========================================================================
   6) نظام نقاط الولاء (Loyalty) — قابل للضبط من لوحة الإدارة
   ========================================================================== */
const Loyalty = {
  rules(){ return DB.settings.loyalty || {}; },
  /** حساب النقاط المتوقعة لقيمة شراء */
  pointsForSubtotal(subtotal){
    const r = Loyalty.rules();
    if (!r.enabled) return 0;
    if (subtotal < (r.minOrderForPoints || 0)) return 0;
    let pts = r.mode === 'perOrder' ? Number(r.pointsPerOrder) || 0 : (Number(subtotal) || 0) * (Number(r.pointsPerCurrency) || 0);
    return r.roundMode === 'round' ? Math.round(pts) : Math.floor(pts);
  },
  /** هل أُضيفت نقاط هذا الطلب مسبقًا؟ (منع الإضافة المزدوجة) */
  alreadyAwarded(orderId){
    return (DB.loyaltyTransactions || []).some(t => t.orderId === orderId && t.type === 'earn');
  },
  /**
   * إضافة النقاط بعد التسليم المؤكد فقط.
   * تُحفظ حركة في سجل التدقيق مرتبطة بمعرّف العميل ورقم الطلب.
   */
  awardForOrder(order, by){
    try {
      const r = Loyalty.rules();
      if (!r.enabled){ pushLog('warn', 'loyalty', 'نظام الولاء معطّل — لم تُضف نقاط للطلب ' + order.number); saveDB(); return 0; }
      if (order.pointsAwarded || Loyalty.alreadyAwarded(order.id)){
        pushLog('warn', 'loyalty', 'محاولة إضافة نقاط مكرّرة للطلب ' + order.number + ' — تم تجاهلها.');
        saveDB(); return 0;
      }
      if ((order.subtotal || 0) < (r.minOrderForPoints || 0)){
        pushLog('info', 'loyalty', 'الطلب ' + order.number + ' أقل من الحد الأدنى لاستحقاق النقاط.');
        saveDB(); return 0;
      }
      const pts = Loyalty.pointsForSubtotal(order.subtotal);
      const db = DB; // تعديل مباشر داخل نفس العملية (الخادم يقوم بذلك ذريًّا)
      db.loyaltyTransactions.unshift({
        id: uid('lt'), customerId: order.customerId, orderId: order.id, type:'earn', points: pts,
        at: Date.now(), by: by || 'system', note:'نقاط الطلب ' + order.number + (r.mode === 'perCurrency' ? ' (حسب قيمة الشراء)' : ' (نقاط ثابتة للطلب)')
      });
      const c = byId(db.customers, order.customerId);
      if (c) c.pointsBalance = (c.pointsBalance || 0) + pts;
      const o = byId(db.orders, order.id);
      if (o){ o.pointsAwarded = true; o.pointsEarned = pts; }
      db.logs.unshift({ id: uid('lg'), at: Date.now(), level:'info', area:'loyalty',
        message:'أُضيفت ' + pts + ' نقطة للعميل ' + (c ? c.name : order.customerId) + ' عن الطلب ' + order.number });
      saveDB();
      return pts;
    } catch (e){ logError('loyalty', 'فشل إضافة النقاط: ' + (e && e.message)); return 0; }
  },
  /** يمكن استبدال المكافأة؟ */
  canRedeem(customer, reward){
    const r = Loyalty.rules();
    if (!customer || !reward || !reward.active) return false;
    return (customer.pointsBalance || 0) >= reward.cost && reward.cost >= (r.redeemThreshold || 0);
  },
  /**
   * استبدال مكافأة: خصم النقاط + إنشاء كوبون
   * النقاط تُخصم فورًا (سجل تدقيق) والكوبون يُستخدم عند إنشاء الطلب.
   */
  async redeem(customerId, rewardId){
    if (useBackend()){
      /* المصدر الموثوق = الخادم (نفس القواعد: الرصيد، حد الاستبدال، الكوبون) */
      const out = await RestAdapter.post('/api/loyalty/redeem', { customerId, rewardId });
      if (App.customer && App.customer.id === customerId) App.customer = await Api.getCustomer(customerId);
      return out;
    }
    const db = await LocalAdapter.read();
    const c = byId(db.customers, customerId);
    const rw = byId(db.rewards, rewardId);
    if (!c) throw new ApiError('CUSTOMER_NOT_FOUND', 'العميل غير موجود.');
    if (!rw || !rw.active) throw new ApiError('REWARD_NOT_FOUND', 'المكافأة غير متاحة.');
    if ((c.pointsBalance || 0) < rw.cost) throw new ApiError('INSUFFICIENT_POINTS', 'رصيد النقاط غير كافٍ لاستبدال «' + rw.name + '».');
    const redeemThreshold = (db.settings.loyalty || {}).redeemThreshold || 0;
    if (rw.cost < redeemThreshold) throw new ApiError('BELOW_THRESHOLD', 'لا يمكن استبدال مكافأة أقل من حد الاستبدال (' + redeemThreshold + ' نقطة).');

    const code = 'RW-' + hashCode(c.id + rw.id + Date.now()).toString(36).toUpperCase().slice(0, 6);
    const coupon = { code, rewardId: rw.id, name: rw.name, type: rw.type, value: rw.value,
                     productId: rw.productId || null, createdAt: Date.now(), used: false, usedAt: null, orderId: null };
    c.coupons = c.coupons || [];
    c.coupons.unshift(coupon);
    const tx = await Api.addLoyaltyTransaction({
      customerId: c.id, orderId: null, type:'redeem', points: -rw.cost, by:'customer',
      rewardId: rw.id, note:'استبدال مكافأة: ' + rw.name + ' — كوبون ' + code
    });
    if (App.customer && App.customer.id === c.id) App.customer = await Api.getCustomer(c.id);
    return { coupon, tx };
  },
  /** نص قاعدة الولاء للعرض */
  ruleText(){
    const r = Loyalty.rules();
    if (!r.enabled) return 'نظام النقاط معطّل حاليًا.';
    const earn = r.mode === 'perOrder'
      ? 'نقاط ثابتة لكل طلب: ' + r.pointsPerOrder + ' نقطة'
      : r.pointsPerCurrency + ' نقطة لكل 1 ' + currency() + ' من قيمة الطلب (قبل الضريبة)';
    return earn + ' · الحد الأدنى للاستحقاق: ' + plainMoney(r.minOrderForPoints) +
           ' · أقل رصيد للاستبدال: ' + r.redeemThreshold + ' نقطة';
  }
};

/* ==========================================================================
   7) التنبيهات: Toast + صوت + إشعار المتصفح (مع احترام الإعدادات)
   ========================================================================== */
const Notify = {
  toast(opts){
    const o = Object.assign({ title:'', msg:'', type:'info', timeout:4200 }, opts || {});
    const ics = { ok:'✅', err:'⛔', warn:'⚠️', info:'ℹ️' };
    const node = el(
      '<div class="toast t-' + esc(o.type) + '" role="alert">' +
        '<span class="t-ic">' + (ics[o.type] || 'ℹ️') + '</span>' +
        '<div class="t-body"><div class="t-title">' + esc(o.title) + '</div>' +
          (o.msg ? '<div class="t-msg">' + esc(o.msg) + '</div>' : '') + '</div>' +
        '<button class="t-close" type="button" aria-label="إغلاق التنبيه">✕</button>' +
      '</div>');
    const close = () => { node.classList.add('out'); setTimeout(() => node.remove(), 200); };
    $('.t-close', node).addEventListener('click', close);
    $('#toasts').appendChild(node);
    if (o.timeout) setTimeout(close, o.timeout);
    return node;
  },
  /** نغمة تنبيه مولّدة بـ WebAudio (بدون ملفات خارجية) */
  beep(pattern){
    if (!App.admin.sound) return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      const ctx = Notify._ctx || (Notify._ctx = new AC());
      const notes = pattern === 'new-order' ? [880, 1180, 880] : [740];
      notes.forEach((f, i) => {
        const osc = ctx.createOscillator(), gain = ctx.createGain();
        osc.type = 'sine'; osc.frequency.value = f;
        const t0 = ctx.currentTime + i * 0.16;
        gain.gain.setValueAtTime(0.0001, t0);
        gain.gain.exponentialRampToValueAtTime(0.16, t0 + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.14);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(t0); osc.stop(t0 + 0.16);
      });
    } catch (e){ /* الصوت غير مدعوم */ }
  },
  /** طلب إذن إشعارات المتصفح (يُطلب فقط عند تفاعل المستخدم) */
  async requestPermission(){
    if (!('Notification' in window)) { Notify.toast({ title:'غير مدعوم', msg:'متصفحك لا يدعم إشعارات النظام.', type:'warn' }); return false; }
    try {
      const p = await Notification.requestPermission();
      App.admin.notifyEnabled = (p === 'granted');
      Notify.toast({ title:'إشعارات المتصفح', msg: p === 'granted' ? 'تم تفعيل الإشعارات.' : 'لم يتم منح الإذن.', type: p === 'granted' ? 'ok' : 'warn' });
      return App.admin.notifyEnabled;
    } catch (e){ return false; }
  },
  desktop(title, body){
    if (!App.admin.notifyEnabled || !('Notification' in window) || Notification.permission !== 'granted') return;
    try { new Notification(title, { body, icon:'data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"%3E%3Ctext y="48" font-size="48"%3E%F0%9F%8D%BD%EF%B8%8F%3C/text%3E%3C/svg%3E' }); } catch (e){}
  },
  /** تنبيه طلب جديد (مرئي + صوتي + إشعار نظام) */
  newOrder(order){
    Notify.toast({ title:'🔔 طلب جديد ' + order.number, msg:'طاولة ' + order.tableNumber + ' — ' + order.customerName + ' — ' + plainMoney(order.total), type:'warn', timeout:9000 });
    Notify.beep('new-order');
    Notify.desktop('طلب جديد ' + order.number, 'طاولة ' + order.tableNumber + ' — ' + plainMoney(order.total));
  }
};

/* ==========================================================================
   8) الموجّه (Router) — مسارات Hash + مسار إداري محمي
   ========================================================================== */
const ROUTES = [
  { path:'/',         name:'welcome',   render:() => renderWelcome(),          title:'ترحيب' , public:true },
  { path:'/register', name:'register',  render:() => renderRegister(),         title:'تسجيل العميل', public:true },
  { path:'/menu',     name:'menu',      render:() => renderMenu(),             title:'قائمة الطعام' },
  { path:'/cart',     name:'cart',      render:() => renderCartPage(),         title:'السلة' },
  { path:'/checkout', name:'checkout',  render:() => renderCheckout(),         title:'مراجعة الطلب' },
  { path:'/success',  name:'success',   render:(p) => renderSuccess(p) ,       title:'تم الطلب', public:true },
  { path:'/track',    name:'track',     render:(p) => renderTrack(p),          title:'متابعة الطلب', public:true },
  { path:'/profile',  name:'profile',   render:() => renderProfile(),          title:'ملفي' },
  { path:'/admin',    name:'admin',     render:(p) => renderAdmin(p),          title:'لوحة الإدارة', public:true }
];

/** تحليل الـ hash: #/track/ORD-1004?x=1 */
function parseHash(){
  const raw = (location.hash || '#/').replace(/^#/, '');
  const [pathPart, queryPart] = raw.split('?');
  const query = {};
  new URLSearchParams(queryPart || '').forEach((v, k) => { query[k] = v; });
  // دعم ?table=5 في عنوان الصفحة أيضًا (رابط QR)
  new URLSearchParams(location.search.replace(/^\?/, '')).forEach((v, k) => { query[k] = v; });
  const parts = pathPart.split('/').filter(Boolean);
  const base = '/' + (parts[0] || '');
  const route = ROUTES.find(r => r.path === base) || ROUTES[0];
  return { route, params:{ rest: parts.slice(1) }, query };
}
function navigate(path){ if (location.hash === '#' + path) handleRoute(); else location.hash = path; }

async function handleRoute(){
  const { route, params, query } = parseHash();
  App.route = { name:route.name, params, query };
  document.title = route.title + ' | ' + (DB.settings.restaurantName || 'نظام المطعم');

  // 1) تمرير رقم الطاولة تلقائيًا من QR Code (?table=5)
  if (query.table && !App.table){
    try {
      const t = await Api.validateTable(query.table);
      App.table = t;
      try { sessionStorage.setItem('srs.table', String(t.number)); } catch (e){}
      Notify.toast({ title:'تم قراءة رمز الطاولة', msg:'الطاولة رقم ' + t.number + ' — ' + t.area, type:'ok' });
    } catch (e){
      Notify.toast({ title:'رقم طاولة غير صالح', msg:e.message, type:'err', timeout:7000 });
      pushLog('error', 'qr', 'QR/رقم طاولة غير صالح: ' + query.table + ' — ' + e.message); saveDB();
    }
  }

  // 2) حماية مسارات العميل: يجب تسجيل الدخول (اسم + جوال + طاولة)
  const needsCustomer = !route.public && route.name !== 'admin';
  if (needsCustomer && !App.customer){
    try { await restoreCustomerSession(); } catch (e){}
  }
  if (needsCustomer && !App.customer){
    Notify.toast({ title:'تسجيل العميل مطلوب', msg:'سجّل اسمك ورقم جوالك ورقم الطاولة للمتابعة.', type:'warn' });
    return navigate('/register?next=' + route.name);
  }

  // 3) مسار الإدارة محمي: تحقق من الجلسة قبل العرض
  if (route.name === 'admin' && !App.admin.user){
    await restoreAdminSession();
  }

  // 4) العرض
  const isAdmin = route.name === 'admin';
  const isLanding = route.name === 'welcome' && !App.customer;
  document.body.classList.toggle('admin-mode', isAdmin);
  document.body.classList.toggle('landing-mode', isLanding);
  document.body.classList.toggle('has-bottomnav', !isAdmin && !isLanding);
  // تعرض الصفحة الافتتاحية الآن شريط تنقل كاملًا بدل بداية فارغة.
  $('#topbar').hidden = isAdmin;
  $('#appFooter').hidden = isAdmin || isLanding;
  $('#bottomNav').hidden = isAdmin;
  renderShell();

  const container = $('#view');
  container.innerHTML = '';
  if (isAdmin) container.classList.add('app-main-admin'); else container.classList.remove('app-main-admin');
  try {
    await route.render(params);
  } catch (e){
    container.innerHTML = errorStateHtml('تعذّر تحميل الشاشة', (e && e.message) || 'خطأ غير متوقع');
    logError('router', 'فشل عرض المسار ' + route.name + ': ' + (e && e.message));
  }
  renderBottomNav();
  if (!isAdmin) window.scrollTo({ top:0, behavior:'instant' in window ? 'instant' : 'auto' });
}

   9) أدوات واجهة مشتركة (Shell + Modal + Actions)

const Actions = {};   // خريطة الأحداث (Event Delegation) — تُوسّع في قسم الإدارة

/** نافذة منبثقة / Bottom Sheet مع تركيز لوحة المفاتيح وحصر التبويب */
let _sheetPrevFocus = null;
function openSheet(innerHtml, opts){
  opts = opts || {};
  closeSheet();
  _sheetPrevFocus = document.activeElement;
  const overlay = el('<div class="overlay"><div class="sheet" role="dialog" aria-modal="true" aria-label="' + esc(opts.label || 'نافذة') + '">' + innerHtml + '</div></div>');
  overlay.addEventListener('mousedown', (e) => { if (e.target === overlay) closeSheet(); });
  $('#modalRoot').appendChild(overlay);
  const focusables = () => $$('button,[href],input,select,textarea,[tabindex]:not([tabindex="-1"])', overlay).filter(n => !n.disabled && n.offsetParent !== null);
  const first = opts.autofocus ? $(opts.autofocus, overlay) : focusables()[0];
  if (first) first.focus();
  overlay.addEventListener('keydown', (e) => {
    if (e.key === 'Escape'){ closeSheet(); }
    else if (e.key === 'Tab'){
      const f = focusables(); if (!f.length) return;
      const firstEl = f[0], lastEl = f[f.length - 1];
      if (e.shiftKey && document.activeElement === firstEl){ e.preventDefault(); lastEl.focus(); }
      else if (!e.shiftKey && document.activeElement === lastEl){ e.preventDefault(); firstEl.focus(); }
    }
  });
  document.body.style.overflow = 'hidden';
  return overlay;
}
function closeSheet(){
  const o = $('#modalRoot .overlay');
  if (o){ o.remove(); document.body.style.overflow = ''; if (_sheetPrevFocus && _sheetPrevFocus.focus) _sheetPrevFocus.focus(); }
}

        (isActive(i) ? ' aria-current="page"' : '') + '>' +
        '<span class="ic" aria-hidden="true">' + i.ic + '</span>' + esc(i.label) +
        (i.count ? ' <b class="gold-c">' + num(i.count) + '</b>' : '') +

}

/** تحميل كتالوج المنيو (مرة واحدة ثم يُخزّن في الحالة) */
async function loadCatalog(force){
  if (!force && App.catalog.products.length) return App.catalog;
  App.ui.catalogLoading = true;
  try {
    const [cats, products] = await Promise.all([Api.categories(), Api.products({})]);
    App.catalog = { categories: cats.filter(c => c.active !== false), products };
    App.ui.catalogError = null;
  } catch (e){
    App.ui.catalogError = e.message;
    logError('catalog', 'فشل تحميل المنيو: ' + e.message);
    throw e;
  } finally {
    App.ui.catalogLoading = false;
    // عند فتح المنيو مباشرة، قد يكتمل التحميل بعد أول رسم للشاشة؛ أعد الرسم
    // لإظهار الأصناف بدل ترك المستخدم أمام حالة التحميل.
    if (App.route && App.route.name === 'menu' && App.catalog.products.length) renderMenu();
  }
  return App.catalog;
}

   10) شاشة الدخول (Landing)
   صفحة بسيطة: شعار + اسم + عبارة ترحيب + وصف مختصر + خياران فقط.
   الخلفية: عرض شرائح تلقائي (CSS خالص) لصور/رموز أصناف المنيو الموجودة.
   ========================================================================== */
/** شريحة خلفية: صورة الصنف إن وُجدت، وإلا رسم الصنف (الرمز) على تدرّج دافئ — بلا روابط خارجية */
function landingSlidesHtml(){
  const prods = (App.catalog.products || []).filter(p => p && p.emoji);
  const withImage = prods.filter(p => p.image);
  const ranked = prods.slice().sort((a, b) => (b.popular ? 1 : 0) - (a.popular ? 1 : 0));
  const pool = withImage.length >= 2 ? withImage : ranked;
  const fallback = ['🍖','🍗','🍛','🍕','🥗','🍔','🍮','🫖']
    .map((e, i) => ({ id:'landing_fallback_' + i, emoji:e, image:'' }));
  const src = pool.length ? pool : fallback;
  let html = '';
  for (let i = 0; i < 5; i++){
    const p = src[i % src.length];
    const hue = hashCode(p.id || p.emoji || String(i)) % 360;
    html += '<div class="ls" style="--i:' + i + ';--h:' + hue + '">' +
      (p.image
        ? '<img src="' + esc(assetUrl(p.image)) + '" alt="" loading="' + (i === 0 ? 'eager' : 'lazy') + '" decoding="async" onerror="this.remove()">'
        : '<div class="ls-art"><span aria-hidden="true">' + esc(p.emoji || '🍽️') + '</span></div>') +
    '</div>';
  }
  return html;
}

App.ui.menu = { q:'', catId:'all', onlyAvailable:false, sort:'popular' };

function filteredProducts(){
  const c = App.ui.menu;
  let rows = App.catalog.products.slice();
  if (c.catId !== 'all') rows = rows.filter(p => p.catId === c.catId);
  if (c.onlyAvailable) rows = rows.filter(p => p.avail);
  if (c.q){
    const q = c.q.trim().toLowerCase();
    rows = rows.filter(p => (p.name + ' ' + (p.desc || '') + ' ' + (p.categoryName || '')).toLowerCase().includes(q));
  }
  const sorters = {
    popular: (a,b) => (b.popular ? 1 : 0) - (a.popular ? 1 : 0) || (b.rating || 0) - (a.rating || 0),
    priceAsc: (a,b) => a.price - b.price,
    priceDesc: (a,b) => b.price - a.price,
    name: (a,b) => String(a.name).localeCompare(String(b.name), 'ar')
  };
  return rows.sort(sorters[c.sort] || sorters.popular);
}

  if (!p) return Notify.toast({ title:'غير موجود', msg:'تعذّر العثور على الصنف.', type:'err' });
  const state = { qty:1, addons:new Set(), notes:'' };
  const overlay = openSheet(
    '<div class="sheet-head">' +
      '<h3 class="grow" style="margin:0">' + esc(p.name) + '</h3>' +
      '<button class="icon-btn" type="button" data-action="sheet-close" aria-label="إغلاق">✕</button>' +
    '</div>' +
    '<div class="sheet-img">' + (p.emoji || '🍽️') + (p.image ? '<img src="' + esc(assetUrl(p.image)) + '" alt="' + esc(p.name) + '" onerror="this.remove()">' : '') + '</div>' +
    '<div class="sheet-body">' +
      '<div class="row-between"><span class="price fs-lg">' + money(p.price) + '</span><span class="stars">' + '★'.repeat(Math.round(p.rating || 4)) + ' · ' + esc(p.rating) + '</span></div>' +
      '<p class="mt-1">' + esc(p.desc || '') + '</p>' +
      '<div class="row wrap fs-sm muted mb-2"><span class="badge badge-soft">⏱ ' + num(p.prep || 10) + ' دقيقة</span><span class="badge badge-soft">' + esc(p.categoryName || '') + '</span>' + (p.avail ? '<span class="badge badge-ok">متوفر</span>' : '<span class="badge badge-danger">غير متوفر حاليًا</span>') + '</div>' +

      (p.addons && p.addons.length
        ? '<h4>الإضافات</h4><div id="sheetAddons">' + p.addons.map(a =>
            '<label class="addon" data-addon-row="' + esc(a.id) + '">' +
              '<input type="checkbox" data-action="addon-toggle" data-id="' + esc(a.id) + '" data-price="' + esc(a.price) + '" />' +
              '<span class="grow">' + esc(a.name) + '</span><span class="gold-c">+ ' + money(a.price) + '</span>' +
            '</label>').join('') + '</div>'
        : '<p class="muted fs-sm">لا توجد إضافات لهذا الصنف.</p>') +

      '<div class="field mt-2"><label for="sheetNotes">ملاحظات خاصة (اختياري)</label>' +
        '<textarea class="textarea" id="sheetNotes" maxlength="180" placeholder="مثال: بدون بصل، صوص حار منفصل…"></textarea></div>' +

      '<div class="row-between mt-2"><span class="label" style="margin:0">الكمية</span>' +
        '<div class="qty"><button type="button" data-action="sheet-qty" data-delta="-1" aria-label="تقليل">−</button><span id="sheetQty">1</span><button type="button" data-action="sheet-qty" data-delta="1" aria-label="زيادة">+</button></div>' +
      '</div>' +
    '</div>' +
    '<div class="sheet-foot">' +
      '<div class="row-between mb-1"><span class="text-2">المجموع</span><b class="fs-lg gold-c" id="sheetTotal">' + money(p.price) + '</b></div>' +
      '<button class="btn btn-primary btn-block btn-lg" type="button" data-action="sheet-add" data-id="' + esc(p.id) + '"' + (p.avail ? '' : ' disabled') + '>' +
        (p.avail ? 'إضافة إلى السلة 🛒' : 'الصنف غير متوفر') + '</button>' +
    '</div>', { label:'تفاصيل الصنف ' + p.name, autofocus:'[data-action="sheet-close"]' });

  /** إعادة حساب سعر النافذة */
  const recalc = () => {
    let unit = Number(p.price);
    $$('[data-addon-row] input:checked', overlay).forEach(i => unit += Number(i.dataset.price) || 0);
    const total = unit * state.qty;
    $('#sheetTotal', overlay).innerHTML = money(total);
    $('#sheetQty', overlay).textContent = state.qty;
    $$('[data-addon-row]', overlay).forEach(r => r.classList.toggle('is-on', !!$('input:checked', r)));
    return { unit, total };
  };
  App._sheet = { product:p, state, recalc, overlay };
  recalc();
}

/** حساب وقت التجهيز المتوقع من أطول صنف + عدد الأصناف */
function estimatePrepMinutes(){
  const items = App.cart.map(l => byId(App.catalog.products, l.productId) || { prep:10 });
  const maxPrep = Math.max.apply(null, items.map(p => Number(p.prep) || 10).concat([10]));
  const load = Math.floor(sum(App.cart, l => l.qty) / 3) * 2;
  return clamp(maxPrep + load, 5, DB.settings.prepTimeMax);
}

async function placeOrder(){
  if (App.ui.busy) return;
  // استعادة الجلسة/الطاولة من sessionStorage/localStorage إذا فُقدتا (مثلاً بعد إعادة التحميل)
  if (!App.customer){
    try { await restoreCustomerSession(); } catch (e){}
  }
  if (!App.table){
    try {
      const t = sessionStorage.getItem('srs.table');
      if (t) App.table = await Api.validateTable(t);
    } catch (e){ /* ignore */ }
  }
  if (!App.customer) return navigate('/register');
  if (!App.table) { Notify.toast({ title:'رقم الطاولة مطلوب', msg:'امسح رمز QR الموجود على الطاولة أو أدخل الرقم في صفحة التسجيل.', type:'err' }); return navigate('/register'); }
  if (!App.cart.length) return Notify.toast({ title:'السلة فارغة', msg:'أضف صنفًا واحدًا على الأقل.', type:'warn' });

  const btn = document.querySelector('[data-action="place-order"]');
  App.ui.busy = true;
  if (btn){ btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> جارٍ إرسال الطلب…'; }
  try {
    const notes = ($('#orderNotes') && $('#orderNotes').value) || '';
    const pay = (document.querySelector('input[name="pay"]:checked') || {}).value || 'cash';
    const order = await Api.createOrder({
      customerId: App.customer.id,
      tableNumber: App.table.number,
      items: App.cart.map(l => ({ productId:l.productId, qty:l.qty, addons:l.addons || [], notes:l.notes || '' })),
      notes, couponCode: App.coupon ? App.coupon.code : null,
      estimatedMinutes: estimatePrepMinutes(),
      paymentMethod: pay, source:'qr-table'
    });
    cartClear();
    Notify.toast({ title:'تم إنشاء الطلب ' + order.number, msg:'وقت التجهيز المتوقع ' + order.estimatedMinutes + ' دقيقة.', type:'ok', timeout:6000 });
    navigate('/success/' + order.id);
  } catch (e){
    Notify.toast({ title:'تعذّر إرسال الطلب', msg:e.message, type:'err', timeout:8000 });
    logError('orders', 'فشل إنشاء الطلب: ' + e.message + ' (' + e.code + ')');
    if (['PRODUCT_UNAVAILABLE','PRODUCT_NOT_FOUND'].includes(e.code)) { await loadCatalog(true); }
  } finally {
    App.ui.busy = false;
    if (btn){ btn.disabled = false; btn.innerHTML = 'تأكيد الطلب ✅'; }
  }
}

      emptyStateHtml('📍', 'لا يوجد طلب للمتابعة', 'أدخل رقم الطلب أعلاه، أو أنشئ طلبًا جديدًا من المنيو.',
        '<button class="btn btn-primary mt-2" type="button" data-action="nav" data-to="/menu">تصفح المنيو</button>');
    return;
  }

  const flowIndex = STATUS_FLOW.indexOf(order.status);
  const isActive = !['delivered','cancelled'].includes(order.status);
  v.innerHTML =
  '<div class="row-between wrap mb-2">' +
    '<div><h1 style="margin:0">طلبك <span class="ordnum">' + esc(order.number) + '</span></h1>' +
      '<p class="muted mb-0">آخر تحديث: ' + timeAgo(order.updatedAt || order.createdAt) + ' · ' + statusBadge(order.status) + '</p></div>' +
    '<div class="row wrap">' + (isActive ? '<span class="badge badge-ok"><span class="dot"></span> تحديث تلقائي كل 8 ثوانٍ</span>' : '') +
      '<button class="btn btn-ghost btn-sm" type="button" data-action="track-refresh" data-id="' + esc(order.id) + '">🔄 تحديث</button></div>' +
  '</div>' +
  '<div class="grid g-2" style="align-items:start">' +
    '<div class="card"><div class="card-head"><h3>حالة الطلب</h3>' + statusBadge(order.status) + '</div><div class="card-body">' +
      (order.status === 'cancelled' ? '<div class="alert alert-danger mb-2">تم إلغاء الطلب.' + (order.cancelReason ? ' السبب: ' + esc(order.cancelReason) : '') + '</div>' : '') +
      '<ul class="timeline">' +
        STATUS_FLOW.map((s, i) => {
          const h = (order.statusHistory || []).find(x => x.status === s);
          const cls = h ? (i === flowIndex ? 'current' : 'done') : '';
          return '<li class="' + cls + '"><span class="tl-dot">' + (h ? '✓' : '') + '</span>' +
            '<div class="tl-title">' + ORDER_STATUS[s].ic + ' ' + esc(ORDER_STATUS[s].ar) + '</div>' +
            '<div class="tl-time">' + (h ? fmtDateTime(h.at) : 'في الانتظار') + '</div></li>';
        }).join('') +
      '</ul>' +
      '<div class="status-meta mt-2">' +
        '<div class="m"><span>الطاولة</span><b>' + num(order.tableNumber) + '</b></div>' +
        '<div class="m"><span>وقت التجهيز المتوقع</span><b>' + num(order.estimatedMinutes) + ' د</b></div>' +
        '<div class="m"><span>الإجمالي</span><b>' + money(order.total) + '</b></div>' +
        '<div class="m"><span>وقت الطلب</span><b>' + fmtTime(order.createdAt) + '</b></div>' +
      '</div>' +
      (order.status === 'ready' ? '<div class="alert alert-ok mt-2">🔔 طلبك جاهز الآن! يمكنك استلامه من الكاشير أو سيُقدّم إلى طاولتك.</div>' : '') +
      (order.status === 'delivered' ? '<div class="alert alert-ok mt-2">🎉 تم تسليم الطلب — شكرًا لك!' + (order.pointsEarned ? ' أُضيفت ' + num(order.pointsEarned) + ' نقطة لرصيدك.' : '') + '</div>' : '') +
    '</div></div>' +
    '<div>' +
      '<div class="card mb-2"><div class="card-head"><h3>تفاصيل الطلب</h3></div><div class="card-body">' +
        order.items.map(i => '<div class="oi"><span>' + esc(i.emoji || '') + ' ' + esc(i.name) + ' × ' + num(i.qty) +
          (i.addons && i.addons.length ? '<span class="oi-add">+ ' + esc(i.addons.map(a => a.name).join('، ')) + '</span>' : '') +
          (i.notes ? '<span class="oi-note">📝 ' + esc(i.notes) + '</span>' : '') + '</span>' +
          '<span class="nowrap">' + money(i.lineTotal) + '</span></div>').join('') +
        '<div class="sum-total"><span>الإجمالي</span><span>' + money(order.total) + '</span></div>' +
      '</div></div>' +
      '<div class="card"><div class="card-head"><h3>سجل الحالات</h3></div><div class="card-body">' +
        '<div class="log">' + (order.statusHistory || []).slice().reverse().map(h =>
          '<div class="ln"><span class="t">' + fmtTime(h.at) + '</span><span>' + esc(ORDER_STATUS[h.status] ? ORDER_STATUS[h.status].ar : h.status) +
          ' — ' + esc(h.by === 'customer' ? 'العميل' : h.by) + (h.note ? ' — ' + esc(h.note) : '') + '</span></div>').join('') + '</div>' +
      '</div></div>' +
    '</div>' +
  '</div>';

  if (isActive){
    const orderId = order.id;
    _trackTimer = setInterval(async () => {
      if (App.route.name !== 'track' || App.route.params.rest[0] !== orderId){ stopTrackPolling(); return; }
      try {
        const fresh = await Api.getOrder(orderId);
        if ((fresh.updatedAt || 0) !== (order.updatedAt || 0)){
          const wasStatus = order.status;
          order = fresh;
          if (wasStatus !== fresh.status) Notify.toast({ title:'تحديث حالة الطلب', msg:'الحالة الآن: ' + ORDER_STATUS[fresh.status].ar, type:'info' });
          renderTrack({ rest:[orderId] });
        }
      } catch (e){ /* تجاهل أخطاء الشبكة المؤقتة */ }
    }, 8000);
  }
}

/* ==========================================================================

          '<td class="' + (t.points > 0 ? 'ok-c' : 'danger-c') + '"><b>' + (t.points > 0 ? '+' : '') + num(t.points) + '</b></td>' +

          '<td>' + esc(t.by || '—') + '</td>' +

/* ==========================================================================
   18) أحداث واجهة العميل (Event Handlers)

Object.assign(Actions, {

  'nav': (d) => navigate(d.to || '/'),

  'scroll-to': (d) => { const n = $(d.to); if (n) n.scrollIntoView({ behavior:'smooth', block:'start' }); },

  'reset-demo': () => {

    try {
      const t = await Api.validateTable(d.table);

      Notify.toast({ title:'طاولة ' + t.number + ' مُعتمدة', msg:t.area + ' · ' + t.seats + ' مقاعد', type:'ok' });

    }
  },

  /** تسجيل عميل (جديد أو عودة برقم الجوال) */
  'demo-login': async (d) => {
    const c = await Api.findCustomerByPhone(d.phone);
    if (!c) return Notify.toast({ title:'غير موجود', msg:'لم نجد عميلًا ديمو بهذا الرقم.', type:'err' });
    App.customer = c; saveCustomerSession(c.id);
    Notify.toast({ title:'مرحبًا ' + c.name, msg:'رصيدك ' + c.pointsBalance + ' نقطة.', type:'ok' });
    const next = App.route.query.next || 'menu';
    navigate('/' + next);
  },

  'menu-search': debounce((d, node) => { App.ui.menu.q = node.value; renderMenuGrid(); }, 200),
  'menu-cat': (d) => { App.ui.menu.catId = d.cat; renderMenu(); },
  'menu-sort': (d, node) => { App.ui.menu.sort = node.value; renderMenuGrid(); },
  'menu-toggle-avail': () => { App.ui.menu.onlyAvailable = !App.ui.menu.onlyAvailable; renderMenu(); },
  'menu-reset': () => { App.ui.menu = { q:'', catId:'all', onlyAvailable:false, sort:'popular' }; renderMenu(); },

  'open-product': (d) => openProductSheet(d.id),
  'sheet-close': () => closeSheet(),
  'cancel-quick': (d, node) => {
    const t = $('#canReason'); if (!t) return;
    t.value = d.reason || '';
    const row = node && node.parentElement;
    if (row) row.querySelectorAll('.chip').forEach(c => c.classList.toggle('is-active', c === node));
    t.focus();
  },
  'sheet-qty': (d) => {
    const s = App._sheet; if (!s) return;
    s.state.qty = clamp(s.state.qty + Number(d.delta || 0), 1, 50);
    s.recalc();
  },
  'addon-toggle': (d, node) => {
    const s = App._sheet; if (!s) return;
    if (node.checked) s.state.addons.add(d.id); else s.state.addons.delete(d.id);
    s.recalc();
  },
  'sheet-add': (d) => {
    const s = App._sheet; if (!s) return;
    const p = s.product;
    if (!p.avail) return Notify.toast({ title:'غير متوفر', msg:'هذا الصنف غير متوفر حاليًا.', type:'warn' });
    const addons = (p.addons || []).filter(a => s.state.addons.has(a.id));
    const notes = ($('#sheetNotes') && $('#sheetNotes').value) || '';
    closeSheet();
    cartAdd(p, s.state.qty, addons, notes);
    App._sheet = null;
  },

  'cart-qty': (d) => { cartSetQty(Number(d.index), (App.cart[Number(d.index)] || {}).qty + Number(d.delta || 0)); rerenderCartLike(); },
  'cart-remove': (d) => { cartRemove(Number(d.index)); rerenderCartLike(); },
  'cart-clear': () => { cartClear(); Notify.toast({ title:'تم تفريغ السلة', msg:'', type:'info' }); rerenderCartLike(); },
  'coupon-pick': (d, node) => {
    const cp = (App.customer.coupons || []).find(c => c.code === d.code || c.code === node.value);
    App.coupon = cp ? { code:cp.code, name:cp.name, type:cp.type, value:cp.value, productId:cp.productId || null } : null;
    rerenderCartLike();
    if (App.coupon) Notify.toast({ title:'تم تطبيق الكوبون', msg:App.coupon.name, type:'ok' });
  },
  'coupon-clear': () => { App.coupon = null; rerenderCartLike(); },

  'place-order': () => placeOrder(),

  'track-form': (d, node) => {
    const n = (node.querySelector('[name="number"]') || {}).value;
    if (!n) return;
    navigate('/track/' + encodeURIComponent(String(n).trim()));
  },
  'track-refresh': (d) => renderTrack({ rest:[d.id] }),

  'redeem-reward': async (d) => {
    try {
      const r = await Loyalty.redeem(App.customer.id, d.id);
      Notify.toast({ title:'تم استبدال المكافأة', msg:'كود الكوبون: ' + r.coupon.code + ' — استخدمه في السلة.', type:'ok', timeout:8000 });
      renderProfile();
    } catch (e){ Notify.toast({ title:'تعذّر الاستبدال', msg:e.message, type:'err' }); }
  },
  'copy-text': (d) => {
    const done = () => Notify.toast({ title:'تم النسخ', msg:d.text, type:'ok' });
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(d.text).then(done, () => Notify.toast({ title:'انسخ يدويًا', msg:d.text, type:'info' }));
    else Notify.toast({ title:'الكود', msg:d.text, type:'info' });
  },
  'logout-customer': () => {
    clearCustomerSession(); cartClear(); stopTrackPolling();
    Notify.toast({ title:'تم الخروج', msg:'يمكنك تسجيل الدخول مرة أخرى برقم الجوال.', type:'info' });
    navigate('/');
  },
  'profile-tab': (d, node) => {
    $$('.tabs button').forEach(b => b.classList.toggle('is-active', b === node));
    ['rewards','orders','points'].forEach(t => { const s = $('#profileTab-' + t); if (s) s.hidden = (t !== d.tab); });
  }
});

/** إعادة عرض الشاشة الحالية بعد تغييرات السلة */

  if (App.route.name === 'cart') renderCartPage();
  else if (App.route.name === 'checkout') renderCheckout();
  else renderCartBadge();
}

/** إرسال نموذج التسجيل + التحقق من المدخلات */
async function submitRegister(form){
  const name = form.name.value.trim();
  const phoneRaw = form.phone.value.trim();
  const tableRaw = form.table.value.trim();
  const showErr = (id, msg) => {
    const e = $(id); if (!e) return;
    e.textContent = msg; e.classList.toggle('show', !!msg);
    const input = e.parentElement.querySelector('input');
    if (input) input.setAttribute('aria-invalid', msg ? 'true' : 'false');
  };
  showErr('#errName', ''); showErr('#errPhone', ''); showErr('#errTable', '');

  let bad = false;
  if (name.length < 3){ showErr('#errName', 'اكتب اسمًا صحيحًا (3 أحرف على الأقل).'); bad = true; }
  if (!isValidPhone(phoneRaw)){ showErr('#errPhone', 'رقم جوال غير صحيح. مثال: 0500000001 أو +966500000001.'); bad = true; }
  if (bad) return;

  const btn = form.querySelector('button[type="submit"]');
  if (btn){ btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> جارٍ التحقق…'; }
  try {
    const table = await Api.validateTable(tableRaw);
    App.table = table;
    try { sessionStorage.setItem('srs.table', String(table.number)); } catch (e){}

    let customer = await Api.findCustomerByPhone(phoneRaw);
    if (customer){
      customer = await Api.saveCustomer({ id:customer.id, name });
      Notify.toast({ title:'مرحبًا بعودتك ' + customer.name, msg:'رصيدك ' + customer.pointsBalance + ' نقطة.', type:'ok' });
    } else {
      customer = await Api.saveCustomer({ name, phone:normalizePhone(phoneRaw), pointsBalance:0, totalOrders:0, totalSpent:0, tags:['عميل جديد'], coupons:[] });
      Notify.toast({ title:'تم إنشاء ملفك', msg:'مرحبًا ' + customer.name + ' — معرّف العميل: ' + customer.id, type:'ok' });
    }
    App.customer = customer;
    saveCustomerSession(customer.id);
    pushLog('info', 'auth', 'تسجيل عميل: ' + customer.name + ' — طاولة ' + table.number); saveDB();
    navigate('/' + (form.next.value || 'menu'));
  } catch (e){
    if (e.code === 'INVALID_TABLE' || e.code === 'TABLE_NOT_FOUND'){
      showErr('#errTable', e.message);
      Notify.toast({ title:'تحقق من رقم الطاولة', msg:e.message, type:'err', timeout:7000 });
    } else Notify.toast({ title:'تعذّر إكمال التسجيل', msg:e.message, type:'err' });
    logError('auth', 'فشل تسجيل العميل: ' + e.message);
  } finally {
    if (btn){ btn.disabled = false; btn.innerHTML = 'متابعة إلى المنيو 🍽️'; }
  }
}

async function renderAdminNow(params){
  if (!App.admin.user) return renderAdminLogin();
  const requested = (params.rest[0] || App.admin.tab || 'dashboard');
  const tab = ADMIN_TABS.find(t => t.id === requested);
  if (!tab || !can(tab.perm)){
    App.admin.tab = 'dashboard';
    Notify.toast({ title:'صلاحية غير كافية', msg:'لا يملك دورك صلاحية الوصول إلى «' + (tab ? tab.label : requested) + '».', type:'warn' });
  } else App.admin.tab = tab.id;

  renderAdminShell();
  const body = $('#adminBody');
  body.innerHTML = loadingStateHtml('جارٍ تحميل بيانات اللوحة…');
  App.admin.orders = await Api.orders({ limit:200 });

  const titles = {
    dashboard:['لوحة اليوم','ملخص فوري للطلبات والمبيعات والعملاء'],
    orders:['الطلبات','إدارة كاملة لحالات الطلبات والإشعارات'],
    menu:['إدارة المنيو','الأصناف والأسعار والصور والتصنيفات والتوفر'],
    customers:['العملاء','بيانات العملاء والنقاط والمكافآت'],
    loyalty:['الولاء والمكافآت','قواعد النقاط والمكافآت وسجل التدقيق'],
    reports:['التقارير','المبيعات والطلبات والأصناف الأكثر مبيعًا'],
    tables:['الطاولات وQR','روابط الطاولات وأكواد الدخول'],
    logs:['السجلات','حالات الطلبات والأخطاء'],
    settings:['الإعدادات','بيانات المطعم والهوية وقواعد الولاء'],
    api:['التكامل / API','عقد الـ API وقاعدة البيانات وما يحتاج Backend']
  };
  $('#adminTitle').textContent = titles[App.admin.tab][0];
  $('#adminSub').textContent = titles[App.admin.tab][1];

  // ملاحظة: كل تبويب يُنتظر حتى ينتهي ليحل التالي مكانه بالترتيب الصحيح
  switch (App.admin.tab){
    case 'dashboard': await renderDashboard(); break;
    case 'orders': await renderOrdersTab(); break;
    case 'menu': await renderMenuTab(); break;
    case 'customers': await renderCustomersTab(); break;
    case 'loyalty': await renderLoyaltyTab(); break;
    case 'reports': await renderReportsTab(); break;
    case 'tables': await renderTablesTab(); break;
    case 'logs': await renderLogsTab(); break;
    case 'settings': await renderSettingsTab(); break;
    case 'api': renderApiTab(); break;
  }
  startAdminRealtime();
}

}

/* ============================ Realtime + Simulation ==================== */
let _adminTimer = null, _simTimer = null, _simCount = 0;
function stopAdminRealtime(){ if (_adminTimer){ clearInterval(_adminTimer); _adminTimer = null; } if (_simTimer){ clearInterval(_simTimer); _simTimer = null; } }

function startAdminRealtime(){
  stopAdminRealtime();
  if (!App.admin.user) return;
  _adminTimer = setInterval(async () => {
    if (App.route.name !== 'admin' || !App.admin.user){ stopAdminRealtime(); return; }
    try {
      const fresh = await Api.orders({ limit:200 });
      const knownIds = new Set(App.admin.orders.map(o => o.id));
      const added = fresh.filter(o => !knownIds.has(o.id));
      App.admin.orders = fresh;
      if (added.length){
        added.forEach(o => { if (o.status === 'pending') Notify.newOrder(o); });
        if (App.admin.tab === 'dashboard') renderDashboard();
        else if (App.admin.tab === 'orders') refreshOrdersGrid();
      } else if (App.admin.tab === 'orders'){
        // تحديث هادئ للبطاقات (بدون فقدان التركيز)
        const wrap = $('#adminOrders');
        if (wrap){
          const f = App.admin.filter, q = App.admin.search.trim().toLowerCase();
          let rows = fresh.slice();
          if (f === 'active') rows = rows.filter(o => ['pending','accepted','preparing','ready'].includes(o.status));
          else if (f !== 'all') rows = rows.filter(o => o.status === f);
          if (q) rows = rows.filter(o => (o.number + ' ' + o.customerName + ' ' + o.customerPhone + ' ' + o.tableNumber).toLowerCase().includes(q));
          wrap.innerHTML = rows.length ? '<div class="orders-grid">' + rows.map(orderCardHtml).join('') + '</div>'
            : emptyStateHtml('🗂️', 'لا طلبات مطابقة', 'جرّب تغيير الفلتر أو البحث.');
        }
      }
    } catch (e){ /* تجاهل أخطاء الشبكة المؤقتة */ }
  }, CONFIG.pollMs);

  if (App.admin.simulate) startSimulation();
}
/** محاكاة طلبات واردة (لتوضيح التحديث اللحظي في وضع الديمو) */
function startSimulation(){
  if (_simTimer) return;
  _simTimer = setInterval(async () => {
    if (!App.admin.simulate || _simCount >= 25){ clearInterval(_simTimer); _simTimer = null; return; }
    await createDemoOrder();
    _simCount++;
  }, 13000);
}
async function createDemoOrder(){
  try {
    const pool = DB.products.filter(p => p.avail && !['p_water'].includes(p.id));
    const picks = [];
    const n = 1 + Math.floor(Math.random() * 3);
    for (let i = 0; i < n; i++){
      const p = pool[Math.floor(Math.random() * pool.length)];
      if (!p) continue;
      picks.push({ productId:p.id, qty:1 + Math.floor(Math.random() * 2), addons:[], notes: Math.random() < 0.3 ? 'ملاحظة تجريبية من المحاكاة' : '' });
    }
    const cust = DB.customers[Math.floor(Math.random() * DB.customers.length)];
    const table = DB.tables[Math.floor(Math.random() * DB.tables.length)];
    await Api.createOrder({ customerId:cust.id, tableNumber:table.number, items:picks, notes:'(طلب مُحاكى — Demo)', source:'simulation' });
    pushLog('info', 'simulation', 'تم إنشاء طلب محاكى للطاولة ' + table.number); saveDB();
  } catch (e){ logError('simulation', 'فشل إنشاء طلب محاكى: ' + e.message); }
}

/** تنفيذ تغيير الحالة فعليًا مع تحديث الواجهة */
async function applyStatus(orderRef, to, note, node){
  const order = orderRef.updatedAt ? orderRef : (byId(App.admin.orders, orderRef.id) || await Api.getOrder(orderRef.id));
  if (node){ node.disabled = true; node.dataset.old = node.innerHTML; node.innerHTML = '<span class="spinner"></span>'; }
  try {
    const updated = await Api.updateOrderStatus(order.id, to, { by: App.admin.user.name, note, expectedVersion: order.version || 1 });
    App.admin.orders = App.admin.orders.map(o => o.id === updated.id ? updated : o);
    Notify.toast({ title:'تم التحديث: ' + updated.number, msg:'الحالة الآن: ' + ORDER_STATUS[updated.status].ar, type:'ok' });
    if (App.admin.tab === 'dashboard') renderDashboard(); else refreshOrdersGrid();
  } catch (e){
    Notify.toast({ title:'تعذّر التحديث', msg:e.message, type:'err', timeout:7000 });
    logError('orders', 'فشل تحديث الحالة: ' + e.message + ' (' + e.code + ')');
    if (e.code === 'CONFLICT' || e.code === 'INVALID_TRANSITION'){
      App.admin.orders = await Api.orders({ limit:200 });
      if (App.admin.tab === 'dashboard') renderDashboard(); else refreshOrdersGrid();
    }
  } finally {
    if (node && node.isConnected){ node.disabled = false; node.innerHTML = node.dataset.old || 'تم'; }
  }
}

/** تحويل نص الإضافات (اسم:سعر) إلى مصفوفة */
function parseAddons(text){
  return String(text || '').split('\n').map(l => l.trim()).filter(Boolean).map(line => {
    const idx = line.lastIndexOf(':');
    const name = (idx > -1 ? line.slice(0, idx) : line).trim();
    const price = idx > -1 ? Number(line.slice(idx + 1).trim()) || 0 : 0;
    return { id:'ad_' + hashCode(name).toString(36), name, price };
  }).filter(a => a.name);
}

document.addEventListener('click', (e) => {
  const node = e.target.closest('[data-action]');
  if (!node) return;
  const tag = node.tagName;
  if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') return;  // تُعالج عبر change/input
  const fn = Actions[node.dataset.action];
  if (!fn) return;
  e.preventDefault();
  fn(node.dataset, node, e);
});
document.addEventListener('change', (e) => {
  const node = e.target.closest('[data-action]');
  if (!node) return;
  const tag = node.tagName;
  if (tag !== 'INPUT' && tag !== 'SELECT' && tag !== 'TEXTAREA') return;
  const fn = Actions[node.dataset.action];
  if (fn) fn(node.dataset, node, e);
});
document.addEventListener('input', (e) => {
  const node = e.target.closest('[data-action]');
  if (!node || node.tagName !== 'INPUT') return;
  const fn = Actions[node.dataset.action];
  if (fn && ['menu-search','admin-search'].includes(node.dataset.action)) fn(node.dataset, node, e);
});
document.addEventListener('submit', (e) => {
  const form = e.target.closest('form[data-action]');
  if (!form) return;
  e.preventDefault();
  const action = form.dataset.action;
  const map = {
    'register-form': () => submitRegister(form),
    'admin-login': () => doAdminLogin(form),
    'admin-user-save': () => saveAdminUserForm(form),
    'admin-password-save': () => saveOwnPassword(form),
    'product-save': () => saveProductForm(form),
    'category-save': () => saveCategoryForm(form),
    'reward-save': () => saveRewardForm(form),
    'eta-save': () => saveEta(form),
    'points-save': () => savePoints(form),
    'cancel-save': () => saveCancel(form),
    'loyalty-rules': () => saveLoyaltyRules(form),
    'loyalty-customer-search': () => Actions['loyalty-customer-search']({}, form),
    'settings-save': () => saveSettingsForm(form),
    'api-config': () => Actions['api-config'](form.dataset, form),
    'track-form': () => Actions['track-form'](form.dataset, form)
  };
  const fn = map[action];
  if (fn) fn();
});
/** مزامنة بين تبويبات نفس المتصفح (لا تعوّض Backend حقيقي) */
window.addEventListener('storage', (e) => {
  if (e.key !== LS_DB_KEY || !e.newValue) return;
  try {
    const parsed = JSON.parse(e.newValue);
    if (parsed && parsed.version === DB_VERSION) DB = parsed;
  } catch (err){ return; }
  if (App.route.name === 'track' && App.route.params.rest[0]) renderTrack(App.route.params);
  else if (App.route.name === 'admin' && App.admin.user && App.admin.tab !== 'orders') { /* التحديث اللحظي يتكفل به Polling */ }
  renderCartBadge();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape'){ const o = $('#modalRoot .overlay'); if (o) closeSheet(); }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k'){
    e.preventDefault();
    const f = $('#menuSearch') || $('#admSearch');
    if (f) f.focus();
  }
});

/* ==========================================================================
   22) الإقلاع (Init)
   ========================================================================== */
App.retryCatalog = async () => {
  App.ui.catalogError = null;
  try { await loadCatalog(true); } catch (e){ /* يُعرض الخطأ */ }
  handleRoute();
};

async function init(){
  // 1) تحميل البيانات + الهوية البصرية
  DB = loadDB();
  if (useBackend()) { try { await syncFromBackend(); } catch (e){ /* الواجهة تعمل حتى لو تعذّر الاتصال */ } }
  applyAccent((DB.settings && DB.settings.accent) || 'gold');
  cartLoad();

  // 2) استرجاع رقم الطاولة (من QR سابق في نفس الجلسة)
  try {
    const t = sessionStorage.getItem('srs.table');
    if (t) App.table = await Api.validateTable(t);
  } catch (e){ /* تجاهل */ }

  // 3) استرجاع جلسات العميل والإدارة
  await restoreCustomerSession();
  await restoreAdminSession();

  // 4) أزرار الشريط العلوي
  const bc = $('#btnCart');
  if (bc) bc.addEventListener('click', () => navigate(App.customer ? '/cart' : '/register'));
  const rd = $('#btnResetDemo');
  if (rd) rd.addEventListener('click', () => Actions['reset-demo']());

  // 5) تحميل المنيو مسبقًا (لتظهر أرقام الترحيب)
  loadCatalog().catch(() => {});

  // 6) التوجيه
  window.addEventListener('hashchange', handleRoute);
  if (!location.hash) location.hash = '#/';
  await handleRoute();

  // 7) رسالة ترحيب أولى + تنبيه وضع الديمو
  Notify.toast({ title:'مرحبًا بك في ' + DB.settings.restaurantName, msg:'وضع الديمو: البيانات محلية في هذا المتصفح. جرّب الطلب ثم افتح اللوحة #/admin لتغيير الحالة.', type:'info', timeout:8000 });
  pushLog('info', 'system', 'تشغيل النظام — الوضع: ' + adapterName());
  saveDB();
}

init().catch((e) => {
  document.getElementById('view').innerHTML =
    '<div class="empty"><div class="ic">⚠️</div><h3>خطأ في تشغيل التطبيق</h3><p class="danger-c">' + (e && e.message) + '</p>' +
    '<button class="btn btn-primary" type="button" onclick="location.reload()">إعادة التحميل</button></div>';
});
</script>
