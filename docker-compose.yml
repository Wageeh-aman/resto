# ============================================================================
#  نظام المطعم الذكي — تشغيل بنقرة واحدة عبر Docker
#   الاستخدام:  docker compose up -d --build
#   ثم افتح:    http://localhost:8787
# ============================================================================

services:
  restaurant:
    build: .
    image: smart-restaurant:2.0.0
    container_name: smart-restaurant
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      NODE_ENV: production
      PORT: "8787"
      HOST: "0.0.0.0"
      DATA_DIR: /app/server/data
      UPLOAD_DIR: /app/server/data/uploads
      # النشر الإنتاجي: أوقف بيانات الديمو وحدّد حساب المالك من أول تشغيل
      SEED_DEMO: "0"
      ADMIN_USERNAME: owner
      ADMIN_PASSWORD: change-me-now
      # عند التشغيل خلف HTTPS (Nginx/Cloudflare) فعّل ما يلي:
      # TRUST_PROXY: "1"
      # COOKIE_SECURE: "1"
      # ALLOWED_ORIGINS: https://restaurant.example.com
    volumes:
      - restaurant-data:/app/server/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  restaurant-data:
