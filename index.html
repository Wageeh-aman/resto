          '<div class="row between wrap-x"><b>' + esc(m.template) + ' — <span class="mono num">' + esc(m.orderNumber) + '</span></b>' + waStatusBadge(m) + '</div>' +
          '<div class="wmeta"><span>إلى: <span class="num">' + esc(m.to) + '</span></span>' +
            '<span>محاولات: <span class="num">' + m.attempts + '</span>/' + WhatsApp.MAX_ATTEMPTS + '</span>' +
            '<span>' + arDate(m.createdAt) + '</span>' +
            '<span>idempotency: <span class="mono">' + esc(m.idempotencyKey) + '</span></span>' +
            (m.providerMessageId ? '<span>id: <span class="mono">' + esc(m.providerMessageId) + '</span></span>' : '') +
            '<span>موافقة العميل: ' + (m.consent ? 'نعم' : 'لا') + '</span>' +
          '</div>' +
          '<pre>' + esc(m.body) + '</pre>' +
          (m.lastError ? '<div class="tiny red mt">خطأ: ' + esc(m.lastError) + '</div>' : '') +
          (m.status !== 'sent' ? '<button class="btn sm ghost mt" data-action="ad-wa-retry" data-payload="' + m.id + '">↻ إعادة المحاولة</button>' : '') +
        '</div></div>').join('')
      : stateBox('empty', { icon:'💬', title:'لا توجد رسائل بعد', text:'ستظهر الرسائل هنا بعد إنشاء طلب من واجهة العميل.' })) +
    '</div>' +

    '<div class="panel">' +
      '<div class="row between wrap-x"><h3>🗂️ سجل النظام والأخطاء <span class="badge ' + (errs ? 'red' : '') + '"><span class="num">' + errs + '</span> خطأ</span></h3>' +
        '<div class="seg" role="group" aria-label="تصفية السجل">' +
          ['all','info','warn','error'].map(l => '<button type="button" data-action="ad-log-filter" data-payload="' + l + '" aria-pressed="' + (level === l ? 'true':'false') + '">' +
            ({ all:'الكل', info:'معلومة', warn:'تحذير', error:'خطأ' })[l] + '</button>').join('') +
        '</div>' +
      '</div>' +
      (logs.length ? logs.slice(0, 120).map(l =>
        '<div class="logrow ' + l.level + '">' +
          '<span aria-hidden="true">' + ({ info:'ℹ️', warn:'⚠️', error:'⛔' }[l.level] || '•') + '</span>' +
          '<div><div>' + esc(l.message) + '</div>' +
            '<div class="tiny muted">النطاق: <span class="mono">' + esc(l.scope) + '</span>' +
              (l.meta && Object.keys(l.meta).length ? ' • ' + esc(JSON.stringify(l.meta)) : '') + '</div></div>' +
          '<span class="lt">' + arTime(l.at) + '</span>' +
        '</div>').join('')
      : stateBox('empty', { icon:'🗂️', title:'لا توجد سجلات' })) +
    '</div>';
}

/* ------------------------ 8.12 معالج إجراءات الإدارة -------------------- */
async function handleAdminAction(action, payload, el){
  const order = payload ? Store.data.orders.find(o => o.id === payload) : null;
  switch(action){
    case 'admin-toggle-side': {
      S.admin.sideOpen = !S.admin.sideOpen;
      $('#adminApp').classList.toggle('side-open', S.admin.sideOpen);
      $$('.adm-scrim').forEach(s => s.remove());
      if(S.admin.sideOpen){
        const sc = document.createElement('div');
        sc.className = 'adm-scrim';
        sc.addEventListener('click', () => { $('#adminApp').classList.remove('side-open'); sc.remove(); });
        $('#adminApp').appendChild(sc);
      }
      break;
    }
    case 'ad-nav-orders': adminGo('orders'); break;
    case 'ad-filter':     S.admin.orderFilter = payload; await renderAdminSection(); break;
    case 'ad-refresh':    await renderAdminSection(); toast('تم التحديث','info',{icon:'↻'}); break;
    case 'ad-log-filter': S.admin.logFilter = payload; await renderAdminSection(); break;

    case 'ad-status': {
      if(!can('orders.' + ({ accepted:'accept', preparing:'prepare', ready:'ready', delivered:'deliver' }[payload] || 'view'))){ toast('لا تملك صلاحية هذه العملية','err'); return; }
      try{
        el.disabled = true;
        const extra = { expectedStatus:order.status };
        if(payload === 'accepted'){
          const etaVal = $('#eta-' + order.id);
          if(etaVal && Number(etaVal.value)) extra.etaMinutes = Number(etaVal.value);
        }
        const updated = await Api.orders.updateStatus(order.id, payload, extra);
        toast('تم تحديث الطلب ' + updated.number + ' → ' + STATUS[payload].ar, 'ok');
        if(payload === 'delivered') Notify.beep([1318, 1760]);
        await renderAdminSection();
        if($('.modal')) openOrderDetail(order.id);
      }catch(err){ toast(err.message, 'err'); el.disabled = false; }
      break;
    }
    case 'ad-cancel': {
      if(!can('orders.cancel')){ toast('لا تملك صلاحية الإلغاء','err'); return; }
      const reasons = ['طلب العميل الإلغاء','صنف غير متوفر','ازدحام في المطبخ','خطأ في الطلب','أخرى'];
      openModal({
        title:'إلغاء الطلب ' + order.number, icon:'⛔',
        body: '<div class="field"><label for="cxReason">سبب الإلغاء</label>' +
          '<select class="input" id="cxReason">' + reasons.map(r => '<option>' + r + '</option>').join('') + '</select></div>' +
          '<div class="field"><label for="cxNote">ملاحظة إضافية (اختياري)</label><input class="input" id="cxNote"></div>' +
          '<div class="tiny muted">سيُسجَّل الإلغاء في سجل حالات الطلب وتُبلّغ الواجهة العميل.</div>',
        actions: [
          { label:'تأكيد الإلغاء', cls:'red', onClick: async (ov, btn) => {
              btn.disabled = true;
              try{
                await Api.orders.updateStatus(order.id, 'cancelled', {
                  reason: $('#cxReason').value + ($('#cxNote').value ? ' — ' + $('#cxNote').value : ''),
                  expectedStatus:'pending' === order.status ? 'pending' : order.status
                });
                closeModal(); toast('تم إلغاء الطلب','warn',{icon:'⛔'});
                renderAdminSection();
              }catch(err){ toast(err.message,'err'); btn.disabled = false; }
            } },
          { label:'تراجع', cls:'ghost', onClick: closeModal }
        ]
      });
      break;
    }
    case 'ad-eta': {
      const input = $('#eta-' + payload);
      try{
        await Api.orders.setEta(payload, input.value);
        toast('تم تحديث وقت التجهيز إلى ' + input.value + ' دقيقة','ok');
      }catch(err){ toast(err.message,'err'); }
      break;
    }
    case 'ad-order-detail': await openOrderDetail(payload); break;

    /* المنيو */
    case 'ad-prod-new':  await productForm(null); break;
    case 'ad-prod-edit': await productForm(payload); break;
    case 'ad-prod-toggle': {
      try{ const now = await Api.products.toggle(payload); toast('تم ' + (now ? 'تفعيل' : 'إيقاف') + ' الصنف','ok'); renderAdminSection(); }
      catch(err){ toast(err.message,'err'); }
      break;
    }
    case 'ad-prod-del': {
      const p = Store.data.products.find(x => x.id === payload);
      const ok = await confirmDialog({ title:'حذف صنف', message:'حذف «' + (p ? p.name : '') + '» من المنيو؟', detail:'الحذف في النسخة التجريبية نهائي على هذا الجهاز.', danger:true, confirmLabel:'حذف' });
      if(!ok) return;
      try{ await Api.products.remove(payload); toast('تم حذف الصنف','ok'); renderAdminSection(); }
      catch(err){ toast(err.message,'err'); }
      break;
    }
    case 'ad-cat-new':  await categoryForm(null); break;
    case 'ad-cat-edit': await categoryForm(payload); break;
    case 'ad-cat-del': {
      const ok = await confirmDialog({ title:'حذف قسم', message:'تأكيد حذف القسم؟', danger:true, confirmLabel:'حذف' });
      if(!ok) return;
      try{ await Api.categories.remove(payload); toast('تم حذف القسم','ok'); renderAdminSection(); }
      catch(err){ toast(err.message,'err'); }
      break;
    }

    /* العملاء */
    case 'ad-cust-points': await adjustPointsModal(payload); break;
    case 'ad-cust-orders': await customerOrdersModal(payload); break;
    case 'ad-cust-consent': {
      const c = Store.data.customers.find(x => x.id === payload);
      try{ await Api.customers.update(payload, { whatsappConsent: !c.whatsappConsent }); toast('تم تحديث موافقة العميل','ok'); renderAdminSection(); }
      catch(err){ toast(err.message,'err'); }
      break;
    }

    /* الولاء */
    case 'ad-reward-new':  await rewardForm(null); break;
    case 'ad-reward-edit': await rewardForm(payload); break;
    case 'ad-reward-del': {
      const ok = await confirmDialog({ title:'حذف مكافأة', message:'تأكيد حذف المكافأة؟', danger:true, confirmLabel:'حذف' });
      if(!ok) return;
      try{ await Api.loyalty.removeReward(payload); toast('تم حذف المكافأة','ok'); renderAdminSection(); }
      catch(err){ toast(err.message,'err'); }
      break;
    }

    /* WhatsApp */
    case 'ad-wa-retry': {
      if(!can('whatsapp.retry')){ toast('لا تملك صلاحية إعادة الإرسال','err'); return; }
      try{ await Api.whatsapp.retry(payload); toast('أُعيدت الرسالة إلى الطابور','ok',{icon:'↻'}); setTimeout(() => { if(S.admin.user) renderAdminSection(); }, 1600); }
      catch(err){ toast(err.message,'err'); }
      break;
    }
    case 'ad-wa-retry-all': {
      if(!can('whatsapp.retry')){ toast('لا تملك صلاحية إعادة الإرسال','err'); return; }
      const n = await WhatsApp.retryAllFailed();
      toast(n ? 'أُعيد إرسال ' + n + ' رسالة' : 'لا توجد رسائل فاشلة','ok',{icon:'↻'});
      setTimeout(() => { if(S.admin.user) renderAdminSection(); }, 1600);
      break;
    }

    /* التجربة */
    case 'ad-sim-order': {
      const ids = Store.data.products.filter(p => p.available);
      const items = [];
      for(let i = 0; i < 3; i++){
        const p = pick(ids);
        items.push({ productId:p.id, qty:rand(1,3), addonIds:(p.addons||[]).slice(0, rand(0,2)).map(a=>a.id), note:'' });
      }
      const cust = pick(Store.data.customers);
      const tbl = pick(Store.data.tables.filter(t => !t.takeaway));
      try{
        const o = await Api.orders.create({ customerId:cust.id, tableId:tbl.id, items, notes:'طلب تجريبي للمحاكاة', payment:S.settings.payments[0] });
        WhatsApp.enqueue('order_confirmation', o).catch(()=>{});
        /* مسار الطلب لنفس التاب (التحديث الفوري يعمل تلقائيًا عبر EventBus) */
        await renderAdminSection();
      }catch(err){ toast(err.message,'err'); }
      break;
    }
    case 'ad-sim-ready': {
      const o = Store.data.orders.find(x => ['accepted','preparing'].indexOf(x.status) > -1);
      if(!o){ toast('لا يوجد طلب في مرحلة القبول/التحضير لمحاكاته','warn'); return; }
      try{
        if(o.status === 'accepted') await Api.orders.updateStatus(o.id, 'preparing', { expectedStatus:'accepted' });
        await Api.orders.updateStatus(o.id, 'ready', { expectedStatus:'preparing' });
        toast('تم تحويل الطلب ' + o.number + ' إلى «جاهز» وإرسال إشعار الجاهزية','ok');
        renderAdminSection();
      }catch(err){ toast(err.message,'err'); }
      break;
    }
    case 'ad-test-notif': {
      Notify.soundOn = true;
      Notify.beep([880, 1174, 1568]);
      toast('طلب جديد! هذه نغمة التنبيه التجريبية','ok',{ icon:'🔔', detail:'يُشغّل النظام نفس التنبيه تلقائيًا عند وصول طلب جديد.' });
      Notify.desktop('طلب جديد (اختبار)', 'تنبيه تجريبي من نظام دار الشرق');
      break;
    }
    case 'ad-reset-demo': {
      const ok = await confirmDialog({ title:'إعادة تعيين البيانات', message:'سيتم حذف كل الطلبات والعملاء والنقاط والعودة للبيانات التجريبية الأصلية.', danger:true, confirmLabel:'نعم، أعد التعيين' });
      if(!ok) return;
      await Api.demo.reset();
      S.customer = null; S.cart = []; S.table = null;
      Api.session.clear();
      const cur = S.admin.user;
      Store.load();
      S.settings = Store.data.settings;
      S.admin.user = cur ? Store.data.adminUsers.find(u => u.username === cur.username) || null : null;
      applySettingsToChrome();
      toast('تمت إعادة التعيين للبيانات التجريبية','ok');
      renderAdmin();
      break;
    }
    case 'ad-clear-session': {
      const ok = await confirmDialog({ title:'مسح الجلسة', message:'سيتم تسجيل خروجك من الواجهتين وحذف السلة.', danger:true, confirmLabel:'مسح' });
      if(!ok) return;
      Api.session.clear(); S.customer = null; S.cart = []; S.admin.user = null; S.table = null;
      toast('تم مسح الجلسة','ok');
      navigate('/');
      break;
    }

    /* التقارير */
    case 'ad-export-orders':  exportCsv('orders'); break;
    case 'ad-export-items':   exportCsv('items'); break;
    case 'ad-print':          window.print(); break;
    default: break;
  }
}
function exportCsv(kind){
  let rows = [], name = '';
  if(kind === 'orders'){
    name = 'orders-demo.csv';
    rows.push(['order_number','created_at','status','customer','phone','table','items_count','subtotal','vat','total','eta_minutes','loyalty_awarded','rating']);
    Store.data.orders.forEach(o => rows.push([
      o.number, o.createdAt, o.status, o.customerName, o.customerPhone, o.tableNo || 'takeaway',
      o.items.reduce((s,i)=>s+i.qty,0), o.subtotal, o.vat, o.total, o.etaMinutes, o.loyaltyAwarded ? 1 : 0, o.rating || ''
    ]));
  }else{
    name = 'products-demo.csv';
    rows.push(['id','name','name_en','category','price','available','prep_minutes','rating']);
    Store.data.products.forEach(p => {
      const c = Store.data.categories.find(x => x.id === p.categoryId) || {};
      rows.push([p.id, p.name, p.nameEn, c.name || '', p.price, p.available ? 1 : 0, p.prepTime, p.rating]);
    });
  }
  const csv = '\uFEFF' + rows.map(r => r.map(v => '"' + String(v == null ? '' : v).replace(/"/g,'""') + '"').join(',')).join('\r\n');
  const blob = new Blob([csv], { type:'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  toast('تم تصدير الملف: ' + name, 'ok', { icon:'⬇️' });
}

/** تنبيه الطلبات الجديدة (يستدعى عند وصول طلب لعرضه على الكاشير) */
function notifyNewOrder(order){
  if(!S.admin.user) return;
  Notify.beep([880, 1174, 1568]);
  Notify.desktop('طلب جديد ' + order.number, order.customerName + ' — طاولة ' + (order.tableNo || 'سفري') + ' — ' + money(order.total));
  toast('طلب جديد! ' + order.number + ' — ' + order.customerName, 'ok', { icon:'🔔', detail:'طاولة ' + (order.tableNo || 'سفري') + ' • ' + money(order.total), timeout:8000 });
  const badge = $('[data-nav-badge]');
  const n = Store.data.orders.filter(o => o.status === 'pending').length;
  if(badge) badge.textContent = n;
  else renderAdmin();
  if(['orders','dashboard'].indexOf(S.admin.section) > -1) renderAdminSection();
}
function subscribeRealtime(){
  EventBus.on('order:new', async order => { notifyNewOrder(order); });
  EventBus.on('order:updated', async () => {
    const cur = parseRoute().parts[0];
    if(!S.admin.user && cur === 'track'){ await renderRoute(); }
  });
  EventBus.on('remote:change', async () => {
    /* تغيّر قادم من تاب/جهاز آخر عبر BroadcastChannel */
    if(S.admin.user) await renderAdminSection();
    else if(parseRoute().path === '/track') await renderTrackSoft();
  });
  EventBus.on('loyalty:awarded', p => {
    if(S.customer && S.customer.id === p.customerId){
      S.customer.points = p.balance;
      toast('🎁 أُضيفت ' + p.points + ' نقطة لرصيدك — الرصيد الآن ' + p.balance, 'ok', { timeout:6000 });
    }
  });
  window.addEventListener('online',  () => toast('عاد الاتصال بالإنترنت ✅','ok'));
  window.addEventListener('offline', () => toast('انقطع الاتصال — ستعمل الواجهة من الذاكرة المحلية','warn',{ icon:'📴' }));
  /* إعادة المحاولة الدورية للرسائل الفاشلة/المعلّقة */
  setInterval(() => { WhatsApp.process(); }, 15000);
}
async function renderTrackSoft(){
  try{ if(parseRoute().parts[0] === 'track' && S.customer) await renderRoute(); }catch(e){}
}
async function boot(){
  /* 1) تحميل البيانات */
  Store.load();
  S.settings = Store.data.settings;
  document.documentElement.setAttribute('data-theme', S.settings.theme || 'dark');
  Notify.soundOn = true;
  Bus.init();
  restoreSession();
  /* 2) دمج بيانات الطلبات التجريبية القديمة بحقول ناقصة */
  Store.data.orders.forEach(o => {
    if(typeof o.loyaltyAwarded !== 'boolean') o.loyaltyAwarded = false;
    if(typeof o.etaMinutes !== 'number') o.etaMinutes = S.settings.defaultPrepTime;
    if(!o.payment) o.payment = (S.settings.payments || [])[0] || 'كاش عند التسليم';
    recalcOrder(o, S.settings);
  });
  /* 3) التحقق من رقم الطاولة القادم من QR */
  await initTableFromQR();
  /* 4) ربط الإجراءات والأحداث */
  bindGlobalActions();
  bindCustomerExtras();
  document.addEventListener('click', e => {
    const el = e.target.closest('[data-action]');
    if(!el) return;
    const a = el.dataset.action;
    if(a.indexOf('ad-') !== 0 && a.indexOf('admin-') !== 0) return;
    e.preventDefault();
    handleAdminAction(a, el.dataset.payload, el);
  });
  document.addEventListener('click', e => {
    const el = e.target.closest('[data-action="copy-order"]');
    if(!el) return;
    const txt = el.dataset.payload;
    const done = () => toast('تم نسخ رقم الطلب: ' + txt, 'ok', { icon:'📋' });
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(done).catch(() => fallbackCopy(txt, done));
    }else fallbackCopy(txt, done);
  });
  subscribeRealtime();
  /* 5) أول رندر */
  applySettingsToChrome();
  await renderRoute();
  /* 6) تنبيه للميزات التي تحتاج Backend */
  console.info('%c[دار الشرق] نسخة تجريبية (Demo) — البيانات محلية. راجع تبويب "التوثيق و API" لمعرفة ما يحتاج Backend.', 'color:#d4af37;font-weight:bold');
  setTimeout(() => {
    if(!S.admin.user) toast('نسخة تجريبية: البيانات محلية على هذا الجهاز — الدخول الإداري عبر #/admin (owner / 1111)', 'info', { icon:'🧪', timeout:5200 });
  }, 900);
}
function fallbackCopy(txt, done){
  try{
    const ta = document.createElement('textarea');
    ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); done();
  }catch(e){ toast('تعذّر النسخ تلقائيًا — انسخ الرقم يدويًا','warn'); }
}

/* تشغيل التطبيق */
if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();
</script>
