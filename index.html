<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0e10">
<meta name="description" content="نظام مطعم ذكي — طلب من الطاولة عبر QR، سلة، تتبع الطلب، نقاط ولاء، ولوحة كاشير وإدارة.">
<title>دار الشرق | نظام طلب ذكي للمطاعم</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230e0e10'/%3E%3Ctext x='32' y='44' font-size='34' text-anchor='middle'%3E%F0%9F%8D%BD%EF%B8%8F%3C/text%3E%3C/svg%3E">
<style>
/* =========================================================================
   دار الشرق — Smart Restaurant Ordering System
   واجهة من ملف واحد (HTML + CSS + Vanilla JS). بدون أي مكتبات خارجية أو CDN.
   جاهزة للربط بـ Backend حقيقي عبر طبقة Api (انظر قسم API CONTRACT).
   ========================================================================= */

/* ------------------------- 1) DESIGN TOKENS ---------------------------- */
:root{
  /* الهوية البصرية: أسود فحمي + كريمي + ذهبي — قابلة للتغيير من هنا فقط */
  --c-bg:#0e0e10;
  --c-bg-2:#121216;
  --c-surface:#17171b;
  --c-surface-2:#1e1e24;
  --c-surface-3:#26262e;
  --c-line:#2e2e38;
  --c-line-2:#3a3a46;
  --c-text:#f4efe6;
  --c-cream:#f6efe3;
  --c-muted:#a49c90;
  --c-gold:#d4af37;
  --c-gold-2:#efd68a;
  --c-gold-dark:#8d6f1c;

  --c-green:#37d67a;
  --c-amber:#ffb020;
  --c-red:#ff6b6b;
  --c-blue:#5aa9ff;
  --c-violet:#b98cff;

  --st-pending:#5aa9ff;
  --st-accepted:#b98cff;
  --st-preparing:#ffb020;
  --st-ready:#37d67a;
  --st-delivered:#8f8f9c;
  --st-cancelled:#ff6b6b;

  --radius-xl:22px;
  --radius-lg:16px;
  --radius:14px;
  --radius-sm:10px;
  --radius-pill:999px;

  --shadow-1:0 1px 2px rgba(0,0,0,.45), 0 8px 22px rgba(0,0,0,.32);
  --shadow-2:0 2px 6px rgba(0,0,0,.5), 0 18px 44px rgba(0,0,0,.45);
  --shadow-gold:0 10px 30px rgba(212,175,55,.16);

  --font:system-ui,-apple-system,"Segoe UI","Noto Sans Arabic","Cairo",Tahoma,Arial,sans-serif;
  --font-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;

  --header-h:64px;
  --tabbar-h:62px;
  --maxw:1180px;
  --gap:16px;
  --tr:.22s cubic-bezier(.4,0,.2,1);
}

/* الثيم الفاتح (اختياري من الإعدادات) */
:root[data-theme="light"]{
  --c-bg:#f7f4ee;
  --c-bg-2:#efe9df;
  --c-surface:#ffffff;
  --c-surface-2:#f6f1e8;
  --c-surface-3:#ece4d6;
  --c-line:#e2d9c8;
  --c-line-2:#d2c6ae;
  --c-text:#221e18;
  --c-cream:#ffffff;
  --c-muted:#6d6455;
  --c-gold:#9a7415;
  --c-gold-2:#c19a2b;
  --shadow-1:0 1px 2px rgba(60,45,15,.08), 0 8px 22px rgba(60,45,15,.10);
  --shadow-2:0 2px 6px rgba(60,45,15,.10), 0 18px 40px rgba(60,45,15,.16);
}

/* --------------------------- 2) RESET / BASE --------------------------- */
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none !important}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  margin:0;
  min-height:100dvh;
  font-family:var(--font);
  font-size:16px;
  line-height:1.65;
  background:var(--c-bg);
  color:var(--c-text);
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
body.no-scroll{overflow:hidden}
h1,h2,h3,h4{margin:0 0 .4em;line-height:1.3;font-weight:800;letter-spacing:-.01em}
h1{font-size:clamp(1.6rem,4.6vw,2.4rem)}
h2{font-size:clamp(1.2rem,3.2vw,1.6rem)}
h3{font-size:1.05rem}
p{margin:0 0 .8em}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0}
ul,ol{margin:0;padding:0;list-style:none}
table{border-collapse:collapse;width:100%}
hr{border:0;border-top:1px solid var(--c-line);margin:16px 0}
:focus-visible{outline:2px solid var(--c-gold);outline-offset:2px;border-radius:8px}
::selection{background:var(--c-gold);color:#151208}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--c-line-2);border-radius:99px;border:2px solid var(--c-bg)}
::-webkit-scrollbar-thumb:hover{background:var(--c-gold-dark)}

/* الأرقام والأسعار والمصطلحات اللاتينية لا تُفسد اتجاه النص العربي */
.num,.ltr{
  direction:ltr;
  unicode-bidi:isolate;
  display:inline-block;
  font-variant-numeric:tabular-nums;
  font-feature-settings:"tnum";
}
.mono{font-family:var(--font-mono);font-size:.86em}
.en{font-size:.85em;color:var(--c-muted);font-weight:500}

.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.skip{position:fixed;inset-inline-start:12px;top:-60px;z-index:999;background:var(--c-gold);color:#151208;padding:10px 16px;border-radius:0 0 12px 12px;font-weight:700;transition:top var(--tr)}
.skip:focus{top:0}

/* --------------------------- 3) UTILITIES ------------------------------ */
.wrap{width:100%;max-width:var(--maxw);margin-inline:auto;padding-inline:16px}
.row{display:flex;align-items:center;gap:10px}
.row.between{justify-content:space-between}
.row.wrap-x{flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:10px}
.grow{flex:1 1 auto;min-width:0}
.center{display:flex;align-items:center;justify-content:center}
.muted{color:var(--c-muted)}
.tiny{font-size:.78rem}
.sm{font-size:.88rem}
.bold{font-weight:800}
.gold{color:var(--c-gold)}
.green{color:var(--c-green)}
.red{color:var(--c-red)}
.amber{color:var(--c-amber)}
.truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mt{margin-top:14px}.mt-2{margin-top:26px}.mb{margin-bottom:14px}
.hide-sm{display:initial}
.only-sm{display:none}
.divider{height:1px;background:var(--c-line);margin:14px 0}

.glass{
  background:linear-gradient(180deg,color-mix(in srgb,var(--c-surface) 92%,transparent),var(--c-surface));
  border:1px solid var(--c-line);
  border-radius:var(--radius-lg);
  box-shadow:var(--shadow-1);
}
.card{background:var(--c-surface);border:1px solid var(--c-line);border-radius:var(--radius-lg);box-shadow:var(--shadow-1)}
.card.pad{padding:16px}
.card.hover{transition:transform var(--tr),box-shadow var(--tr),border-color var(--tr)}
.card.hover:hover{transform:translateY(-3px);box-shadow:var(--shadow-2);border-color:var(--c-line-2)}

.badge{
  display:inline-flex;align-items:center;gap:5px;
  padding:3px 10px;border-radius:var(--radius-pill);
  font-size:.74rem;font-weight:800;line-height:1.7;
  background:var(--c-surface-3);color:var(--c-muted);border:1px solid var(--c-line);
  white-space:nowrap;
}
.badge.gold{background:color-mix(in srgb,var(--c-gold) 18%,transparent);color:var(--c-gold-2);border-color:color-mix(in srgb,var(--c-gold) 40%,transparent)}
.badge.green{background:color-mix(in srgb,var(--c-green) 16%,transparent);color:var(--c-green);border-color:color-mix(in srgb,var(--c-green) 38%,transparent)}
.badge.red{background:color-mix(in srgb,var(--c-red) 16%,transparent);color:var(--c-red);border-color:color-mix(in srgb,var(--c-red) 38%,transparent)}
.badge.amber{background:color-mix(in srgb,var(--c-amber) 16%,transparent);color:var(--c-amber);border-color:color-mix(in srgb,var(--c-amber) 38%,transparent)}
.badge.blue{background:color-mix(in srgb,var(--c-blue) 16%,transparent);color:var(--c-blue);border-color:color-mix(in srgb,var(--c-blue) 38%,transparent)}

.st{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:var(--radius-pill);font-size:.78rem;font-weight:800;border:1px solid}
.st i{width:8px;height:8px;border-radius:50%;background:currentColor;flex:none}
.st[data-s="pending"]{color:var(--st-pending);border-color:color-mix(in srgb,var(--st-pending) 45%,transparent);background:color-mix(in srgb,var(--st-pending) 14%,transparent)}
.st[data-s="accepted"]{color:var(--st-accepted);border-color:color-mix(in srgb,var(--st-accepted) 45%,transparent);background:color-mix(in srgb,var(--st-accepted) 14%,transparent)}
.st[data-s="preparing"]{color:var(--st-preparing);border-color:color-mix(in srgb,var(--st-preparing) 45%,transparent);background:color-mix(in srgb,var(--st-preparing) 14%,transparent)}
.st[data-s="ready"]{color:var(--st-ready);border-color:color-mix(in srgb,var(--st-ready) 45%,transparent);background:color-mix(in srgb,var(--st-ready) 14%,transparent)}
.st[data-s="delivered"]{color:var(--st-delivered);border-color:color-mix(in srgb,var(--st-delivered) 45%,transparent);background:color-mix(in srgb,var(--st-delivered) 14%,transparent)}
.st[data-s="cancelled"]{color:var(--st-cancelled);border-color:color-mix(in srgb,var(--st-cancelled) 45%,transparent);background:color-mix(in srgb,var(--st-cancelled) 14%,transparent)}

/* ------------------------------ 4) BUTTONS ----------------------------- */
.btn{
  --bg:var(--c-surface-2);--fg:var(--c-text);--bd:var(--c-line-2);
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:46px;padding:11px 20px;
  background:var(--bg);color:var(--fg);border:1px solid var(--bd);
  border-radius:var(--radius);font-weight:800;font-size:.95rem;
  white-space:nowrap;
  transition:transform .12s ease,filter var(--tr),box-shadow var(--tr),background var(--tr);
  user-select:none;text-align:center;
}
.btn:hover{filter:brightness(1.1)}
.btn:active{transform:scale(.975)}
.btn:disabled,.btn[aria-disabled="true"]{opacity:.45;cursor:not-allowed;filter:none;transform:none}
.btn.gold{--bg:linear-gradient(180deg,var(--c-gold-2),var(--c-gold));--fg:#1a1405;--bd:transparent;box-shadow:var(--shadow-gold)}
.btn.green{--bg:color-mix(in srgb,var(--c-green) 22%,var(--c-surface));--fg:var(--c-green);--bd:color-mix(in srgb,var(--c-green) 45%,transparent)}
.btn.red{--bg:color-mix(in srgb,var(--c-red) 20%,var(--c-surface));--fg:var(--c-red);--bd:color-mix(in srgb,var(--c-red) 45%,transparent)}
.btn.amber{--bg:color-mix(in srgb,var(--c-amber) 20%,var(--c-surface));--fg:var(--c-amber);--bd:color-mix(in srgb,var(--c-amber) 45%,transparent)}
.btn.blue{--bg:color-mix(in srgb,var(--c-blue) 20%,var(--c-surface));--fg:var(--c-blue);--bd:color-mix(in srgb,var(--c-blue) 45%,transparent)}
.btn.ghost{--bg:transparent;--bd:var(--c-line-2)}
.btn.plain{--bg:transparent;--bd:transparent;min-height:auto;padding:8px 10px}
.btn.sm{min-height:38px;padding:7px 13px;font-size:.85rem;border-radius:var(--radius-sm)}
.btn.lg{min-height:54px;padding:14px 26px;font-size:1.02rem}
.btn.block{width:100%}
.btn.icon{padding:0;width:44px;min-height:44px;flex:none}
.btn.icon.sm{width:36px;min-height:36px}

.iconbtn{
  width:42px;height:42px;border-radius:var(--radius-sm);display:inline-flex;
  align-items:center;justify-content:center;background:var(--c-surface-2);
  border:1px solid var(--c-line);font-size:1.05rem;transition:background var(--tr),transform .12s
}
.iconbtn:hover{background:var(--c-surface-3)}
.iconbtn:active{transform:scale(.94)}

.qty{display:inline-flex;align-items:center;gap:2px;background:var(--c-surface-2);border:1px solid var(--c-line);border-radius:var(--radius-pill);padding:3px}
.qty button{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:1.1rem;font-weight:700;background:var(--c-surface-3);transition:background var(--tr)}
.qty button:hover{background:var(--c-gold);color:#1a1405}
.qty .v{min-width:34px;text-align:center;font-weight:800}

/* ------------------------------ 5) FORMS ------------------------------- */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field > label{font-size:.86rem;font-weight:700;color:var(--c-cream)}
.field .hint{font-size:.76rem;color:var(--c-muted)}
.input,select.input,textarea.input{
  width:100%;min-height:48px;padding:12px 14px;
  background:var(--c-surface-2);border:1px solid var(--c-line);
  border-radius:var(--radius);color:var(--c-text);
  transition:border-color var(--tr),background var(--tr);
}
textarea.input{min-height:88px;resize:vertical;line-height:1.6}
.input::placeholder{color:color-mix(in srgb,var(--c-muted) 80%,transparent)}
.input:focus{outline:none;border-color:var(--c-gold);background:var(--c-surface-3);box-shadow:0 0 0 3px color-mix(in srgb,var(--c-gold) 18%,transparent)}
.input[aria-invalid="true"]{border-color:var(--c-red)}
select.input{appearance:none;background-image:linear-gradient(45deg,transparent 49%,var(--c-muted) 50%),linear-gradient(-45deg,transparent 49%,var(--c-muted) 50%);background-size:6px 6px,6px 6px;background-position:left 16px center,left 22px center;background-repeat:no-repeat;padding-inline-start:38px}
.err{color:var(--c-red);font-size:.78rem;font-weight:700;min-height:1em}
.phone-input{direction:ltr;text-align:left;font-variant-numeric:tabular-nums;letter-spacing:.5px}

.check{display:flex;gap:10px;align-items:flex-start;cursor:pointer;font-size:.9rem;line-height:1.5}
.check input{width:22px;height:22px;flex:none;margin-top:2px;accent-color:var(--c-gold)}
.switch{display:inline-flex;align-items:center;gap:10px;cursor:pointer}
.switch input{position:absolute;opacity:0;width:0;height:0}
.switch .track{width:48px;height:28px;border-radius:99px;background:var(--c-surface-3);border:1px solid var(--c-line-2);position:relative;transition:background var(--tr);flex:none}
.switch .track::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:20px;height:20px;border-radius:50%;background:var(--c-muted);transition:transform var(--tr),background var(--tr)}
.switch input:checked + .track{background:color-mix(in srgb,var(--c-gold) 35%,transparent)}
.switch input:checked + .track::after{transform:translateX(-20px);background:var(--c-gold)}
:root[dir="ltr"] .switch input:checked + .track::after{transform:translateX(20px)}
.switch input:focus-visible + .track{outline:2px solid var(--c-gold);outline-offset:2px}

.seg{display:inline-flex;background:var(--c-surface-2);border:1px solid var(--c-line);border-radius:var(--radius-pill);padding:4px;gap:4px;flex-wrap:wrap}
.seg button{padding:8px 14px;border-radius:var(--radius-pill);font-weight:700;font-size:.85rem;color:var(--c-muted);transition:background var(--tr),color var(--tr)}
.seg button[aria-pressed="true"]{background:var(--c-gold);color:#1a1405}
.seg button:hover:not([aria-pressed="true"]){background:var(--c-surface-3);color:var(--c-text)}

.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:none;-ms-overflow-style:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  display:inline-flex;align-items:center;gap:7px;flex:none;
  padding:9px 15px;border-radius:var(--radius-pill);
  background:var(--c-surface-2);border:1px solid var(--c-line);
  font-weight:700;font-size:.88rem;color:var(--c-muted);
  transition:all var(--tr);white-space:nowrap;
}
.chip:hover{border-color:var(--c-line-2);color:var(--c-text)}
.chip[aria-pressed="true"]{background:linear-gradient(180deg,var(--c-gold-2),var(--c-gold));color:#1a1405;border-color:transparent;box-shadow:var(--shadow-gold)}
.chip .c{font-size:1.05rem}

/* ------------------------- 6) MODAL / SHEET ---------------------------- */
.overlay{
  position:fixed;inset:0;z-index:200;background:rgba(4,4,6,.72);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  display:flex;align-items:center;justify-content:center;padding:16px;
  animation:fade .18s ease;
}
:root[data-theme="light"] .overlay{background:rgba(40,32,15,.45)}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.985)}to{opacity:1;transform:none}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:none}}
.modal{
  width:100%;max-width:620px;max-height:92dvh;overflow:auto;overscroll-behavior:contain;
  background:var(--c-surface);border:1px solid var(--c-line-2);border-radius:var(--radius-xl);
  box-shadow:var(--shadow-2);animation:rise .24s cubic-bezier(.2,.8,.3,1);
}
.modal.wide{max-width:900px}
.modal-head{
  position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:12px;
  padding:16px 18px;border-bottom:1px solid var(--c-line);
  background:linear-gradient(180deg,var(--c-surface),color-mix(in srgb,var(--c-surface) 92%,transparent));
  backdrop-filter:blur(10px);
}
.modal-head h3{margin:0;font-size:1.1rem}
.modal-body{padding:18px}
.modal-foot{
  position:sticky;bottom:0;display:flex;gap:10px;flex-wrap:wrap;
  padding:14px 18px;border-top:1px solid var(--c-line);background:var(--c-surface);
}
.modal-foot .btn{flex:1 1 140px}

/* --------------------------- 7) TOASTS / LIVE -------------------------- */
.toasts{position:fixed;z-index:400;bottom:calc(24px + env(safe-area-inset-bottom));inset-inline-start:50%;transform:translateX(50%);display:flex;flex-direction:column;gap:10px;align-items:center;pointer-events:none;width:min(94vw,460px)}
.toast{
  pointer-events:auto;width:100%;display:flex;gap:12px;align-items:flex-start;
  padding:13px 16px;border-radius:var(--radius);font-weight:600;font-size:.9rem;
  background:var(--c-surface-2);border:1px solid var(--c-line-2);
  box-shadow:var(--shadow-2);animation:rise .22s ease;
}
.toast .t-ico{font-size:1.15rem;line-height:1.4;flex:none}
.toast.ok{border-color:color-mix(in srgb,var(--c-green) 50%,transparent);background:color-mix(in srgb,var(--c-green) 12%,var(--c-surface))}
.toast.err{border-color:color-mix(in srgb,var(--c-red) 50%,transparent);background:color-mix(in srgb,var(--c-red) 12%,var(--c-surface))}
.toast.warn{border-color:color-mix(in srgb,var(--c-amber) 50%,transparent);background:color-mix(in srgb,var(--c-amber) 12%,var(--c-surface))}
.toast.info{border-color:color-mix(in srgb,var(--c-blue) 50%,transparent)}
.toast.leaving{animation:fade .2s reverse forwards}

/* ------------------------- 8) STATES / SKELETON ------------------------ */
.state{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;padding:44px 20px;border:1px dashed var(--c-line-2);border-radius:var(--radius-lg);background:color-mix(in srgb,var(--c-surface) 60%,transparent)}
.state .s-ico{font-size:2.6rem;line-height:1;filter:drop-shadow(0 6px 14px rgba(0,0,0,.4))}
.state h4{margin:0;font-size:1.05rem}
.state p{margin:0;color:var(--c-muted);max-width:44ch;font-size:.9rem}
.state.err{border-color:color-mix(in srgb,var(--c-red) 45%,transparent)}

.skel{background:linear-gradient(90deg,var(--c-surface-2) 25%,var(--c-surface-3) 37%,var(--c-surface-2) 63%);background-size:400% 100%;animation:shimmer 1.3s infinite linear;border-radius:var(--radius-sm)}
@keyframes shimmer{0%{background-position:100% 0}100%{background-position:0 0}}
.spinner{width:20px;height:20px;border-radius:50%;border:2.5px solid color-mix(in srgb,var(--c-gold) 30%,transparent);border-top-color:var(--c-gold);animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001s !important;animation-iteration-count:1 !important;transition-duration:.001s !important;scroll-behavior:auto !important}
}

/* --------------------------- 9) CUSTOMER APP --------------------------- */
.app{min-height:100dvh;display:flex;flex-direction:column;background:
  radial-gradient(1100px 520px at 90% -8%,color-mix(in srgb,var(--c-gold) 13%,transparent),transparent 60%),
  radial-gradient(760px 420px at 5% 8%,color-mix(in srgb,var(--c-gold) 7%,transparent),transparent 60%),
  var(--c-bg);
}
.c-head{
  position:sticky;top:0;z-index:60;height:var(--header-h);
  display:flex;align-items:center;gap:12px;padding-inline:14px;
  background:color-mix(in srgb,var(--c-bg) 82%,transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--c-line);
}
.c-head .brand{display:flex;align-items:center;gap:10px;min-width:0}
.c-logo{
  width:42px;height:42px;flex:none;border-radius:12px;display:grid;place-items:center;
  background:linear-gradient(140deg,var(--c-gold-2),var(--c-gold-dark));
  color:#181304;font-weight:900;font-size:1.15rem;box-shadow:var(--shadow-gold);
}
.c-head .brand b{display:block;font-size:1rem;line-height:1.25}
.c-head .brand .truncate{display:block}
.c-main{flex:1;padding-bottom:calc(var(--tabbar-h) + 96px + env(safe-area-inset-bottom))}
.c-tabs{
  position:fixed;bottom:0;inset-inline:0;z-index:70;height:calc(var(--tabbar-h) + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom);
  display:flex;background:color-mix(in srgb,var(--c-surface) 94%,transparent);
  backdrop-filter:blur(16px);border-top:1px solid var(--c-line);
}
.c-tabs a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.7rem;font-weight:700;color:var(--c-muted);position:relative;transition:color var(--tr)}
.c-tabs a .ti{font-size:1.3rem;line-height:1}
.c-tabs a[aria-current="page"]{color:var(--c-gold)}
.c-tabs a[aria-current="page"]::before{content:"";position:absolute;top:0;width:38px;height:3px;border-radius:0 0 4px 4px;background:var(--c-gold)}
.c-tabs .tcount{position:absolute;top:6px;inset-inline-start:calc(50% + 8px);min-width:19px;height:19px;padding:0 5px;border-radius:99px;background:var(--c-red);color:#fff;font-size:.68rem;font-weight:800;display:grid;place-items:center;direction:ltr}

.cartbar{
  position:fixed;z-index:65;bottom:calc(var(--tabbar-h) + 12px + env(safe-area-inset-bottom));
  inset-inline:12px;max-width:680px;margin-inline:auto;
  display:flex;align-items:center;gap:12px;padding:10px 12px;
  background:linear-gradient(180deg,var(--c-surface-2),var(--c-surface));
  border:1px solid var(--c-line-2);border-radius:var(--radius-lg);
  box-shadow:var(--shadow-2);animation:rise .3s ease;
}
.cartbar .cbinfo{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.cartbar .cbinfo b{font-size:.92rem}
.cartbar .btn{flex:none}

.hero{position:relative;overflow:hidden;border-radius:var(--radius-xl);margin-top:14px;border:1px solid var(--c-line)}
.hero .hero-art{position:absolute;inset:0;background-size:cover;background-position:center;opacity:.5;transform:scale(1.04)}
.hero .hero-veil{position:absolute;inset:0;background:linear-gradient(90deg,color-mix(in srgb,var(--c-bg) 94%,transparent) 8%,color-mix(in srgb,var(--c-bg) 55%,transparent) 62%,transparent)}
.hero .hero-in{position:relative;padding:clamp(20px,5vw,44px);max-width:640px}
.hero .kicker{display:inline-flex;align-items:center;gap:8px;font-size:.78rem;font-weight:800;letter-spacing:.06em;color:var(--c-gold);text-transform:uppercase;margin-bottom:10px}
.hero h1{margin-bottom:8px}
.hero p{color:var(--c-muted);font-size:1rem;margin-bottom:18px}
.hero .cta{display:flex;gap:10px;flex-wrap:wrap}

.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:26px 0 12px}
.sec-head h2{margin:0}
.sec-head .sub{color:var(--c-muted);font-size:.85rem}

.grid-cards{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(168px,1fr))}
.pcard{
  position:relative;display:flex;flex-direction:column;overflow:hidden;
  background:var(--c-surface);border:1px solid var(--c-line);border-radius:var(--radius-lg);
  box-shadow:var(--shadow-1);transition:transform var(--tr),box-shadow var(--tr),border-color var(--tr);
}
.pcard:hover{transform:translateY(-4px);box-shadow:var(--shadow-2);border-color:var(--c-line-2)}
.pcard .pimg{position:relative;aspect-ratio:4/3;background:var(--c-surface-2);overflow:hidden}
.pcard .pimg img{width:100%;height:100%;object-fit:cover;transition:transform .5s ease}
.pcard:hover .pimg img{transform:scale(1.06)}
.pcard .pimg .tags{position:absolute;top:8px;inset-inline-start:8px;display:flex;flex-direction:column;gap:5px;align-items:flex-start}
.pcard .pbody{padding:12px;display:flex;flex-direction:column;gap:6px;flex:1}
.pcard h3{margin:0;font-size:.98rem;font-weight:800}
.pcard .pdesc{color:var(--c-muted);font-size:.8rem;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.4em}
.pcard .pfoot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto;padding-top:8px}
.price{font-weight:900;font-size:1.02rem;color:var(--c-gold-2)}
.pcard.out{opacity:.62}
.pcard.out .pimg img{filter:grayscale(1) brightness(.7)}
.addbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(180deg,var(--c-gold-2),var(--c-gold));color:#1a1405;font-size:1.25rem;font-weight:800;box-shadow:var(--shadow-gold);transition:transform .12s}
.addbtn:hover{filter:brightness(1.08)}
.addbtn:active{transform:scale(.9)}
.addbtn:disabled{background:var(--c-surface-3);color:var(--c-muted);box-shadow:none;cursor:not-allowed}

/* item detail */
.idetail .iimg{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:var(--radius);background:var(--c-surface-2)}
.opt-list{display:flex;flex-direction:column;gap:8px}
.opt{
  display:flex;align-items:center;gap:12px;padding:11px 13px;
  background:var(--c-surface-2);border:1px solid var(--c-line);border-radius:var(--radius);
  cursor:pointer;transition:border-color var(--tr),background var(--tr);
}
.opt:hover{border-color:var(--c-line-2)}
.opt:has(input:checked){border-color:var(--c-gold);background:color-mix(in srgb,var(--c-gold) 9%,var(--c-surface-2))}
.opt input{width:20px;height:20px;accent-color:var(--c-gold);flex:none}
.opt .oname{flex:1;font-size:.92rem;font-weight:600}
.opt .oprice{font-size:.85rem;font-weight:800;color:var(--c-gold-2)}

/* cart lines */
.cline{display:flex;gap:12px;padding:13px 0;border-bottom:1px solid var(--c-line)}
.cline:last-child{border-bottom:0}
.cline .cthumb{width:64px;height:64px;border-radius:var(--radius-sm);flex:none;object-fit:cover;background:var(--c-surface-2)}
.cline .cinfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.cline .cname{font-weight:800;font-size:.94rem}
.cline .cadd{font-size:.78rem;color:var(--c-muted);line-height:1.5}
.cline .cnote{font-size:.76rem;color:var(--c-amber);display:flex;gap:5px;align-items:flex-start}
.cline .cprice{font-weight:900;color:var(--c-gold-2);white-space:nowrap}

.totals{display:flex;flex-direction:column;gap:8px}
.totals .trow{display:flex;align-items:center;justify-content:space-between;font-size:.92rem}
.totals .trow.grand{font-size:1.15rem;font-weight:900;padding-top:10px;border-top:1px dashed var(--c-line-2);margin-top:4px}
.totals .trow.grand .num{color:var(--c-gold-2)}

/* timeline */
.timeline{position:relative;padding-inline-start:26px}
.timeline::before{content:"";position:absolute;inset-inline-start:9px;top:8px;bottom:8px;width:2px;background:var(--c-line-2)}
.tl-step{position:relative;padding-bottom:20px}
.tl-step:last-child{padding-bottom:0}
.tl-step .dot{position:absolute;inset-inline-start:-26px;top:2px;width:20px;height:20px;border-radius:50%;background:var(--c-surface-3);border:2px solid var(--c-line-2);display:grid;place-items:center;font-size:.62rem}
.tl-step.done .dot{background:var(--c-green);border-color:var(--c-green);color:#08130c}
.tl-step.active .dot{background:var(--c-gold);border-color:var(--c-gold-2);color:#1a1405;box-shadow:0 0 0 5px color-mix(in srgb,var(--c-gold) 20%,transparent);animation:pulse 1.7s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 4px color-mix(in srgb,var(--c-gold) 22%,transparent)}50%{box-shadow:0 0 0 9px color-mix(in srgb,var(--c-gold) 4%,transparent)}}
.tl-step .tl-t{font-weight:800;font-size:.94rem}
.tl-step .tl-s{font-size:.78rem;color:var(--c-muted)}

/* success */
.success-art{width:104px;height:104px;border-radius:50%;display:grid;place-items:center;font-size:3rem;margin:0 auto 14px;background:color-mix(in srgb,var(--c-green) 16%,transparent);border:2px solid var(--c-green);animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
.ordnum{font-family:var(--font-mono);font-size:1.25rem;font-weight:900;letter-spacing:.06em;color:var(--c-gold-2);direction:ltr;display:inline-block}

.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:.9rem}
.kv dt{color:var(--c-muted);font-weight:600}
.kv dd{margin:0;font-weight:700}

.stat-mini{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(120px,1fr))}
.stat-mini .sm-card{padding:12px;border-radius:var(--radius);background:var(--c-surface-2);border:1px solid var(--c-line);text-align:center}
.stat-mini .sm-card b{display:block;font-size:1.25rem;color:var(--c-gold-2);direction:ltr}
.stat-mini .sm-card span{font-size:.76rem;color:var(--c-muted)}

.loyalty-hero{
  display:flex;align-items:center;gap:16px;padding:18px;border-radius:var(--radius-lg);
  background:linear-gradient(135deg,color-mix(in srgb,var(--c-gold) 24%,var(--c-surface)),var(--c-surface));
  border:1px solid color-mix(in srgb,var(--c-gold) 38%,transparent);
}
.loyalty-hero .lpts{font-size:2.1rem;font-weight:900;color:var(--c-gold-2);line-height:1;direction:ltr}
.progress{height:10px;border-radius:99px;background:var(--c-surface-3);overflow:hidden;border:1px solid var(--c-line)}
.progress > i{display:block;height:100%;background:linear-gradient(90deg,var(--c-gold-dark),var(--c-gold-2));transition:width .5s ease}

.reward{display:flex;gap:12px;align-items:center;padding:13px;border-radius:var(--radius);background:var(--c-surface-2);border:1px solid var(--c-line)}
.reward .ricon{font-size:1.7rem;flex:none}
.reward.locked{opacity:.62}

.tickets{display:flex;flex-direction:column;gap:12px}
.ticket{display:flex;gap:12px;align-items:center;padding:14px;border-radius:var(--radius);background:var(--c-surface);border:1px solid var(--c-line);box-shadow:var(--shadow-1);transition:border-color var(--tr),transform var(--tr)}
.ticket:hover{border-color:var(--c-line-2);transform:translateY(-2px)}
.ticket .tnum{font-family:var(--font-mono);font-weight:800;font-size:.9rem;color:var(--c-gold-2);direction:ltr}
/* --------------------------- 10) ADMIN PANEL --------------------------- */
.adm{min-height:100dvh;display:grid;grid-template-columns:270px 1fr;background:var(--c-bg-2)}
.adm-side{
  position:sticky;top:0;height:100dvh;display:flex;flex-direction:column;
  background:linear-gradient(180deg,var(--c-surface),var(--c-bg));border-inline-end:1px solid var(--c-line);
  padding:14px;gap:6px;overflow-y:auto;z-index:80;
}
.adm-side .s-brand{display:flex;align-items:center;gap:11px;padding:8px 6px 16px;border-bottom:1px solid var(--c-line);margin-bottom:10px}
.adm-side .s-brand b{display:block;font-size:.98rem;line-height:1.3}
.adm-nav{display:flex;flex-direction:column;gap:3px}
.adm-nav button{
  display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:var(--radius);
  font-weight:700;font-size:.9rem;color:var(--c-muted);text-align:start;width:100%;
  transition:background var(--tr),color var(--tr);position:relative;
}
.adm-nav button .ni{font-size:1.15rem;width:24px;text-align:center;flex:none}
.adm-nav button:hover{background:var(--c-surface-2);color:var(--c-text)}
.adm-nav button[aria-current="true"]{background:linear-gradient(90deg,color-mix(in srgb,var(--c-gold) 22%,transparent),transparent);color:var(--c-gold-2)}
.adm-nav button[aria-current="true"]::before{content:"";position:absolute;inset-inline-end:0;top:9px;bottom:9px;width:3px;border-radius:3px;background:var(--c-gold)}
.adm-nav .nav-badge{margin-inline-start:auto;min-width:22px;height:22px;padding:0 6px;border-radius:99px;background:var(--c-red);color:#fff;font-size:.72rem;font-weight:800;display:grid;place-items:center;direction:ltr}
.adm-side .s-foot{margin-top:auto;padding-top:12px;border-top:1px solid var(--c-line);display:flex;flex-direction:column;gap:8px}
.adm-user{display:flex;align-items:center;gap:10px;padding:9px;border-radius:var(--radius);background:var(--c-surface-2);border:1px solid var(--c-line)}
.adm-user .av{width:36px;height:36px;border-radius:50%;flex:none;display:grid;place-items:center;background:linear-gradient(140deg,var(--c-gold-2),var(--c-gold-dark));color:#1a1405;font-weight:900}
.adm-user b{display:block;font-size:.86rem;line-height:1.3}
.adm-user span{font-size:.72rem;color:var(--c-muted)}

.adm-main{display:flex;flex-direction:column;min-width:0}
.adm-top{
  position:sticky;top:0;z-index:70;display:flex;align-items:center;gap:12px;
  padding:12px 18px;background:color-mix(in srgb,var(--c-bg-2) 88%,transparent);
  backdrop-filter:blur(14px);border-bottom:1px solid var(--c-line);min-height:66px;
}
.adm-top h2{margin:0;font-size:1.15rem}
.bell-wrap{position:relative;display:inline-flex}
.bell-wrap .nav-badge{position:absolute;top:-6px;inset-inline-start:-6px;margin:0}
.adm-content{padding:20px;display:flex;flex-direction:column;gap:20px;min-width:0}
.adm-burger{display:none}

.kpis{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.kpi{position:relative;overflow:hidden;padding:16px;border-radius:var(--radius-lg);background:var(--c-surface);border:1px solid var(--c-line);box-shadow:var(--shadow-1)}
.kpi::after{content:"";position:absolute;inset-inline-start:-30px;top:-30px;width:110px;height:110px;border-radius:50%;background:color-mix(in srgb,var(--c-gold) 10%,transparent)}
.kpi .k-ico{font-size:1.5rem;margin-bottom:6px}
.kpi .k-val{font-size:1.7rem;font-weight:900;line-height:1.15;direction:ltr;text-align:right}
.kpi .k-lbl{font-size:.8rem;color:var(--c-muted);font-weight:700;text-align:right}
.kpi .k-sub{font-size:.74rem;color:var(--c-muted);margin-top:4px;text-align:right}

.orders-grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
.ocard{display:flex;flex-direction:column;background:var(--c-surface);border:1px solid var(--c-line);border-radius:var(--radius-lg);box-shadow:var(--shadow-1);overflow:hidden;transition:border-color var(--tr),box-shadow var(--tr)}
.ocard:hover{border-color:var(--c-line-2)}
.ocard.is-new{border-color:color-mix(in srgb,var(--c-gold) 55%,transparent);box-shadow:0 0 0 1px color-mix(in srgb,var(--c-gold) 30%,transparent),var(--shadow-1)}
.ocard.is-new .ocard-head{background:linear-gradient(90deg,color-mix(in srgb,var(--c-gold) 16%,transparent),transparent)}
.ocard-head{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--c-line);flex-wrap:wrap}
.ocard-head .onum{font-family:var(--font-mono);font-weight:900;font-size:.92rem;color:var(--c-gold-2);direction:ltr}
.ocard-body{padding:12px 14px;display:flex;flex-direction:column;gap:11px;flex:1}
.ocard-meta{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:.83rem}
.ocard-meta div{display:flex;align-items:center;gap:6px}
.ocard-meta .lab{color:var(--c-muted)}
.oitems{display:flex;flex-direction:column;gap:7px;background:var(--c-surface-2);border:1px solid var(--c-line);border-radius:var(--radius);padding:10px 12px;max-height:230px;overflow:auto}
.oitem{display:flex;gap:9px;font-size:.85rem}
.oitem .qn{font-weight:900;color:var(--c-gold-2);flex:none;min-width:26px;direction:ltr}
.oitem .in{flex:1;min-width:0}
.oitem .sub{color:var(--c-muted);font-size:.78rem;line-height:1.5}
.oitem .p{white-space:nowrap;font-weight:700;font-size:.83rem}
.ocard-foot{padding:12px 14px;border-top:1px solid var(--c-line);display:flex;flex-direction:column;gap:10px;background:var(--c-surface)}
.ocard-foot .actions{display:flex;flex-wrap:wrap;gap:8px}
.ocard-foot .actions .btn{flex:1 1 auto;min-width:104px}
.eta-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:.83rem}
.eta-row input{width:78px;min-height:38px;padding:6px 10px;text-align:center;font-weight:800;direction:ltr}
.timeline-note{font-size:.76rem;color:var(--c-muted);display:flex;gap:6px;align-items:flex-start}

.tbl-wrap{overflow:auto;border:1px solid var(--c-line);border-radius:var(--radius-lg);background:var(--c-surface)}
table.data{min-width:640px;font-size:.87rem}
table.data th,table.data td{padding:11px 13px;text-align:start;border-bottom:1px solid var(--c-line);vertical-align:middle}
table.data thead th{background:var(--c-surface-2);font-size:.78rem;color:var(--c-muted);font-weight:800;position:sticky;top:0;z-index:1;white-space:nowrap}
table.data tbody tr:hover{background:var(--c-surface-2)}
table.data tbody tr:last-child td{border-bottom:0}
table.data td.acts{white-space:nowrap}
table.data .thumb{width:44px;height:44px;border-radius:9px;object-fit:cover;background:var(--c-surface-2)}

.panel{padding:16px;border-radius:var(--radius-lg);background:var(--c-surface);border:1px solid var(--c-line);box-shadow:var(--shadow-1)}
.panel > h3{display:flex;align-items:center;gap:9px;margin-bottom:14px;font-size:1rem}
.panel-grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.form-grid{display:grid;gap:0 14px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}

.chart{display:flex;align-items:flex-end;gap:8px;height:170px;padding:10px 4px;background:var(--c-surface-2);border-radius:var(--radius);border:1px solid var(--c-line);overflow-x:auto}
.bar{flex:1 1 0;min-width:26px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%}
.bar .b{width:100%;border-radius:8px 8px 3px 3px;background:linear-gradient(180deg,var(--c-gold-2),var(--c-gold-dark));min-height:4px;transition:height .5s ease;position:relative}
.bar .bl{font-size:.68rem;color:var(--c-muted);white-space:nowrap;direction:ltr}
.bar .bv{font-size:.7rem;font-weight:800;color:var(--c-gold-2);direction:ltr}

.logrow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;padding:10px 12px;border-radius:var(--radius-sm);background:var(--c-surface-2);border:1px solid var(--c-line);font-size:.84rem}
.logrow + .logrow{margin-top:7px}
.logrow.error{border-color:color-mix(in srgb,var(--c-red) 40%,transparent)}
.logrow.warn{border-color:color-mix(in srgb,var(--c-amber) 40%,transparent)}
.logrow .lt{font-size:.74rem;color:var(--c-muted);direction:ltr;white-space:nowrap}

.wamsg{display:flex;gap:10px;align-items:flex-start;padding:11px 13px;border-radius:var(--radius);background:var(--c-surface-2);border:1px solid var(--c-line);font-size:.84rem}
.wamsg + .wamsg{margin-top:8px}
.wamsg .wi{font-size:1.3rem;flex:none}
.wamsg .wbody{flex:1;min-width:0}
.wamsg .wmeta{font-size:.74rem;color:var(--c-muted);display:flex;gap:10px;flex-wrap:wrap;margin-top:4px}
.wamsg pre{margin:6px 0 0;padding:8px;background:var(--c-bg);border-radius:8px;font-family:var(--font-mono);font-size:.74rem;white-space:pre-wrap;word-break:break-word;max-height:150px;overflow:auto;direction:ltr;text-align:left}

.doc h3{margin-top:20px;color:var(--c-gold-2)}
.doc h3:first-child{margin-top:0}
.doc pre{margin:8px 0;padding:14px;background:var(--c-bg);border:1px solid var(--c-line);border-radius:var(--radius);font-family:var(--font-mono);font-size:.78rem;line-height:1.6;overflow:auto;direction:ltr;text-align:left;max-height:460px}
.doc code{font-family:var(--font-mono);font-size:.84em;background:var(--c-surface-2);padding:1px 6px;border-radius:6px;direction:ltr;display:inline-block}
.doc table.data{min-width:auto;font-size:.82rem}
.doc ul.notes{display:flex;flex-direction:column;gap:7px;padding-inline-start:18px;list-style:disc}
.doc ul.notes li{font-size:.87rem;color:var(--c-text)}

/* Login gate */
.gate{min-height:100dvh;display:grid;place-items:center;padding:20px;background:
  radial-gradient(900px 460px at 78% 0%,color-mix(in srgb,var(--c-gold) 14%,transparent),transparent 60%),var(--c-bg-2)}
.gate-card{width:100%;max-width:420px;padding:26px;border-radius:var(--radius-xl);background:var(--c-surface);border:1px solid var(--c-line-2);box-shadow:var(--shadow-2)}

  }catch(e){ return new Date(iso).toLocaleString(); }

function normalizePhone(raw, dial = '966'){
  let s = String(raw || '').replace(/[^\d+]/g, '');

/** حساب الإجماليات — في الإنتاج يتم نفس الحساب على الخادم (مصدر الحقيقة) */
function recalcOrder(order, settings){
  const sub = order.items.reduce((s, it) => s + (Number(it.unitPrice) + (it.addons||[]).reduce((a,x)=>a+Number(x.price||0),0)) * Number(it.qty), 0);
  order.subtotal = +sub.toFixed(2);
  order.discount = +(Number(order.discount) || 0).toFixed(2);
  const base = Math.max(0, order.subtotal - order.discount);
  order.service = +((base * (Number(settings.serviceRate) || 0)) / 100).toFixed(2);
  order.vat = +(((base + order.service) * (Number(settings.vatRate) || 0)) / 100).toFixed(2);
  order.total = +(base + order.service + order.vat).toFixed(2);
  order.items.forEach(it => {
    it.lineTotal = +(((Number(it.unitPrice) + (it.addons||[]).reduce((a,x)=>a+Number(x.price||0),0)) * Number(it.qty))).toFixed(2);
  });
  return order;
}
function seedHistory(order, data){
  const flow = ['pending','accepted','preparing','ready','delivered'];
  const upto = order.status === 'cancelled' ? 1 : Math.max(1, flow.indexOf(order.status) + 1);
  const start = new Date(order.createdAt).getTime();
  for(let i = 0; i < upto; i++){
    data.orderStatusHistory.push({
      id: uid('OSH', 5), orderId: order.id, from: i === 0 ? null : flow[i-1], to: flow[i],
      byUserId: i === 0 ? null : 'USR-3', byName: i === 0 ? 'العميل' : 'محمد الكاشير',
      note:'', at: new Date(start + i * 4 * 60000).toISOString()
    });
  }
}
function seedHistoryDone(data){
  const o = data.orders.find(x => x.status === 'delivered');
  if(!o) return;
  data.loyaltyTransactions.push({
    id: uid('LTX', 6), customerId:o.customerId, orderId:o.id, type:'earn',
    points: Math.round(o.total * data.settings.loyalty.pointsPerCurrency),
    balanceAfter: 150, note:'نقاط طلب مكتمل (Demo)', at: o.deliveredAt || nowISO(), byUserId:'system'
  });
}

/* تخزين محلي على هذا المتصفح فقط. لا يُستخدم كمصدر حقيقة مشترك بين الأجهزة. */
const Store = {
  data: null,
  memory: false,

  load(){
    try{
      const raw = localStorage.getItem(APP.key);
      if(raw){
        const parsed = JSON.parse(raw);
        if(parsed && parsed.version === APP.seedVersion){ this.data = parsed; return this.data; }
      }
    }catch(e){ this.memory = true; }
    this.data = buildSeed();
    this.save();
    return this.data;
  },
  save(){
    try{ localStorage.setItem(APP.key, JSON.stringify(this.data)); }
    catch(e){ this.memory = true; }
  },
  reset(){ try{ localStorage.removeItem(APP.key); }catch(e){} this.data = buildSeed(); this.save(); }
};

/* ناقل أحداث بسيط (Demo للـ Realtime) — يُستبدل بـ WebSocket/Supabase/Pusher */
const Bus = {
  ch: null,
  init(){
    try{ this.ch = new BroadcastChannel(APP.channel); }catch(e){ this.ch = null; }
    if(this.ch) this.ch.onmessage = ev => { if(ev && ev.data && ev.data.type === 'db:changed') EventBus.emit('remote:change', ev.data); };
    window.addEventListener('storage', e => {
      if(e.key === APP.key && e.newValue){
        try{ Store.data = JSON.parse(e.newValue); EventBus.emit('remote:change', { entity:'all' }); }catch(err){}
      }
    });
  },
  emit(entity){
    const msg = { type:'db:changed', entity, at: Date.now() };
    if(this.ch) try{ this.ch.postMessage(msg); }catch(e){}
  }
};
const EventBus = {
  map: {},
  on(ev, fn){ (this.map[ev] = this.map[ev] || []).push(fn); return () => this.off(ev, fn); },
  off(ev, fn){ if(this.map[ev]) this.map[ev] = this.map[ev].filter(f => f !== fn); },
  emit(ev, payload){ (this.map[ev] || []).forEach(fn => { try{ fn(payload); }catch(e){ console.error('[EventBus]', ev, e); } }); }
};

  /* -------------------------------- Orders ---------------------------- */
  orders: {
    /**
     * POST /api/orders
     * ملاحظة أمنية: الأسعار والتوفر والإجمالي تُحسب هنا من بيانات الخادم —
     * أي سعر يرسله العميل يُتجاهل تمامًا (منع التلاعب).
     */
    async create(payload){
      await delay(420);
      const db = Store.data;
      if(!db.settings.acceptOrders) throw new ApiError('المطعم لا يستقبل طلبات حاليًا. حاول لاحقًا.','CLOSED',423);
      const customer = db.customers.find(c => c.id === payload.customerId);
      if(!customer) throw new ApiError('العميل غير معروف. أعد التسجيل.','AUTH',401);
      const table = payload.tableId ? db.tables.find(t => t.id === payload.tableId) : null;
      if(payload.tableId && !table) throw new ApiError('رقم الطاولة غير صحيح','VALIDATION');
      if(!Array.isArray(payload.items) || !payload.items.length) throw new ApiError('السلة فارغة','VALIDATION');

      /* التحقق من كل صنف + إعادة حساب الأسعار من مصدر الحقيقة */
      const items = payload.items.map(line => {
        const p = db.products.find(x => x.id === line.productId);
        if(!p) throw new ApiError('صنف غير موجود في المنيو','NOT_FOUND',404);
        if(!p.available) throw new ApiError('الصنف "' + p.name + '" غير متوفر حاليًا. أزلْه من السلة.','UNAVAILABLE',409);
        const qty = Math.max(1, Math.min(50, parseInt(line.qty,10) || 1));
        const addons = (line.addonIds || []).map(aid => {
          const a = (p.addons||[]).find(x => x.id === aid);
          if(!a) throw new ApiError('إضافة غير صالحة على الصنف "' + p.name + '"','VALIDATION');
          return { id:a.id, name:a.name, price:Number(a.price) };
        });
        const unitPrice = Number(p.price);
        return {
          id: uid('OI',5), productId:p.id, name:p.name, nameEn:p.nameEn, unitPrice, qty, addons,
          note: String(line.note||'').slice(0,180), lineTotal: +((unitPrice + addons.reduce((s,a)=>s+a.price,0)) * qty).toFixed(2)
        };
      });

      /* رقم طلب فريد مضمون */
      let number = orderNumber();
      let guard = 0;
      while(db.orders.some(o => o.number === number) && guard++ < 20) number = orderNumber();

      const eta = payload.etaMinutes || estimatePrep(items, db.settings);
      const order = {
        id: uid('ORD', 10), number,
        customerId: customer.id, customerName: customer.name, customerPhone: customer.phone,
        tableId: table ? table.id : null, tableNo: table ? table.number : 0,
        type: table && table.takeaway ? 'takeaway' : 'dine-in',
        status: 'pending', items, subtotal:0, discount:0, vat:0, service:0, total:0,
        etaMinutes: eta, notes: String(payload.notes||'').slice(0,300),
        payment: payload.payment || (db.settings.payments[0] || 'كاش عند التسليم'),
        createdAt: nowISO(), acceptedAt:null, readyAt:null, deliveredAt:null,
        cancelledAt:null, cancelReason:'', loyaltyAwarded:false,
        rating:null, syncState:'synced'
      };
      recalcOrder(order, db.settings);
      db.orders.unshift(order);
      db.orderStatusHistory.push({ id: uid('OSH',5), orderId:order.id, from:null, to:'pending', byUserId:null, byName:'العميل', note:'إنشاء الطلب', at:order.createdAt });
      addLog('info','orders','طلب جديد ' + order.number + ' — ' + money(order.total), { orderId:order.id });
      commit('orders');

      /* إشعار الطلب الجديد للوحة الإدارة (يظهر في التاب المفتوح) */
      EventBus.emit('order:new', order);
      return Object.assign({}, order);
    },

    async list(filters){
      await delay(120);
      filters = filters || {};

      if(filters.status && filters.status !== 'all'){
        out = filters.status === 'active'

    /** PATCH /api/orders/:id/status — مع منع التعارض في التحديثات */
    async updateStatus(id, to, opts){
      await delay(280);
      opts = opts || {};
      const db = Store.data;
      const o = db.orders.find(x => x.id === id);
      if(!o) throw new ApiError('الطلب غير موجود','NOT_FOUND',404);
      if(o.status === to) throw new ApiError('الطلب في هذه الحالة بالفعل','CONFLICT',409);
      if(STATUS[o.status].next.indexOf(to) === -1){
        throw new ApiError('انتقال غير مسموح: ' + STATUS[o.status].ar + ' ← ' + STATUS[to].ar,'CONFLICT',409);
      }
      /* منع تعارض التحديثات: إن تغيّرت الحالة على جهاز آخر منذ آخر قراءة */
      if(opts.expectedStatus && opts.expectedStatus !== o.status){
        throw new ApiError('تم تحديث هذا الطلب من مستخدم آخر. حدّث الصفحة.','CONFLICT',409);
      }
      const from = o.status;
      o.status = to;
      const at = nowISO();
      if(to === 'accepted'){ o.acceptedAt = at; if(opts.etaMinutes) o.etaMinutes = Number(opts.etaMinutes); }
      if(to === 'preparing'){ o.prepStartedAt = at; }
      if(to === 'ready'){ o.readyAt = at; }
      if(to === 'delivered'){
        o.deliveredAt = at;
        if(o.etaMinutes && !o.etaPromiseAt) o.etaPromiseAt = addMinutes(o.etaMinutes, o.createdAt);
      }
      if(to === 'cancelled'){ o.cancelledAt = at; o.cancelReason = opts.reason || ''; }

      db.orderStatusHistory.push({
        id: uid('OSH',5), orderId:o.id, from, to,
        byUserId:(S.admin.user && S.admin.user.id) || null,
        byName:(S.admin.user && S.admin.user.name) || 'النظام',
        note: opts.note || (to === 'cancelled' ? (opts.reason || '') : ''), at
      });
      addLog('info','orders','تحديث حالة ' + o.number + ': ' + STATUS[from].ar + ' → ' + STATUS[to].ar, { orderId:o.id });

      /* أتمتة WhatsApp حسب الحالة (تُنفّذ فعليًا على الخادم) */
      if(to === 'ready')     WhatsApp.enqueue('order_ready', o).catch(()=>{});
      if(to === 'delivered'){
        Loyalty.awardForOrder(o, db.settings);          // النقاط تُضاف بعد التسليم المؤكد فقط
        WhatsApp.enqueue('order_delivered', o).catch(()=>{});
      }
      commit('orders');
      EventBus.emit('order:updated', o);
      return Object.assign({}, o);
    },

      const o = Store.data.orders.find(x => x.id === id);

      const m = Math.max(1, Math.min(180, parseInt(minutes,10) || 0));
      if(!m) throw new ApiError('وقت تجهيز غير صالح','VALIDATION');

/** تثبيت التغييرات + بثها للتابات الأخرى */
function commit(entity){
  Store.save();
  Bus.emit(entity);
  EventBus.emit('data:changed', entity);
}
function addLog(level, scope, message, meta){
  Store.data.logs.push({ id: uid('LOG',5), level, scope, message, meta: meta||{}, at: nowISO() });
  if(Store.data.logs.length > 600) Store.data.logs.splice(0, Store.data.logs.length - 600);
}
/** تقدير وقت التجهيز (يُحسب على الخادم في الإنتاج) */
function estimatePrep(items, settings){
  const maxPrep = items.reduce((m,it) => {
    const p = Store.data.products.find(x => x.id === it.productId);
    return Math.max(m, (p && p.prepTime) || 12);
  }, 0);
  return Math.min(120, Math.max(5, maxPrep + items.length * (Number(settings.itemsPrepBuffer)||1)));
}

/* ============================== 5) SERVICES ============================= */
/* --------------------------- 5.1 WhatsApp ------------------------------ */
/* طبقة تكامل واضحة. الإرسال الحقيقي يتطلب WhatsApp Business Platform على
   الخادم (Cloud API) — هنا محاكاة كاملة لتجربة التدفق وسجل الرسائل فقط. */
const WhatsApp = {
  MAX_ATTEMPTS: 3,
  processing: false,

  /** بناء نص الرسالة من قالب معتمد داخل إعدادات المطعم */
  render(templateKey, order, settings){
    const tpl = (settings.whatsapp.templates || {})[templateKey] || '';
    const itemsText = order.items.map(it =>
      '• ' + it.qty + ' × ' + it.name + (it.addons && it.addons.length ? ' (' + it.addons.map(a=>a.name).join('، ') + ')' : '')
    ).join('\n');
    const c = Store.data.customers.find(x => x.id === order.customerId);
    const vars = {
      name: order.customerName || 'عميلنا العزيز',
      orderNo: order.number,
      tableNo: order.tableNo ? String(order.tableNo) : 'سفري',
      total: money(order.total),
      eta: String(order.etaMinutes),
      items: itemsText,
      restaurant: settings.restaurantName,
      points: String(c ? c.points : 0),
      reviewLink: settings.whatsapp.reviewLink || ''
    };
    return tpl.replace(/\{(\w+)\}/g, (m, k) => (k in vars ? vars[k] : m));
  },

  /** إضافة رسالة للطابور مع مفتاح idempotency يمنع التكرار */
  async enqueue(templateKey, order){
    const settings = Store.data.settings;
    if(!settings.whatsapp.enabled) return null;
    const customer = Store.data.customers.find(x => x.id === order.customerId);
    const idem = order.id + ':' + templateKey;
    const existing = Store.data.whatsappMessages.find(m => m.idempotencyKey === idem);
    if(existing){
      if(existing.status === 'sent') return existing;         // لا نكرر رسالة أُرسلت
      existing.status = 'queued'; existing.nextAttemptAt = nowISO();
      commit('whatsapp');
      this.process();
      return existing;
    }
    const to = customer ? customer.phone : order.customerPhone;
    const consent = customer ? customer.whatsappConsent : false;
    const msg = {
      id: uid('WAM', 8),
      orderId: order.id, orderNumber: order.number, customerId: order.customerId,
      to, template: templateKey,
      body: this.render(templateKey, order, settings),
      status: 'queued', providerMessageId: null, attempts: 0, lastError: null,
      idempotencyKey: idem, nextAttemptAt: nowISO(),
      createdAt: nowISO(), updatedAt: nowISO(), simulated: true,
      consent: !!consent
    };
    /* احترام موافقة العميل وقواعد واتساب */
    if(settings.whatsapp.requireConsent && !consent){
      msg.status = 'blocked';
      msg.lastError = 'لا توجد موافقة من العميل على رسائل WhatsApp (Opt-in)';
      addLog('warn','whatsapp','رسالة محجوبة لعدم الموافقة — ' + order.number, { orderId:order.id });
    }else if(!PHONE_RE.test(String(to || ''))){
      msg.status = 'failed';
      msg.lastError = 'رقم واتساب غير صالح';
      addLog('error','whatsapp','رقم غير صالح للطلب ' + order.number, { orderId:order.id });
    }
    Store.data.whatsappMessages.unshift(msg);
    commit('whatsapp');
    if(msg.status === 'queued') this.process();
    return msg;
  },

  /** معالجة الطابور: إعادة محاولة محدودة بفاصل زمني (Backoff) */
  async process(){
    if(this.processing) return;
    this.processing = true;
    try{
      const pend = Store.data.whatsappMessages.filter(m =>
        m.status === 'queued' && m.attempts < this.MAX_ATTEMPTS && new Date(m.nextAttemptAt || 0) <= new Date()
      );
      for(const m of pend){
        m.attempts++;
        try{
          const res = await this._send(m);
          m.status = 'sent';
          m.providerMessageId = res.id;
          m.lastError = null;
          m.sentAt = nowISO();
          addLog('info','whatsapp','تم إرسال رسالة (' + m.template + ') للطلب ' + m.orderNumber, { messageId:m.id });
        }catch(err){
          m.lastError = err.message || 'فشل الإرسال';
          if(m.attempts >= this.MAX_ATTEMPTS){
            m.status = 'failed';
            addLog('error','whatsapp','فشل نهائي في إرسال رسالة الطلب ' + m.orderNumber + ' — ' + m.lastError, { messageId:m.id });
          }else{
            m.nextAttemptAt = new Date(Date.now() + m.attempts * 4000).toISOString();
            addLog('warn','whatsapp','محاولة ' + m.attempts + ' فشلت، ستُعاد (' + m.orderNumber + ')', { messageId:m.id });
          }
        }
        m.updatedAt = nowISO();
      }
      if(pend.length) commit('whatsapp');
    } finally { this.processing = false; }
  },

  /**
   * محاكاة نداء الخادم:
   *   POST {BACKEND}/api/whatsapp/send  →  WhatsApp Cloud API /messages
   * لا تُوضع أي مفاتيح أو أسرار في الواجهة.
   */
  _send(m){
    return new Promise((resolve, reject) => {
      setTimeout(() => {
        if(!m.to) return reject(new Error('لا يوجد رقم مستلم'));
        if(Math.random() < 0.22) return reject(new Error('تعذّر الاتصال بمزوّد WhatsApp (503)'));
        resolve({ id: 'wamid.DEMO.' + uid('MSG', 12) });
      }, 380 + Math.random() * 420);
    });
  },

  async retryAllFailed(){
    const failed = Store.data.whatsappMessages.filter(m => m.status === 'failed');
    failed.forEach(m => { m.status = 'queued'; m.attempts = 0; m.nextAttemptAt = nowISO(); });
    commit('whatsapp');
    this.process();
    return failed.length;
  }
};

/* ----------------------------- 5.2 Loyalty ------------------------------ */
/* قواعد: تُضاف النقاط بعد التسليم المؤكد فقط، ولا تُضاف مرتين لنفس الطلب،
   وكل عملية تُسجَّل في سجل تدقيق مرتبط بالعميل والطلب. */
const Loyalty = {
  awardForOrder(order, settings){
    const L = settings.loyalty;
    if(!L || !L.enabled) return null;
    if(order.status !== 'delivered') return null;             // شرط التسليم المؤكد
    if(order.loyaltyAwarded) return null;                     // منع الإضافة المزدوجة
    const db = Store.data;
    const already = db.loyaltyTransactions.some(t => t.orderId === order.id && t.type === 'earn');
    if(already){ order.loyaltyAwarded = true; return null; }
    const c = db.customers.find(x => x.id === order.customerId);
    if(!c) return null;
    const pts = Math.max(0, Math.round(Number(order.total) * Number(L.pointsPerCurrency)));
    if(pts <= 0){ order.loyaltyAwarded = true; return null; }
    c.points += pts;
    const tx = {
      id: uid('LTX',6), customerId:c.id, orderId:order.id, type:'earn', points:pts,
      balanceAfter:c.points, note:'نقاط طلب ' + order.number + ' (قيمة ' + money(order.total) + ')',
      at: nowISO(), byUserId:'system'
    };
    db.loyaltyTransactions.push(tx);
    order.loyaltyAwarded = true;
    addLog('info','loyalty','إضافة ' + pts + ' نقطة للعميل ' + c.name + ' عن الطلب ' + order.number, { orderId:order.id });
    /* إشعار العميل بالرصيد الجديد */
    EventBus.emit('loyalty:awarded', { customerId:c.id, points:pts, balance:c.points });
    return tx;
  },
  balanceOf(customerId){
    const c = Store.data.customers.find(x => x.id === customerId);
    return c ? c.points : 0;
  }
};

/* --------------------------- 5.3 Notifications -------------------------- */
const Notify = {
  soundOn: true,
  /** نغمة تنبيه مولّدة داخليًا (بدون ملفات صوتية خارجية) */
  beep(pattern){
    if(!this.soundOn) return;
    try{
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if(!Ctx) return;
      const ctx = new Ctx();
      const notes = pattern || [880, 1320];
      notes.forEach((f, i) => {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = 'sine'; o.frequency.value = f;
        o.connect(g); g.connect(ctx.destination);
        const t0 = ctx.currentTime + i * 0.16;
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.exponentialRampToValueAtTime(0.22, t0 + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.28);
        o.start(t0); o.stop(t0 + 0.3);
      });
      setTimeout(() => { try{ ctx.close(); }catch(e){} }, 1200);
    }catch(e){ /* المتصفح قد يمنع الصوت قبل تفاعل المستخدم */ }
  },
  /** إشعار سطح المكتب — باحترام إعدادات المتصفح وإذن المستخدم */
  desktop(title, body){
    try{
      if(!('Notification' in window)) return;
      if(Notification.permission === 'granted') new Notification(title, { body: body, dir:'rtl', lang:'ar' });
    }catch(e){}
  },
  async requestPermission(){
    try{
      if(!('Notification' in window)) return 'unsupported';
      const p = await Notification.requestPermission();
      return p;
    }catch(e){ return 'error'; }
  }
};

/** Toast */

let _modalCloser = null;
function closeModal(){
  const ov = $('#modalRoot').firstElementChild;
  if(ov){ ov.remove(); document.body.classList.remove('no-scroll'); }
  if(_modalCloser){ const f = _modalCloser; _modalCloser = null; try{ f(); }catch(e){} }
}
/**
 * openModal({ title, icon, body, actions:[{label,cls,onClick,disabled}], wide, sheet })
 * يدعم: Esc للإغلاق، حبس التركيز، إرجاع التركيز للعنصر السابق.
 */
function openModal(opts){
  closeModal();
  const prevFocus = document.activeElement;
  const ov = document.createElement('div');
  ov.className = 'overlay';
  ov.setAttribute('role', 'dialog');
  ov.setAttribute('aria-modal', 'true');
  ov.innerHTML =
    '<div class="modal' + (opts.wide ? ' wide' : '') + (opts.sheet ? ' sheet' : '') + '">' +
      '<div class="modal-head">' +
        (opts.icon ? '<span aria-hidden="true" style="font-size:1.3rem">' + opts.icon + '</span>' : '') +
        '<h3 class="grow">' + esc(opts.title || '') + '</h3>' +
        '<button class="iconbtn" data-close aria-label="إغلاق">✕</button>' +
      '</div>' +
      '<div class="modal-body">' + (opts.body || '') + '</div>' +
      (opts.actions && opts.actions.length ? '<div class="modal-foot"></div>' : '') +
    '</div>';
  const foot = $('.modal-foot', ov);
  if(foot){
    opts.actions.forEach((a, i) => {
      const b = document.createElement('button');
      b.className = 'btn ' + (a.cls || 'plain');
      b.type = 'button';
      b.textContent = a.label;
      if(a.disabled) b.disabled = true;
      if(a.id) b.id = a.id;
      b.addEventListener('click', () => a.onClick ? a.onClick(ov, b) : closeModal());
      foot.appendChild(b);
      if(i === 0 && a.autofocus) setTimeout(()=> b.focus(), 40);
    });
  }
  ov.addEventListener('click', e => { if(e.target === ov) closeModal(); });
  $('[data-close]', ov).addEventListener('click', closeModal);
  $('#modalRoot').appendChild(ov);
  document.body.classList.add('no-scroll');
  _modalCloser = () => { try{ prevFocus && prevFocus.focus(); }catch(e){} };

  /* حبس التركيز داخل النافذة */
  ov.addEventListener('keydown', e => {
    if(e.key === 'Escape'){ e.stopPropagation(); closeModal(); return; }
    if(e.key !== 'Tab') return;
    const f = $$('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])', ov)
      .filter(el => !el.disabled && el.offsetParent !== null);
    if(!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if(e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
    else if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
  });
  const auto = $('input, select, textarea, button', ov);
  if(auto) setTimeout(() => auto.focus(), 60);
  return ov;
}
/** نافذة تأكيد جاهزة */
function confirmDialog(opts){
  return new Promise(resolve => {
    openModal({

      ]
    });
  });
}

/** أدوات السلة */
const Cart = {
  count(){ return S.cart.reduce((s,l)=>s+l.qty,0); },
  lines(){
    return S.cart.map(l => {
      const p = Store.data.products.find(x => x.id === l.productId) || { name:'—', price:0, addons:[], image:'' };
      const addons = (l.addonIds||[]).map(id => (p.addons||[]).find(a=>a.id===id)).filter(Boolean);
      const unit = Number(p.price) + addons.reduce((s,a)=>s+a.price,0);
      return { lineId:l.lineId, product:Object.assign({},p), qty:l.qty, addons, note:l.note||'', unit, lineTotal:+(unit*l.qty).toFixed(2) };
    });
  },
  totals(){
    const lines = this.lines();
    const sub = lines.reduce((s,l)=>s+l.lineTotal,0);
    const st = S.settings || Store.data.settings;
    const discount = 0; // الخصومات تُطبق في الـ Backend عند التأكيد
    const base = Math.max(0, sub - discount);
    const service = +((base * (Number(st.serviceRate)||0))/100).toFixed(2);
    const vat = +(((base + service) * (Number(st.vatRate)||0))/100).toFixed(2);
    return { lines, subtotal:+sub.toFixed(2), discount, service, vat, total:+(base+service+vat).toFixed(2) };
  },
  add(productId, qty, addonIds, note){
    addonIds = (addonIds||[]).slice().sort();
    const same = S.cart.find(l => l.productId === productId &&
      JSON.stringify((l.addonIds||[]).slice().sort()) === JSON.stringify(addonIds) &&
      String(l.note||'') === String(note||''));
    if(same) same.qty += qty;
    else S.cart.push({ lineId: uid('LN',5), productId, qty, addonIds, note:note||'' });
    this.persist();
  },
  setQty(lineId, qty){
    const l = S.cart.find(x => x.lineId === lineId);
    if(!l) return;
    l.qty = Math.max(1, Math.min(50, qty));
    this.persist();
  },
  remove(lineId){ S.cart = S.cart.filter(l => l.lineId !== lineId); this.persist(); },
  clear(){ S.cart = []; this.persist(); },
  persist(){ saveSession(); }
};

/* ------------------------------ Router ---------------------------------- */
function parseRoute(){
  const raw = (location.hash || '#/').replace(/^#/, '');
  const qIdx = raw.indexOf('?');
  const path = (qIdx > -1 ? raw.slice(0, qIdx) : raw) || '/';
  const query = {};
  if(qIdx > -1){
    raw.slice(qIdx+1).split('&').forEach(kv => {
      const i = kv.indexOf('=');
      if(i > -1) query[decodeURIComponent(kv.slice(0,i))] = decodeURIComponent(kv.slice(i+1));
    });
  }
  const parts = path.split('/').filter(Boolean);
  return { path, parts, query };
}
function navigate(hash, replace){
  if(replace) location.replace('#' + hash.replace(/^#/, ''));
  else location.hash = hash.replace(/^#/, '');
}
function saveSession(){
  Api.session.save({
    customerId: S.customer ? S.customer.id : null,
    tableId: S.table ? S.table.id : null,
    cart: S.cart,
    adminId: S.admin.user ? S.admin.user.id : null,
    activeOrderId: S.activeOrderId
  });
}
function restoreSession(){
  const s = Api.session.get();
  if(!s) return;
  if(s.customerId) S.customer = Store.data.customers.find(c => c.id === s.customerId) || null;
  if(s.tableId) S.table = Store.data.tables.find(t => t.id === s.tableId) || null;
  if(Array.isArray(s.cart)) S.cart = s.cart.filter(l => Store.data.products.some(p => p.id === l.productId));
  if(s.adminId) S.admin.user = Store.data.adminUsers.find(u => u.id === s.adminId) || null;
  if(s.activeOrderId) S.activeOrderId = s.activeOrderId;
}

    const phone = $('#rPhone').value.trim();
    const tableId = $('#rTable').value || null;
    const consent = $('#rConsent').checked;
    let bad = false;
    $('#eName').textContent = ''; $('#ePhone').textContent = ''; $('#eTable').textContent = ''; $('#regErr').textContent = '';

    const btn = $('#regBtn'); btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> جارِ التسجيل…';

      btn.disabled = false; btn.textContent = 'متابعة إلى القائمة →';
    }
  });

/* الإجراءات العامة (تفويض أحداث) */
function bindGlobalActions(){
  document.addEventListener('click', async e => {
    const el = e.target.closest('[data-action]');
    if(!el) return;
    const action = el.dataset.action;
    const payload = el.dataset.payload;
    switch(action){
      case 'goto':
      case 'reload':
        if(action === 'reload'){ renderRoute(); break; }
        navigate(el.dataset.href);
        break;
      case 'open-item':      openItemModal(payload); break;
      case 'set-category':
        S.filters.categoryId = payload;
        $$('.chips .chip').forEach(c => c.setAttribute('aria-pressed', String(c.dataset.payload === payload)));
        refreshResults();
        break;
      case 'reset-filters':
        S.filters = { q:'', categoryId:'all', sort:'default', availableOnly:false };
        screenMenu();
        break;
      case 'toggle-available':
        S.filters.availableOnly = !S.filters.availableOnly;
        el.setAttribute('aria-pressed', String(S.filters.availableOnly));
        refreshResults();
        break;
      case 'qty-dec':  Cart.setQty(payload, (S.cart.find(l=>l.lineId===payload)||{}).qty - 1); screenCart(); cartChanged(); break;
      case 'qty-inc':  Cart.setQty(payload, (S.cart.find(l=>l.lineId===payload)||{}).qty + 1); screenCart(); cartChanged(); break;
      case 'remove-line':
        Cart.remove(payload); toast('تم حذف الصنف من السلة','info',{icon:'🗑️'}); screenCart(); cartChanged(); break;
      case 'clear-cart': {
        const ok = await confirmDialog({ title:'إفراغ السلة', message:'هل تريد حذف جميع الأصناف من السلة؟', danger:true, confirmLabel:'نعم، أفرغها' });
        if(ok){ Cart.clear(); screenCart(); cartChanged(); }
        break;
      }
      case 'theme': toggleTheme(); break;
      case 'logout': {
        const ok = await confirmDialog({ title:'تسجيل الخروج', message:'سيتم مسح جلستك الحالية وسلتك على هذا الجهاز.', danger:true, confirmLabel:'تسجيل الخروج' });
        if(ok){ S.customer = null; S.cart = []; S.table = null; S.activeOrderId = null; Api.session.clear(); applySettingsToChrome(); navigate('/'); toast('تم تسجيل الخروج','ok'); }
        break;
      }
      case 'admin-nav':   adminGo(payload); break;
      case 'admin-logout': await adminLogout(); break;
      case 'admin-close-side': S.admin.sideOpen = false; $('#adminApp').classList.remove('side-open'); $$('.adm-scrim').forEach(s=>s.remove()); break;
      default: break;
    }
  });

  /* التنقل بالهاش */
  window.addEventListener('hashchange', () => { renderRoute(); });

  /* اختصارات لوحة المفاتيح */
  document.addEventListener('keydown', e => {
    if(e.key === 'Escape'){ closeModal(); }
  });
}
function toggleTheme(){

function waStatusBadge(m){
  if(!m) return '<span class="badge">—</span>';
  const map = { sent:['green','تم الإرسال'], queued:['blue','في الطابور'], failed:['red','فشل الإرسال'], blocked:['amber','محجوبة (لا موافقة)'] };
  const v = map[m.status] || ['','—'];
  return '<span class="badge ' + v[0] + '">' + v[1] + '</span>';
}
function waStatusText(m){
  if(!m) return '';
  if(m.status === 'sent')      return 'أُرسلت إلى ' + m.to + ' (محاكاة Demo) — معرّف المزود: ' + (m.providerMessageId || '—');
  if(m.status === 'queued')    return 'في طابور الإرسال، محاولة رقم ' + (m.attempts + 1) + ' من ' + WhatsApp.MAX_ATTEMPTS;
  if(m.status === 'failed')    return 'فشل الإرسال بعد ' + m.attempts + ' محاولات — السبب: ' + (m.lastError || 'غير معروف') + '. يمكن للكاشير إعادة المحاولة.';
  if(m.status === 'blocked')   return 'لم تُرسل: ' + (m.lastError || 'العميل لم يوافق على رسائل WhatsApp');
  return '';
}

async function screenTrack(orderId){
  const orders = await Api.orders.list({ customerId:S.customer.id });
  if(!orders.length){
    setMain('<div class="wrap"><div class="sec-head"><h2>طلباتي</h2></div>' +
      stateBox('empty', { icon:'📦', title:'لا توجد طلبات بعد', text:'ابدأ أول طلب من القائمة وستظهر هنا حالته لحظيًا.', action:{ label:'تصفح القائمة', action:'goto', href:'#/menu' } }) + '</div>');
    return;
  }
  const id = orderId || (S.activeOrderId && orders.some(o=>o.id===S.activeOrderId) ? S.activeOrderId : orders[0].id);
  const order = orders.find(o => o.id === id) || orders[0];
  const hist = await Api.orders.history(order.id);
  const isOpen = ['pending','accepted','preparing','ready'].indexOf(order.status) > -1;
  const etaAt = addMinutes(order.etaMinutes, order.createdAt);
  const idx = STATUS[order.status].step;

  setMain(
    '<div class="wrap" style="max-width:820px">' +
      '<div class="sec-head"><div><h2>متابعة الطلب</h2>' +
        '<div class="sub">تحديثات فورية لحالة طلبك</div></div>' +
        '<button class="btn sm ghost" data-action="refresh-track">↻ تحديث</button>' +
      '</div>' +

      (orders.length > 1 ? '<div class="chips">' + orders.map(o =>
        '<button class="chip" data-action="goto" data-href="#/track/' + o.id + '" aria-pressed="' + (o.id === order.id ? 'true':'false') + '">' +
        '<span class="c" aria-hidden="true">' + STATUS[o.status].icon + '</span>' + esc(o.number) + '</button>').join('') + '</div>' : '') +

      '<div class="card pad">' +
        '<div class="row between wrap-x">' +
          '<div><div class="ordnum">' + esc(order.number) + '</div>' +
            '<div class="tiny muted">' + arDate(order.createdAt) + ' • ' + esc(order.payment) + '</div></div>' +
          '<span class="st" data-s="' + order.status + '"><i></i>' + STATUS[order.status].ar + '</span>' +
        '</div>' +

        (isOpen ? '<div class="mt" style="padding:12px;border-radius:var(--radius);background:var(--c-surface-2);display:flex;gap:10px;align-items:center">' +
            '<span style="font-size:1.4rem" aria-hidden="true">⏱️</span>' +
            '<div class="grow"><b>الوقت المتوقع للجهوزية</b><div class="tiny muted">حوالي <span class="num">' + order.etaMinutes + '</span> دقيقة من وقت الطلب — عند ' + arTime(etaAt) + '</div></div>' +
          '</div>' : '') +

        '<div class="divider"></div>' +
        '<h3>مراحل الطلب</h3>' +
        '<div class="timeline">' +
          FLOW.map((s, i) => {
            const h = hist.filter(x => x.to === s).pop();
            const cls = order.status === 'cancelled' ? (i === 0 ? 'done' : '') : (i < idx ? 'done' : i === idx ? 'active' : '');
            return '<div class="tl-step ' + cls + '">' +
              '<span class="dot" aria-hidden="true">' + (i < idx || (i === idx && order.status !== 'pending') ? '✓' : (i === idx ? '•' : '')) + '</span>' +
              '<div class="tl-t">' + STATUS[s].icon + ' ' + STATUS[s].ar + '</div>' +
              '<div class="tl-s">' + (h ? arTime(h.at) + (h.byName ? ' • ' + esc(h.byName) : '') : (i === idx ? 'جارٍ الآن…' : 'بانتظار')) + '</div>' +
            '</div>';
          }).join('') +
          (order.status === 'cancelled' ? '<div class="tl-step active"><span class="dot">⛔</span><div class="tl-t">تم إلغاء الطلب</div><div class="tl-s">' + esc(order.cancelReason || 'بدون سبب محدد') + '</div></div>' : '') +
        '</div>' +

        (isOpen ? '<div class="tiny muted mt">💡 يمكنك إلغاء الطلب فقط قبل قبوله من الكاشير.</div>' : '') +
      '</div>' +

      '<div class="card pad mt">' +
        '<h3>تفاصيل الطلب</h3>' +

          '<div class="row between"><b>' + esc(it.name) + ' <span class="num muted">× ' + it.qty + '</span></b><span class="cprice num">' + money(it.lineTotal) + '</span></div>' +
          (it.addons && it.addons.length ? '<div class="cadd">' + it.addons.map(a=>esc(a.name)).join('، ') + '</div>' : '') +
          (it.note ? '<div class="cnote"><span aria-hidden="true">📝</span> ' + esc(it.note) + '</div>' : '') +
        '</div></div>').join('') +
        (order.notes ? '<div class="tiny mt" style="padding:10px;background:var(--c-surface-2);border-radius:var(--radius)"><b>ملاحظات الطلب:</b> ' + esc(order.notes) + '</div>' : '') +
        '<div class="divider"></div>' +
        totalsHtml({ subtotal:order.subtotal, discount:order.discount, service:order.service, vat:order.vat, total:order.total }) +
      '</div>' +

      (order.status === 'pending' ? '<div class="row mt"><button class="btn red block" id="cancelMine">إلغاء الطلب</button></div>' : '') +
      (order.status === 'delivered' ? '<div class="card pad mt"><h3>قيّم تجربتك</h3>' + ratingStars(order) + '</div>' : '') +
      '<div style="height:40px"></div>' +
    '</div>'
  );

  $('[data-action="refresh-track"]').addEventListener('click', () => { toast('تم تحديث الحالة','info',{icon:'↻'}); renderRoute(); });
  const cm = $('#cancelMine');
  if(cm) cm.addEventListener('click', async () => {
    const ok = await confirmDialog({ title:'إلغاء الطلب', message:'هل تريد إلغاء الطلب رقم ' + order.number + '؟', danger:true, confirmLabel:'نعم، ألغِ الطلب' });
    if(!ok) return;
    try{
      await Api.orders.updateStatus(order.id, 'cancelled', { reason:'إلغاء من العميل قبل القبول', expectedStatus:'pending', note:'إلغاء من العميل' });
      toast('تم إلغاء الطلب','warn',{icon:'⛔'});
      renderRoute();
    }catch(err){ toast(err.message, 'err'); }
  });
  bindRating(order);
}
function ratingStars(order){
  return '<div class="row" style="gap:6px" id="rateRow">' +
    [1,2,3,4,5].map(n => '<button class="iconbtn" data-rate="' + n + '" aria-label="تقييم ' + n + ' من 5" style="font-size:1.3rem;' +
      (order.rating && n <= order.rating ? 'background:var(--c-gold);color:#1a1405;border-color:transparent' : '') + '">★</button>').join('') +
    '<span class="tiny muted grow" id="rateTxt">' + (order.rating ? 'تقييمك: ' + order.rating + '/5' : 'لم يتم التقييم بعد') + '</span>' +
  '</div><div class="tiny muted mt">ملاحظة: تقييمك مفيد للمطعم، ولا يؤثر على استحقاقك لنقاط الولاء — النقاط تُضاف بمجرد التسليم المؤكد.</div>';
}
function bindRating(order){
  const row = $('#rateRow');
  if(!row) return;
  $$('[data-rate]', row).forEach(b => b.addEventListener('click', async () => {
    try{
      await Api.orders.setRating(order.id, b.dataset.rate);
      toast('شكرًا لتقييمك! ⭐','ok');
      screenTrack(order.id);
    }catch(err){ toast(err.message,'err'); }
  }));
}

      '<div style="height:40px"></div>' +
    '</div>'
  );

  $('#consentBtn').addEventListener('click', async () => {
    try{
      const updated = await Api.customers.update(c.id, { whatsappConsent: !c.whatsappConsent });
      S.customer = updated;
      toast(updated.whatsappConsent ? 'تم تفعيل رسائل WhatsApp ✅' : 'تم إلغاء الموافقة على رسائل WhatsApp', 'ok');
      screenProfile();
    }catch(err){ toast(err.message,'err'); }
  });

  $$('[data-action="redeem"]').forEach(btn => btn.addEventListener('click', async e => {
    e.preventDefault();
    const r = rewards.find(x => x.id === btn.dataset.payload);
    if(!r) return;
    const ok = await confirmDialog({ title:'استبدال مكافأة', message:'استبدال «' + r.name + '» مقابل ' + r.points + ' نقطة؟', confirmLabel:'نعم، استبدل' });

    }catch(err){ toast(err.message, 'err'); btn.disabled = false; }
  }));
}

function bindAdminGate(){
  const form = $('#gateForm');
  if(!form) return;
  form.addEventListener('submit', async e => {
    e.preventDefault();
    const btn = $('#gateBtn'), errBox = $('#gateErr');
    errBox.textContent = '';
    btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> جارِ التحقق…';
    try{
      const user = await Api.admin.login($('#gUser').value, $('#gPin').value);
      S.admin.user = user;
      S.admin.section = 'dashboard';
      saveSession();
      toast('مرحبًا ' + user.name + ' — ' + ROLE_LABEL[user.role], 'ok');
      renderAdmin();
    }catch(err){
      errBox.textContent = err.message || 'تعذّر الدخول';
      btn.disabled = false; btn.textContent = 'دخول لوحة الإدارة 🔐';
      $('#gPin').value = ''; $('#gPin').focus();
    }
  });
}
async function adminLogout(){
  const ok = await confirmDialog({ title:'تسجيل الخروج', message:'إنهاء جلسة لوحة الإدارة؟', danger:true, confirmLabel:'خروج' });
  if(!ok) return;
  S.admin.user = null; S.admin.section = 'dashboard';
  saveSession();
  toast('تم تسجيل الخروج من اللوحة','ok');
  renderAdmin();
}
function adminGo(section){
  S.admin.section = section;
  navigate('/admin/' + section);
}

/* ---------------------- 8.2 توزيع الأقسام على الشاشة -------------------- */
async function renderAdminSection(){
  const box = $('#adminContent');
  if(!box) return;
  box.innerHTML = '<div class="panel"><div class="row"><span class="spinner"></span> جارِ التحميل…</div></div>';
  try{
    switch(S.admin.section){
      case 'dashboard': await admDashboard(box); break;
      case 'orders':    await admOrders(box); break;
      case 'menu':      await admMenu(box); break;
      case 'customers': await admCustomers(box); break;
      case 'loyalty':   await admLoyalty(box); break;
      case 'reports':   await admReports(box); break;
      case 'logs':      await admLogs(box); break;
      case 'settings':  await admSettings(box); break;
      case 'docs':      admDocs(box); break;
      default:          await admDashboard(box);
    }
  }catch(err){
    console.error(err);
    box.innerHTML = stateBox('error', { title:'تعذّر تحميل هذا القسم', text:(err && err.message) || '', action:{ label:'إعادة المحاولة', action:'reload' } });
  }
}

function statusButtons(o){
  const btns = [];
  if(o.status === 'pending'){
    if(can('orders.accept')) btns.push(btn('ad-status','accepted',o.id,'قبول الطلب ✅','green'));
    if(can('orders.cancel')) btns.push(btn('ad-cancel','',o.id,'إلغاء','red'));
  }
  if(o.status === 'accepted'){
    if(can('orders.prepare')) btns.push(btn('ad-status','preparing',o.id,'بدء التحضير 👨‍🍳','amber'));
    if(can('orders.cancel')) btns.push(btn('ad-cancel','',o.id,'إلغاء','red'));
  }
  if(o.status === 'preparing'){
    if(can('orders.ready')) btns.push(btn('ad-status','ready',o.id,'الطلب جاهز 🔔','blue'));
    if(can('orders.cancel')) btns.push(btn('ad-cancel','',o.id,'إلغاء','red'));
  }
  if(o.status === 'ready'){
    if(can('orders.deliver')) btns.push(btn('ad-status','delivered',o.id,'تم التسليم 🎉','gold'));
  }
  if(['delivered','cancelled'].indexOf(o.status) > -1){
    btns.push('<span class="badge">' + (o.status === 'delivered' ? 'مكتمل' : 'ملغي') + (o.cancelReason ? ': ' + esc(o.cancelReason) : '') + '</span>');
  }
  if(!btns.length) btns.push('<span class="badge amber">لا تملك صلاحية تغيير هذه الحالة</span>');
  return btns.join('');
}
function btn(action, payload, id, label, cls){
  return '<button class="btn ' + cls + '" data-action="' + action + '" data-payload="' + id + '"' +
    (payload ? ' data-next="' + payload + '"' : '') + '>' + label + '</button>';
}
